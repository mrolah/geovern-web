<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krízishét — Ranglista</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F4A57">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23FF9F45' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FF9F45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"></noscript>
<style>
:root{
  --bg:#050f14; --petrol:#0F4A57; --teal:#2AD1B5; --amber:#FF9F45;
  --text:#EAF4F4; --muted:#8FB0B5; --faint:#5E7A80;
  --card:rgba(5,15,20,.68); --cardline:rgba(42,209,181,.22);
  --font:'Roboto',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;
  min-height:100svh;display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease}
body.in{opacity:1}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1100px 700px at 72% 8%,rgba(15,74,87,.55),transparent 60%),
             radial-gradient(800px 600px at 8% 92%,rgba(42,209,181,.12),transparent 60%),var(--bg)}
header{display:flex;align-items:center;gap:18px;padding:2.4vh 3.4vw 0}
.logo{color:var(--text)}
.logo .wm{height:clamp(30px,4vh,46px);width:auto;display:block}
.wm-tag{fill:var(--muted)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:10px;font:700 clamp(11px,1.6vh,15px) var(--mono);letter-spacing:.14em;color:var(--teal)}
.live .dot{width:.9em;height:.9em;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);animation:pulse 1.6s ease-in-out infinite}
.live.err{color:var(--amber)}
.live.err .dot{background:var(--amber);box-shadow:0 0 12px var(--amber);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4vw 1vh;min-height:0}
h1{font-size:clamp(26px,5.4vh,54px);font-weight:900;line-height:1.1;text-align:center}
h1 span{color:var(--teal)}
.sub{font:500 clamp(11px,1.7vh,15px) var(--mono);letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase;margin:.8vh 0 2.6vh;text-align:center}
#board{width:min(860px,92vw);display:flex;flex-direction:column;gap:1vh}
.row{display:flex;align-items:center;gap:2.2vw;background:var(--card);border:1px solid rgba(143,176,181,.14);
  border-radius:14px;padding:1.1vh 2.4vw;backdrop-filter:blur(10px)}
.row .rk{font:700 clamp(16px,2.8vh,26px) var(--mono);color:var(--faint);min-width:2.2em;text-align:center}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:clamp(17px,3vh,28px);font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who i{display:block;font-style:normal;font-size:clamp(11px,1.8vh,16px);color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font:700 clamp(19px,3.4vh,32px) var(--mono);color:var(--text)}
.row .tm{font:500 clamp(11px,1.8vh,16px) var(--mono);color:var(--faint);min-width:4.4em;text-align:right}
.row.p1{border-color:rgba(255,159,69,.55);background:linear-gradient(90deg,rgba(255,159,69,.14),var(--card) 60%)}
.row.p1 .rk{font-size:clamp(22px,3.6vh,34px)}
.row.p1 .sc{color:var(--amber)}
.row.p2 .rk,.row.p3 .rk{font-size:clamp(19px,3.1vh,29px)}
.row.p2{border-color:rgba(234,244,244,.3)}
.row.p3{border-color:rgba(255,159,69,.25)}
.row.fresh{animation:land .9s ease}
@keyframes land{0%{transform:translateY(-14px);opacity:0;box-shadow:0 0 0 rgba(42,209,181,0)}
  45%{box-shadow:0 0 34px rgba(42,209,181,.45)}100%{transform:none;opacity:1;box-shadow:none}}
.empty{text-align:center;color:var(--muted);font-size:clamp(15px,2.4vh,22px);padding:6vh 0}
footer{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:0 3.4vw 2vh;font:500 clamp(10px,1.5vh,14px) var(--mono);color:var(--faint)}
footer b{color:var(--muted);font-weight:500}
/* mobil: fix betűméretek, görgethető lista, tördelt lábléc */
@media(max-width:640px){
  header{padding:14px 16px 0;gap:10px}
  .logo .wm{height:24px}
  h1{font-size:27px}
  .sub{font-size:10.5px;letter-spacing:.14em;margin:6px 0 16px}
  main{padding:10px 14px 8px}
  #board{width:100%;gap:8px}
  .row{gap:10px;padding:10px 12px;border-radius:12px}
  .row .rk{font-size:15px;min-width:1.9em}
  .row.p1 .rk,.row.p2 .rk,.row.p3 .rk{font-size:19px}
  .row .who b{font-size:16px}
  .row .who i{font-size:11px}
  .row .sc{font-size:20px}
  .row .tm{font-size:10.5px;min-width:3.6em}
  footer{flex-direction:column;align-items:flex-start;gap:3px;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){.live .dot,.row.fresh{animation:none}}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html" tabindex="-1">
    <img class="wm" src="/logo/geovern-wm.svg" alt="GEOVERN — independent geospatial advisory">
  </a>
  <div class="spacer"></div>
  <div class="live" id="live"><span class="dot"></span><span id="livetxt">ÉLŐ</span></div>
</header>

<main>
  <h1>Krízishét <span>🏆</span> Ranglista</h1>
  <p class="sub">5 nap · 5 döntés · GIS-adatokkal könnyebb</p>
  <div id="board"><div class="empty">Kapcsolódás a ranglistához…</div></div>
</main>

<footer>
  <span>Játssz te is: <b>geovern.com/jatek-swipe.html</b></span>
  <span id="upd"></span>
</footer>

<script>
const WEBHOOK='https://script.google.com/macros/s/AKfycbx7Lq52ZcTT4ymVIErqxAgnADyNcStpUlG0Z0pt-07C2qzP4jlR1IeY24HjXI_FZv8C/exec';
const POLL_MS=10000, SHOW_TIME=true;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const MEDAL=['🥇','🥈','🥉'];
let lastJSON='';

function render(board){
  const el=document.getElementById('board');
  if(!board.length){el.innerHTML='<div class="empty">Még nincs beérkezett eredmény — tiéd lehet az első hely! 🚀</div>';lastJSON='[]';return;}
  const j=JSON.stringify(board);
  if(j===lastJSON)return; /* nincs változás — nem villogtatjuk újra */
  const old={};try{JSON.parse(lastJSON||'[]').forEach(b=>old[b.nick+'|'+(b.org||'')]=b.score);}catch(e){}
  el.innerHTML=board.map((b,i)=>{
    const key=b.nick+'|'+(b.org||'');
    const fresh=lastJSON&&old[key]!==b.score; /* új vagy javított sor — kis landolás-animáció */
    return `<div class="row p${i+1}${fresh?' fresh':''}">
      <span class="rk">${i<3?MEDAL[i]:'#'+(i+1)}</span>
      <span class="who"><b>${esc(b.nick)}</b>${b.org?`<i>${esc(b.org)}</i>`:''}</span>
      <span class="sc">${b.score}</span>
      ${(SHOW_TIME&&b.time!=null)?`<span class="tm">⏱ ${fmtTime(b.time)}</span>`:'<span class="tm"></span>'}
    </div>`;
  }).join('');
  lastJSON=j;
}

function setLive(ok){
  const l=document.getElementById('live');
  l.classList.toggle('err',!ok);
  document.getElementById('livetxt').textContent=ok?'ÉLŐ':'NINCS KAPCSOLAT';
  if(ok)document.getElementById('upd').textContent='frissítve: '+new Date().toLocaleTimeString('hu-HU');
}

async function poll(){
  try{
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(WEBHOOK+'?t='+Date.now(),{signal:ctrl.signal});
    clearTimeout(to);
    const j=await r.json();
    if(j&&j.ok){render(j.board||[]);setLive(true);}
    else setLive(false);
  }catch(e){setLive(false);}
  setTimeout(poll,POLL_MS);
}

poll();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('in')));
</script>
<script>window.addEventListener('pageshow',function(){document.body.style.opacity='';document.body.classList.add('in');});</script>
</body>
</html>
