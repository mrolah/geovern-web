<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kivetítő · Hőhullám</title>
<style>
  :root { --ink:#efe6d3; --muted:#d8cdb6; --bar:#8c7a5e; --bar2:#d9c49a; --glass:rgba(22,19,16,.74); --track:rgba(255,255,255,.14); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#1f1d1b; color:var(--ink); font-family:"Calibri Light","Segoe UI Light","Segoe UI",Helvetica,Arial,sans-serif; overflow:hidden; }
  /* háttérkép: két réteg, áttűnéssel váltanak (a jelenetek képei előre betöltve) */
  .bg { position:fixed; inset:0; background:#1f1d1b center/cover no-repeat; opacity:0; transition:opacity .7s ease; }
  .bg.on { opacity:1; }
  /* vékony átmenet csak a felső sávon, hogy a cím és a QR olvasható legyen a világos égen */
  #scrim { position:fixed; left:0; right:0; top:0; height:26vh; background:linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,0)); pointer-events:none; }

  .top { position:fixed; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:flex-start; padding:2.4vh 2.6vw 0; }
  h1 { font-weight:300; font-size:2.7vw; max-width:64vw; margin:0; letter-spacing:.01em; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .q { color:var(--muted); font-size:1.5vw; margin:.4vh 0 0; text-shadow:0 1px 10px rgba(0,0,0,.6); }
  .join { display:flex; align-items:center; gap:1.2vw; background:var(--glass); backdrop-filter:blur(8px); border-radius:1.2vw; padding:1vw 1.3vw; }
  .join .url { font-size:1.55vw; letter-spacing:.02em; white-space:nowrap; }
  .join .hint { color:var(--muted); font-size:1.05vw; margin-top:.3vh; }
  #qr { width:9.5vw; height:9.5vw; background:#fff; padding:.5vw; border-radius:.6vw; display:none; }
  #qr.on { display:block; }
  #qr img, #qr canvas { width:100%; height:100%; display:block; }

  /* eredménysáv alul */
  .band { position:fixed; left:0; right:0; bottom:0; padding:0 2.6vw 3.6vh; display:grid; grid-template-columns:1fr 1fr; gap:1.4vw; }
  .band.single { grid-template-columns:1fr; }
  .panel { background:var(--glass); backdrop-filter:blur(8px); border-radius:1.2vw; padding:1.3vh 1.4vw 1.2vh; opacity:.55; transition:opacity .4s; }
  .panel.live, .panel.reveal { opacity:1; }
  .panel.live { outline:1.5px solid var(--bar2); }
  .panel.hidden { display:none; }
  .ph { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.8vh; }
  .ph h2 { font-weight:300; font-size:1.7vw; margin:0; }
  .ph .n { color:var(--muted); font-size:1.1vw; }
  .row { display:grid; grid-template-columns:2.3vw minmax(0,20vw) 1fr 5.2vw; align-items:center; gap:.9vw; margin:.7vh 0; }
  .single .row { grid-template-columns:2.3vw minmax(0,34vw) 1fr 6vw; }
  .row .k { width:2.3vw; height:2.3vw; border-radius:50%; background:rgba(255,255,255,.12); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:1.25vw; }
  .row .t { font-size:1.05vw; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:2.6vw; background:var(--track); border-radius:.6vw; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--bar); border-radius:.6vw; transition:width .6s ease; }
  .live .bar i, .reveal .bar i { background:var(--bar2); }
  .row .v { text-align:right; font-size:1.5vw; font-variant-numeric:tabular-nums; line-height:1.05; }
  .row .v small { display:block; font-size:.9vw; color:var(--muted); }
  .state { position:fixed; left:2.6vw; bottom:.7vh; color:rgba(239,230,211,.55); font-size:.8vw; }

  /* „csak a kép” jelenetek (0 és a rétegek): a szavazófelület, a QR és a cím eltűnik, a kép tisztán látszik */
  body.bare #scrim, body.bare .top, body.bare .band, body.bare .state { display:none; }
  body.bare.err .state { display:block; color:#e8b9a5; }
</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div id="scrim"></div>
<div class="top">
  <div><h1 id="cim"></h1><p class="q" id="kerdes"></p></div>
  <div class="join"><div><div class="url" id="url"></div><div class="hint">telefonnal: nyissa meg, és válasszon</div></div><div id="qr"></div></div>
</div>
<div class="band" id="band">
  <div class="panel" id="p1"><div class="ph"><h2 id="t1"></h2><div class="n" id="n1">—</div></div><div id="rows1"></div></div>
  <div class="panel" id="p2"><div class="ph"><h2 id="t2"></h2><div class="n" id="n2">—</div></div><div id="rows2"></div></div>
</div>
<div class="state" id="state">kapcsolódás…</div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const C = window.SZAVAZAS, $ = s => document.querySelector(s);
  const N = C.NEZETEK || { 0: { kep: C.HATTERKEP || '' } };
  $('#cim').textContent = C.CIM; $('#kerdes').textContent = C.KERDES; $('#url').textContent = C.ROVID_URL;
  $('#t1').textContent = C.KOROK[1]; $('#t2').textContent = C.KOROK[2];

  // a jelenetek képei előre betöltve, hogy a váltás a terem wifijén is azonnali legyen
  for (const v of Object.keys(N)) if (N[v].kep) { const im = new Image(); im.src = N[v].kep; }

  // háttérváltás áttűnéssel (két réteg)
  let shownKep = null, front = 'A';
  function setBg(kep) {
    if (kep === shownKep) return;
    shownKep = kep;
    const next = front === 'A' ? 'B' : 'A';
    const el = $('#bg' + next), old = $('#bg' + front);
    el.style.backgroundImage = kep ? 'url("' + kep + '")' : 'none';
    el.classList.add('on'); old.classList.remove('on');
    front = next;
  }

  // QR: előre legenerált kép (config.QR_KEP), különben a böngésző rajzolja a szavazó oldal címére
  const voteUrl = location.href.replace(/kivetito\.html.*$/, '');
  try {
    if (C.QR_KEP) { const im = document.createElement('img'); im.src = C.QR_KEP; im.alt = 'QR'; $('#qr').appendChild(im); $('#qr').classList.add('on'); }
    else if (window.QRCode) { new QRCode($('#qr'), { text: voteUrl, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); $('#qr').classList.add('on'); }
  } catch(e) {}

  for (const r of [1,2]) {
    const box = $('#rows' + r);
    for (const k of ['A','B','C','D']) {
      box.insertAdjacentHTML('beforeend',
        `<div class="row"><div class="k">${k}</div><div class="t" title="${C.OPCIOK[k]}">${C.OPCIOK[k]}</div><div class="bar"><i id="b${r}${k}"></i></div><div class="v"><span id="v${r}${k}">0</span><small id="s${r}${k}"></small></div></div>`);
    }
  }

  // Jelenet: a vezérlő állítja (a szerver „view” mezője); kézi felülírás a laptopon: 0–6 = jelenet, A = vissza a vezérlőre.
  //   kor nélküli jelenet (0, rétegek): csak a kép.  kor = 1: 1. panel.  kor = 2: élő 2. kör alatt a 2. panel,
  //   lezárás után (kör = 0) mindkettő egymás mellett = reveal.  R = mindkét panel kényszerítve.
  let manualView = null, manualBoth = false;
  function applyView(serverView, live) {
    const v = manualView !== null ? manualView : serverView;
    const n = N[v] || N[0] || {};
    setBg(n.kep || '');
    const bare = !n.kor;
    document.body.classList.toggle('bare', bare);
    let mode = 'both';
    if (!bare && !manualBoth) mode = n.kor === 1 ? 1 : (live === 2 ? 2 : 'both');
    $('#band').classList.toggle('single', mode !== 'both');
    $('#p1').classList.toggle('hidden', mode === 2);
    $('#p2').classList.toggle('hidden', mode === 1);
    return v;
  }
  async function tick() {
    try {
      const j = await window.SZAVAZAS_get('a=results');
      const live = Number(j.round) || 0;
      const v = applyView(Number(j.view) || 0, live);
      for (const r of [1,2]) {
        const c = j.rounds[String(r)] || {A:0,B:0,C:0,D:0,n:0};
        const n = c.n || 0, max = Math.max(1, c.A, c.B, c.C, c.D);
        $('#p' + r).classList.toggle('live', live === r);
        $('#p' + r).classList.toggle('reveal', live === 0);
        $('#n' + r).textContent = n + ' szavazat' + (live === r ? ' · él' : (live === 0 ? ' · lezárva' : ''));
        for (const k of ['A','B','C','D']) {
          $('#b' + r + k).style.width = (100 * c[k] / max) + '%';
          $('#v' + r + k).textContent = c[k];
          $('#s' + r + k).textContent = n ? Math.round(100 * c[k] / n) + ' %' : '';
        }
      }
      document.body.classList.remove('err');
      $('#state').textContent = 'jelenet: ' + v + (manualView !== null ? ' (kézi)' : '') + ' · aktív kör: ' + (live || 'zárva — eredmény') + ' · ' + new Date().toLocaleTimeString('hu-HU') + ' · billentyű: 0–6 jelenet, R mindkét panel, A vissza a vezérlőre';
    } catch(e) { document.body.classList.add('err'); $('#state').textContent = 'nincs kapcsolat a backenddel — ' + (e && e.message ? e.message : '') + ' — ' + C.API; }
  }
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[0-9]$/.test(k) && N[k]) manualView = Number(k);
    else if (k === 'r') manualBoth = !manualBoth;
    else if (k === 'a') { manualView = null; manualBoth = false; }
    else return;
    tick();
  });
  tick(); setInterval(tick, C.FRISSITES_MS || 2000);
})();
</script>
</body>
</html>
