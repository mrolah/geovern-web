<style>
:root{
  --bg:#050f14; --petrol:#0F4A57; --teal:#2AD1B5; --amber:#FF9F45;
  --text:#EAF4F4; --muted:#8FB0B5; --faint:#5E7A80;
  --card:rgba(5,15,20,.68); --cardline:rgba(42,209,181,.22);
  --font:'Roboto',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;overflow:hidden;
  opacity:0;transition:opacity .5s ease}
body.in{opacity:1}
a{color:var(--teal);text-decoration:none}
#map{position:fixed;inset:0;z-index:0}
body.maperr #map{display:none}
body.maperr::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(900px 600px at 70% 20%,rgba(15,74,87,.55),transparent 60%),
             radial-gradient(700px 500px at 15% 85%,rgba(42,209,181,.12),transparent 60%),var(--bg)}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,15,20,.65) 0%,transparent 15%,transparent 88%,rgba(5,15,20,.6) 100%)}
/* topbar */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:16px;
  padding:14px 26px;background:linear-gradient(180deg,rgba(5,15,20,.85),transparent)}
.logo{display:block;color:var(--text)}
.logo .wm{height:38px;width:auto;display:block}
.wm-o{fill:var(--amber)}
.wm-tag{fill:var(--muted)}
.spacer{flex:1}
.navlink{font-size:13.5px;font-weight:500;color:var(--muted)}
.navlink:hover{color:var(--teal)}
.lang{display:flex;gap:3px;border:1px solid rgba(143,176,181,.3);border-radius:8px;padding:3px;backdrop-filter:blur(6px)}
.lang button{background:none;border:none;color:var(--faint);font:700 12px var(--mono);padding:4px 9px;border-radius:6px;cursor:pointer}
.lang button.active{background:var(--teal);color:#04211d}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;font-weight:700;font-size:13.5px;
  cursor:pointer;border:1px solid transparent;transition:.2s;background:var(--teal);color:#04211d}
.btn:hover{background:#63e6cf;transform:translateY(-1px)}
/* infókártya */
.panel{position:fixed;left:26px;top:96px;z-index:5;max-width:340px;background:var(--card);
  border:1px solid var(--cardline);border-radius:16px;padding:26px 28px;backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
@media(max-width:640px){.panel{left:14px;right:14px;top:76px;max-width:none;padding:18px 20px}}
.eyebrow{font:500 12px var(--mono);letter-spacing:.18em;color:var(--teal);margin-bottom:12px;display:block}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:900;line-height:1.15;margin-bottom:10px}
.sub{color:var(--muted);font-size:13.5px}
.hint{font:400 12px var(--mono);color:var(--faint);margin-top:12px}
.sub-bp{margin-top:6px}
@media(max-width:640px){.sub-bp{display:none}} /* mobilon a Budapest-tipp a buborékban van (gomb) */
/* referencia-markerek: a külső elemet a MapLibre pozicionálja (transform) — azon nincs átmenet, különben a jelölő
   „lemarad” a térképtől nagyításkor és mozgatáskor. A kinézet és a hover-nagyítás a belső elemen van. */
.rmk{cursor:pointer}
.rmk-i{border-radius:50%;background:var(--amber);color:#231303;
  font:700 12px var(--mono);display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(5,15,20,.9);box-shadow:0 0 14px rgba(255,159,69,.65);transition:transform .15s,opacity .25s}
.rmk:hover .rmk-i{transform:scale(1.15)}
.rmk.s1 .rmk-i{width:22px;height:22px}
.rmk.s2 .rmk-i{width:28px;height:28px;font-size:13px}
.rmk.s3 .rmk-i{width:38px;height:38px;font-size:15px}
/* Budapest: közelről minden ügyfél a projekt idején érvényes székhelyén (a város-jelölő helyett) */
.rmk.hq .rmk-i{width:16px;height:16px;font-size:10px;box-shadow:0 0 10px rgba(255,159,69,.7)}
.rmk.hq.n2 .rmk-i{width:21px;height:21px;font-size:11px}
.rmk.hq.anon .rmk-i{background:rgba(5,15,20,.85);color:var(--amber);border:2px dashed var(--amber);box-shadow:none;width:22px;height:22px;font-size:11px}
body:not(.zb) .rmk.hq{visibility:hidden;pointer-events:none}body:not(.zb) .rmk.hq .rmk-i{opacity:0}
body.zb .rmk.bp{visibility:hidden;pointer-events:none}body.zb .rmk.bp .rmk-i{opacity:0}
.rp-addr{display:block;font:400 10.5px var(--mono);color:var(--faint);margin-top:2px}
.rp-go{display:inline-block;margin-top:9px;font:700 12px var(--font);color:var(--teal);cursor:pointer;background:none;border:none;padding:0}
/* popup */
.maplibregl-popup-content{background:#07181e!important;border:1px solid var(--cardline);border-radius:12px!important;
  color:var(--text);font-family:var(--font);padding:14px 16px!important;box-shadow:0 16px 50px rgba(0,0,0,.55)!important;max-width:260px}
.maplibregl-popup-tip{border-top-color:#07181e!important;border-bottom-color:#07181e!important}
.maplibregl-popup-close-button{color:var(--faint);font-size:18px;right:6px;top:4px}
.rp-city{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
.rp-list{max-height:200px;overflow:auto;padding-right:6px}
.rp-row{padding:5px 0;border-bottom:1px solid rgba(143,176,181,.12)}
.rp-row:last-child{border-bottom:none}
.rp-row b{display:block;font-size:12.5px;line-height:1.25}
.rp-row span{font:400 11px var(--mono);color:var(--muted)}
/* zoom-vezérlő igazítás */
.maplibregl-ctrl-top-right{top:70px}
.maplibregl-ctrl-group{background:#0b1d24!important;border:1px solid rgba(143,176,181,.3)}
.maplibregl-ctrl-group button{background:transparent!important}
.maplibregl-ctrl-group button span{filter:invert(.85)}
</style>

const TT=x=>typeof x==='string'?x:x[L];

/* ============ TÉRKÉP ============ */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let map=null,mapReady=false,popup=null,refMarkers=[],L='hu';
function initMap(){
  if(typeof maplibregl==='undefined'){document.body.classList.add('maperr');return;}
  try{
    map=new maplibregl.Map({container:'map',
      style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center:[9.0,48.3],zoom:2.6,pitch:10,bearing:0,
      attributionControl:{compact:true},interactive:true});
  }catch(e){document.body.classList.add('maperr');return;}
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.on('error',e=>{if(!mapReady&&e.error&&/style|source/i.test(String(e.error.message||''))){document.body.classList.add('maperr');}});
  map.on('zoom',zoomClass);
  map.on('load',()=>{
    mapReady=true;
    buildRefMarkers();
    /* finom beúszás Európára */
    if(!RM)map.flyTo({center:[9.0,48.3],zoom:3.5,pitch:25,duration:2500,essential:true});
    else map.jumpTo({center:[9.0,48.3],zoom:3.5,pitch:25});
    setTimeout(()=>{if(!popup&&refMarkers.length)openRefPopup(0);},2800);
  });
}
/* Budapest közelről (ZB-től): a város-jelölő helyett minden ügyfél a székhelyén; azonos címen egy jelölő, számmal */
const ZB=9,BP=0;
function rmkEl(cls,txt,title){const el=document.createElement('div');el.className='rmk '+cls;el.title=title||'';
  const i=document.createElement('div');i.className='rmk-i';i.textContent=txt;el.appendChild(i);return el;}
function hqGroups(){const g=new Map(),anon=[];REFP[BP][2].forEach(x=>{if(!x[3]){anon.push(x);return;}const k=x[3][0]+','+x[3][1];if(!g.has(k))g.set(k,{ll:[x[3][0],x[3][1]],addr:x[3][2],items:[]});g.get(k).items.push(x);});return{groups:[...g.values()],anon};}
function buildRefMarkers(){
  refMarkers.forEach(m=>m.remove());refMarkers=[];
  if(!mapReady)return;
  REFP.forEach((r,i)=>{
    const n=r[2].length;
    const el=rmkEl((n>=10?'s3':n>=3?'s2':'s1')+(i===BP?' bp':''),n,TT(r[0]));
    el.addEventListener('click',ev=>{ev.stopPropagation();openRefPopup(i);});
    refMarkers.push(new maplibregl.Marker({element:el}).setLngLat(r[1]).addTo(map));
  });
  const H=hqGroups();
  H.groups.forEach(g=>{const n=g.items.length;const el=rmkEl('hq'+(n>1?' n2':''),n>1?n:'',g.items.map(x=>TT(x[0])).join(' · '));
    el.addEventListener('click',ev=>{ev.stopPropagation();openHqPopup(g);});
    refMarkers.push(new maplibregl.Marker({element:el}).setLngLat(g.ll).addTo(map));});
  if(H.anon.length){const el=rmkEl('hq anon',H.anon.length,I18N[L].anon);
    el.addEventListener('click',ev=>{ev.stopPropagation();openHqPopup({ll:REFP[BP][1],addr:null,items:H.anon});});
    refMarkers.push(new maplibregl.Marker({element:el}).setLngLat(REFP[BP][1]).addTo(map));}
  zoomClass();
}
function zoomClass(){if(map)document.body.classList.toggle('zb',map.getZoom()>=ZB);}
const metaOf=x=>[x[1]?(typeof x[1]==='object'?x[1][L]:''+x[1]):null,REF_TAGS[x[2]][L]].filter(Boolean).join(' · ');
function openHqPopup(g){
  if(popup)popup.remove();
  const d=I18N[L];const cur=g.items.every(x=>!x[1]||typeof x[1]==='object');
  popup=new maplibregl.Popup({offset:12,closeButton:true}).setLngLat(g.ll)
    .setHTML(`<div class="rp-city">Budapest · ${g.addr?(cur?d.hqC:d.hqT):d.anon}</div>
      <div class="rp-list">${g.items.map(x=>`<div class="rp-row"><b>${TT(x[0])}</b><span>${metaOf(x)}</span></div>`).join('')}</div>
      ${g.addr?`<span class="rp-addr">${g.addr}</span>`:''}`).addTo(map);
}
function showBudapestHQ(){if(popup){popup.remove();popup=null;}
  const c={center:[19.075,47.495],zoom:11.1,pitch:30};RM?map.jumpTo(c):map.flyTo({...c,duration:1800,essential:true});}
function openRefPopup(i){
  const r=REFP[i];
  if(popup)popup.remove();
  popup=new maplibregl.Popup({offset:16,closeButton:true})
    .setLngLat(r[1])
    .setHTML(`<div class="rp-city">${TT(r[0])} · ${r[2].length}</div>
      <div class="rp-list">${r[2].map(x=>`<div class="rp-row"><b>${TT(x[0])}</b><span>${metaOf(x)}</span></div>`).join('')}</div>
      ${i===BP?`<button type="button" class="rp-go" onclick="showBudapestHQ()">${I18N[L].hqGo}</button>`:''}`)
    .addTo(map);
}

/* ============ NYELV ============ */
function applyLang(l){
  L=l;document.documentElement.lang=l;
  try{localStorage.setItem('gp-lang',l);}catch(e){}
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  const d=I18N[l];
  document.title=d.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{if(d[el.dataset.i18n]!==undefined)el.textContent=d[el.dataset.i18n];});
  if(popup){popup.remove();popup=null;}
  buildRefMarkers();
}
document.getElementById('lang').addEventListener('click',e=>{if(e.target.dataset.lang)applyLang(e.target.dataset.lang);});

/* ============ ÁTTŰNÉSES NAVIGÁCIÓ ============ */
document.querySelectorAll('a[data-fade]').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  document.body.classList.remove('in');
  setTimeout(()=>location.href=a.getAttribute('href'),380);
}));

/* ============ INIT ============ */
let startLang='hu';
try{const s=localStorage.getItem('gp-lang');if(s&&I18N[s])startLang=s;}catch(e){}
applyLang(startLang);
initMap();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('in')));
</script>
