<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vezérlő · Hőhullám</title>
<style>
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4efe6; color:#2b2622; margin:0; padding:24px 16px; }
  .wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:20px; font-weight:600; margin:0 0 14px; }
  button { display:block; width:100%; padding:16px; margin:0 0 10px; font-size:18px; border-radius:12px; border:1.5px solid #d8cdb6; background:#fffdf8; cursor:pointer; }
  button.on { background:#7a6a52; color:#fff; border-color:#7a6a52; }
  button.danger { color:#8a2f2f; }
  .st { margin:14px 0; color:#7a6a52; font-size:15px; }
  input { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1.5px solid #d8cdb6; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hőhullám-kör · vezérlő</h1>
  <input id="key" type="password" placeholder="kulcs (api.php: $KEY)">
  <button id="b1">1. kör nyitása — vakon</button>
  <button id="b2">2. kör nyitása — a rétegekkel</button>
  <button id="b0">Szavazás lezárása</button>
  <button id="bx" class="danger">Nullázás (új próba előtt)</button>
  <div class="st" id="st">—</div>
</div>
<script src="config.js"></script>
<script>
(function(){
  const C = window.SZAVAZAS, $ = s => document.querySelector(s);
  try { $('#key').value = sessionStorage.getItem('etosz_key') || ''; } catch(e) {}
  const api = (q) => fetch(C.API + (C.API.includes('?') ? '&' : '?') + q + '&t=' + Date.now(), {cache:'no-store'}).then(r => r.json());
  async function refresh() {
    try { const j = await api('a=results'); const r = Number(j.round) || 0;
      for (const [id, v] of [['b1',1],['b2',2],['b0',0]]) $('#' + id).classList.toggle('on', r === v);
      $('#st').textContent = 'aktív kör: ' + (r || 'zárva') + ' · 1. kör: ' + j.rounds['1'].n + ' szavazat · 2. kör: ' + j.rounds['2'].n + ' szavazat';
    } catch(e) { $('#st').textContent = 'nincs kapcsolat — ' + C.API; }
  }
  async function set(q) {
    const key = $('#key').value; try { sessionStorage.setItem('etosz_key', key); } catch(e) {}
    const j = await api(q + '&key=' + encodeURIComponent(key));
    if (!j.ok) alert('Nem sikerült: ' + (j.err === 'key' ? 'rossz kulcs' : JSON.stringify(j)));
    refresh();
  }
  $('#b1').onclick = () => set('a=setround&round=1');
  $('#b2').onclick = () => set('a=setround&round=2');
  $('#b0').onclick = () => set('a=setround&round=0');
  $('#bx').onclick = () => { if (confirm('Biztosan törlöd az összes szavazatot? (a régi fájl .bak néven megmarad)')) set('a=reset'); };
  refresh(); setInterval(refresh, 3000);
})();
</script>
</body>
</html>
