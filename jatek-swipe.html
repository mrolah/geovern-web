<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEOVERN — Krízishét</title>
<meta name="description" content="Krízishét — mobil döntésjáték: 5 nap, 5 balra-jobbra húzós polgármesteri döntés, a település valódi utcáin, iskolájánál, lejtőin (OpenStreetMap + domborzat).">
<meta name="theme-color" content="#050f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23FF9F45' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FF9F45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="jatekok/config.js?v=10"></script>
<script src="jatekok/gv.js?v=10"></script>
<script src="jatekok/gvmap.js?v=10"></script>
<style>
:root{
  --bg:#050f14; --teal:#2AD1B5; --amber:#FF9F45; --red:#ff8a7a;
  --text:#EAF4F4; --muted:#9BB7BC; --faint:#5E7A80;
  --card:rgba(6,17,22,.88); --line:rgba(42,209,181,.25);
  --font:'Roboto',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;
  opacity:0;transition:opacity .5s ease}
body.in{opacity:1}
/* A TÉRKÉP A FŐSZEREPLŐ — teljes képernyő, végig él */
#map{position:fixed;inset:0;z-index:0}
body.maperr #map{display:none}
body.maperr::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(900px 600px at 70% 20%,rgba(15,74,87,.55),transparent 60%),var(--bg)}
/* felső állapotsáv */
.topbar{position:fixed;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:100px;padding:9px 18px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.days{display:flex;gap:7px}
.days i{width:9px;height:9px;border-radius:50%;border:2px solid var(--faint);display:block}
.days i.done{background:var(--teal);border-color:var(--teal)}
.days i.cur{background:var(--amber);border-color:var(--amber);box-shadow:0 0 9px rgba(255,159,69,.8)}
.tb-t{font:500 13px var(--mono);color:var(--faint)}
.tb-s{font:500 16px var(--mono);color:var(--amber)}
.homelink{position:fixed;top:calc(10px + var(--sat));left:10px;z-index:40;
  font:700 12px var(--mono);letter-spacing:.06em;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(10px);text-decoration:none}
/* alsó lap (bottom sheet) */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;
  padding:0 12px calc(12px + var(--sab))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;backdrop-filter:blur(16px);box-shadow:0 -10px 50px rgba(0,0,0,.55)}
.g-center{text-align:center}
h2{font-size:24px;font-weight:900;line-height:1.15;margin-bottom:8px}
.sub{color:var(--muted);font-size:15.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:14px;
  font-weight:700;font-size:17px;cursor:pointer;border:none;transition:.2s;font-family:var(--font);
  background:var(--teal);color:#04211d;min-height:52px;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn-wide{width:100%}
.btn-replay{background:none;border:none;color:var(--faint);font:500 15px var(--font);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:10px;margin-top:10px}
/* típusválasztó */
.g-types{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.g-types button{border:2px solid rgba(42,209,181,.28);background:rgba(15,74,87,.3);border-radius:16px;
  padding:16px 10px;cursor:pointer;color:var(--text);font-family:var(--font);text-align:center;transition:.15s;touch-action:manipulation}
.g-types button:active{transform:scale(.97);border-color:var(--teal)}
.g-types .ic{font-size:36px;display:block;margin-bottom:4px}
.g-types b{font-size:16px;display:block}
.g-types span{font-size:12.5px;color:var(--faint)}
/* SWIPE-KÁRTYA */
.swipewrap{position:relative;touch-action:none}
.scard{background:linear-gradient(180deg,rgba(10,26,33,.97),rgba(6,17,22,.97));border:1.5px solid var(--line);
  border-radius:22px;padding:20px 18px 16px;box-shadow:0 18px 60px rgba(0,0,0,.6);
  cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform;position:relative}
.scard.drag{cursor:grabbing;transition:none!important}
.scard.spring{transition:transform .3s cubic-bezier(.2,.8,.3,1.2)}
.scard.fly{transition:transform .35s ease-in,opacity .35s ease-in;opacity:0}
.sc-disc{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--teal);margin-bottom:6px}
.sc-disc .ic{font-size:20px}
.sc-title{font-size:21px;font-weight:900;line-height:1.2;margin-bottom:6px}
.sc-setup{font-size:14.5px;line-height:1.4;color:var(--muted);margin-bottom:10px}
.sc-setup b{color:var(--text);font-weight:800;white-space:nowrap}
.sc-chip{display:flex;align-items:center;gap:10px;background:rgba(15,74,87,.25);border-radius:12px;
  padding:8px 12px;font-size:14px;color:var(--muted);margin-bottom:7px}
.sc-chip .ic{font-size:18px;flex:none}
/* a kérdés + bal/jobb opciók a kártya alján */
.sc-q{font-size:16.5px;font-weight:800;text-align:center;margin-top:10px;line-height:1.25}
/* bal/jobb opciók a kártya alján, két dobozban (a 3.5-ös elrendezés): cím + keret·idő + mit fed le */
.sc-opts{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.sc-opt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 11px;
  border-radius:14px;border:2px dashed rgba(143,176,181,.3);text-align:center}
.sc-opt .ic{font-size:26px;line-height:1}
.sc-opt .txt{min-width:0;max-width:100%}
.sc-opt b{display:block;font-size:13.5px;line-height:1.2}
.sc-opt small{display:block;line-height:1.3}
.sc-opt small.s1{font:700 11px var(--mono);color:var(--amber);margin-top:4px}
.sc-opt small.s2{font:500 11.5px var(--font);color:var(--muted);margin-top:2px}
.sc-opt .dir{font:700 12px var(--mono);color:var(--faint)}
.minicard .sc-opt{padding:8px 8px 9px}
@media(max-height:720px){.scard{padding:16px 16px 12px}.sc-chip{padding:7px 10px;font-size:13.5px;margin-bottom:6px}.sc-setup{font-size:14px}
  .minicard .sc-opt small.s2{display:none}}
.sc-opt.hotL{border-color:var(--red);background:rgba(255,138,122,.1)}
.sc-opt.hotR{border-color:var(--teal);background:rgba(42,209,181,.12)}
/* pecsétek */
.stamp{position:absolute;top:14px;font:900 21px var(--font);letter-spacing:.06em;padding:6px 14px;
  border:3px solid;border-radius:10px;opacity:0;pointer-events:none;text-transform:uppercase}
.stampL{left:14px;transform:rotate(-12deg);color:var(--red);border-color:var(--red)}
.stampR{right:14px;transform:rotate(12deg);color:var(--teal);border-color:var(--teal)}
.sc-hint{text-align:center;font:500 13px var(--mono);color:var(--faint);margin-top:10px}
/* swipe-affordance: pulzáló szélnyilak + bemutató kéz + meglóduló kártya */
.chevs{position:absolute;inset:0;pointer-events:none;z-index:4}
.chev{position:absolute;top:50%;font:900 30px var(--font);line-height:1}
.chev.cL{left:7px;color:var(--red);animation:chevL 1.6s ease-in-out infinite}
.chev.cR{right:7px;color:var(--teal);animation:chevR 1.6s ease-in-out infinite}
@keyframes chevL{0%,100%{transform:translate(0,-50%);opacity:.3}50%{transform:translate(-7px,-50%);opacity:.95}}
@keyframes chevR{0%,100%{transform:translate(0,-50%);opacity:.3}50%{transform:translate(7px,-50%);opacity:.95}}
.hand{position:absolute;left:50%;top:56%;font-size:46px;z-index:6;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.65));animation:handswipe 2.6s ease-in-out infinite}
@keyframes handswipe{
  0%,12%{transform:translate(-50%,0) rotate(0)}
  30%{transform:translate(calc(-50% + 72px),-8px) rotate(14deg)}
  48%{transform:translate(-50%,0) rotate(0)}
  66%{transform:translate(calc(-50% - 72px),-8px) rotate(-14deg)}
  84%,100%{transform:translate(-50%,0) rotate(0)}
}
.scard.demo{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{
  0%,12%{transform:translateX(0) rotate(0)}
  30%{transform:translateX(28px) rotate(2deg)}
  48%{transform:translateX(0) rotate(0)}
  66%{transform:translateX(-28px) rotate(-2deg)}
  84%,100%{transform:translateX(0) rotate(0)}
}
/* csökkentett animációnál a kéz statikusan is látszik, csak nem mozog */
@media(prefers-reduced-motion:reduce){.scard.demo,.hand,.chev{animation:none}.hand{transform:translate(-50%,0)}}
/* 2. fázis: a rétegsáv a kártya fölött, a lapban (a közös GV.layerControl chip-sora, ugyanott, mint a többi játékban) */
.sheet .gvl{margin:0 0 10px}
/* sötét buborék a kattintható jelölőkhöz (iskola) */
.maplibregl-popup-content{background:rgba(6,17,22,.96);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:500 13.5px/1.4 var(--font);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.maplibregl-popup-content b{color:var(--amber)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:rgba(6,17,22,.96)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:rgba(6,17,22,.96)}
.maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 6px}
.micon.act{pointer-events:auto;cursor:pointer;width:34px;height:34px;font-size:18px;border-width:2px}
.minicard .sc-title{font-size:17px;margin-bottom:2px}
.g-call{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--amber);margin-bottom:10px;line-height:1.4}
.g-call .ic{font-size:18px;flex:none}
.g-call.pending{color:var(--faint)}
/* kiértékelő pecsét-overlay */
.revstamp{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none}
.revstamp .st{font:900 34px var(--font);letter-spacing:.05em;padding:12px 26px;border:5px solid;border-radius:16px;
  transform:rotate(-8deg) scale(.6);opacity:0;text-transform:uppercase;backdrop-filter:blur(4px);
  animation:stampin .45s cubic-bezier(.2,.8,.3,1.3) forwards}
@keyframes stampin{to{transform:rotate(-8deg) scale(1);opacity:1}}
.revstamp .st.out{animation:stampout .9s ease forwards}
@keyframes stampout{to{transform:rotate(-8deg) translateY(-70px) scale(.85);opacity:0}}
.st.ok{color:var(--teal);border-color:var(--teal);background:rgba(6,30,27,.75)}
.st.no{color:var(--red);border-color:var(--red);background:rgba(35,12,10,.75)}
.rev-why{font-size:15px;color:var(--muted);margin:6px 0 12px}
.rev-earn{font:500 26px var(--mono);color:var(--amber);margin-bottom:12px}
.rev-earn i{font-style:normal;font-size:13px;color:var(--faint)}
/* következmény-jelek a térképen */
.cq{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:900 16px var(--font);box-shadow:0 3px 12px rgba(0,0,0,.6);border:2.5px solid}
.cq.ok{background:rgba(6,30,27,.9);color:var(--teal);border-color:var(--teal)}
.cq.bad{background:rgba(35,12,10,.9);color:var(--red);border-color:var(--red)}
/* űrlap + ranglista */
.g-form{display:grid;gap:11px;margin-top:14px;text-align:left}
.g-form input{background:rgba(15,74,87,.3);border:1.5px solid rgba(143,176,181,.32);
  border-radius:13px;padding:13px 15px;color:var(--text);font:400 16px var(--font);width:100%;min-height:48px}
.g-form input:focus{outline:none;border-color:var(--teal)}
.g-check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.g-check input{margin-top:3px;accent-color:var(--teal);width:17px;height:17px;min-height:0}
.g-err{font-size:13px;color:var(--red);min-height:17px}
.g-board{margin:12px 0;text-align:left;max-height:34dvh;overflow:auto}
.g-board .row{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(143,176,181,.13);font-size:15px}
.g-board .row span{min-width:0}
.g-board .row .borg{display:block;font-style:normal;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.g-board .row.me{background:rgba(42,209,181,.13);border-radius:10px;border-bottom-color:transparent}
.g-board .row b{font-family:var(--mono);font-weight:500}
.g-board .row b em{font-style:normal;color:var(--faint);font-size:11.5px;margin-left:6px}
.g-note{font-size:12.5px;color:var(--faint);margin-top:8px}
.g-sum{margin:12px 0;text-align:left}
.g-sum .row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(143,176,181,.13);font-size:14.5px}
.g-sum .row span{color:var(--muted)}
.g-sum .row b{font-family:var(--mono);font-weight:500}
.big{font:500 44px var(--mono);color:var(--amber);line-height:1}
@media(min-width:700px){
  .sheet{bottom:24px}
  h2{font-size:27px}
}
/* keskeny képernyőn az állapotsáv jobbra, hogy ne takarja a GEOVERN-gombot */
@media(max-width:480px){.topbar{left:auto;right:10px;transform:none;gap:10px;padding:8px 14px}}
/* a hidden attribútum a display:flex szabályokkal szemben is érvényesüljön (rétegsáv, állapotsáv) */
.topbar[hidden],.revstamp[hidden]{display:none!important}
/* v2 (OSM): betöltés, probléma-kiemelés a térképen, lejtő-címkék */
.g-load{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--muted);font-size:15px;margin-top:6px;min-height:24px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--faint);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.g-src{font:500 11.5px var(--mono);color:var(--faint);margin-top:10px;line-height:1.5}
.g-town-sub{font:500 12.5px var(--mono);color:var(--faint);margin-top:-10px;margin-bottom:14px}
/* pulzáló „itt a baj” jel */
.pulse{position:relative;width:26px;height:26px;pointer-events:none}
.pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--amber)}
.pulse::before{animation:pulse 1.8s ease-out infinite}
.pulse::after{background:rgba(255,159,69,.35)}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.pulse .tag{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);white-space:nowrap;font:700 12.5px var(--font);color:#fff;background:rgba(6,17,22,.9);border:1.5px solid var(--amber);border-radius:100px;padding:5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.pulse.ok::before,.pulse.ok::after,.pulse.ok .tag{border-color:var(--teal)}.pulse.ok::after{background:rgba(42,209,181,.3)}
/* címkék a térképen (lejtő teteje/alja, iskola, csomópont…) */
.mlab{font:700 12px var(--font);color:#fff;background:rgba(6,17,22,.88);border:1.5px solid var(--c,#8FB0B5);border-radius:100px;padding:4px 9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.55);pointer-events:none}
.mlab b{color:var(--c,#8FB0B5)}
.micon{width:30px;height:30px;border-radius:50%;background:rgba(6,17,22,.88);border:1.5px solid var(--c,#c77bff);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.55);pointer-events:none}
@media(prefers-reduced-motion:reduce){.pulse::before{animation:none;opacity:.6}}
</style>
</head>
<body>

<div id="map"></div>
<a class="homelink" href="index.html">‹ GEOVERN</a>
<div class="topbar" id="topbar" hidden>
  <div class="days" id="days"></div>
  <span class="tb-t" id="gTimer">⏱ 0:00</span>
  <span class="tb-s" id="gScore">0</span>
</div>
<div class="sheet" id="sheet"></div>
<div class="revstamp" id="revstamp" hidden></div>

<script>
/* =====================================================
   KRÍZISHÉT v2 — swipe-döntésjáték VALÓS adaton
   · a település utcái, iskolája, főtere, patakja és domborzata a térkép
     vektorcsempéiből (OpenStreetMap) és a Terrarium-domborzatcsempékből jön
   · minden nap forgatókönyve a valós helyekre épül: a Fő utca a tényleges
     főutca nevét viseli, a károk a valódi lejtőn sorakoznak, a balesetgóc az
     iskolához legközelebbi főúti csomópont, a vezeték az utcák mentén fut
   · a probléma felvetésekor a kamera odarepül, és a hely pulzáló jelet kap
   · ha egy sorsolt település adata nem elég (nincs lejtő, iskola…), a játék
     másikat sorsol a típus listájából; ha a csempék sem jönnek: illusztratív minta
   ===================================================== */
/* Google Apps Script webhook — a Krízishét eredményei Google Sheetbe
   (beüzemelés: google-sheets-setup.md, „Krízishét" szakasz; üresen helyi rangsor fut) */
const SHEET_WEBHOOK='https://script.google.com/macros/s/AKfycbx7Lq52ZcTT4ymVIErqxAgnADyNcStpUlG0Z0pt-07C2qzP4jlR1IeY24HjXI_FZv8C/exec';
const SHOW_TIME=true;
const DAYS_HU=['Hétfő','Kedd','Szerda','Csütörtök','Péntek'];
/* Településlista típusonként: domborzatos, patakos, jó OSM-lefedettségű helyek — a játék induláskor ellenőrzi
   (utcák, nevesített főutca, iskola, lejtő), és ha valami hiányzik, a lista következő tagját sorsolja. */
const TYPES=[
 {k:'k',ic:'🏡',n:'Község',s:'5 ezer alatt',towns:[['Tihany',17.889,46.913],['Nagymaros',18.956,47.792],['Zebegény',18.908,47.797],['Pilisborosjenő',18.995,47.607]]},
 {k:'v',ic:'🏘️',n:'Kisváros',s:'5–20 ezer',towns:[['Kőszeg',16.541,47.389],['Zirc',17.872,47.264],['Pilisvörösvár',18.910,47.620],['Budakeszi',18.930,47.511]]},
 {k:'m',ic:'🏙️',n:'Középváros',s:'20–60 ezer',towns:[['Veszprém',17.910,47.093],['Eger',20.377,47.902],['Szentendre',19.076,47.669],['Budaörs',18.959,47.461]]},
 {k:'n',ic:'🌆',n:'Nagyváros',s:'60 ezer felett',towns:[['Pécs',18.228,46.076],['Miskolc',20.781,48.103],['Sopron',16.592,47.685],['Kaposvár',17.796,46.360]]}
];
const C_HEAT='#ff6b4a',C_WATER='#4aa8ff',C_VULN='#c77bff',C_GREEN='#3ddc97',C_GOLD='#ffd166',C_TEAL='#2AD1B5';
const RAD=1100; /* a játéktér fél-oldala méterben */
const HOME_VIEW={center:[19.3,47.2],zoom:5.6,pitch:45,bearing:-15};

/* ---- állapot ---- */
let G={st:'type',type:null,town:null,i:0,sc:0,ph:1,p1:null,earn:0,ly:[],seen:[],
  t0:null,time:null,hist:[],board:null,rank:null,mats:[],lead:null,marks:[],tutDone:false,loadTxt:''};
const RM=false; /* a térképmozgások mindig animáltak (repülés, nem ugrás); a kártya-animációkat a CSS média-lekérdezés kezeli */
let map=null,mapReady=false,gTick=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- geometria méterben (x kelet, y észak, a település középpontjától) ---- */
const LL=(p)=>GVMAP.toLL(p[0],p[1]);
function grng(seed){let t=seed;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;}}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function plen(pts){let L=0;for(let i=0;i<pts.length-1;i++)L+=dist(pts[i],pts[i+1]);return L;}
function along(pts,t){const L=plen(pts);let d=Math.max(0,Math.min(1,t))*L;for(let i=0;i<pts.length-1;i++){const s=dist(pts[i],pts[i+1]);if(d<=s||i===pts.length-2){const u=s?Math.min(1,d/s):0;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u];}d-=s;}return pts[pts.length-1];}
function sideAt(pts,t,off){const p=along(pts,t),q=along(pts,Math.min(1,t+0.03));let dx=q[0]-p[0],dy=q[1]-p[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;return[p[0]-dy*off,p[1]+dx*off];}
function subLine(pts,t0,t1){const L=plen(pts);const out=[along(pts,t0)];let acc=0;for(let i=0;i<pts.length-1;i++){const s=dist(pts[i],pts[i+1]);const f=(acc+s)/L;if(f>t0&&f<t1)out.push(pts[i+1]);acc+=s;}out.push(along(pts,t1));return out;}
function distToLine(pts,x,y){let m=1e9;for(let i=0;i<pts.length-1;i++){const d=GVMAP.distSeg(x,y,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]).d;if(d<m)m=d;}return m;}
function circle(cx,cy,r,n){n=n||28;const ring=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;ring.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return ring;}
function hull(pts){const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(p.length<3)return null;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  const up=[];for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  const h=lo.slice(0,-1).concat(up.slice(0,-1));if(h.length<3)return null;h.push(h[0]);return h;}
function expand(ring,m){const c=GVMAP.centroid(ring.slice(0,-1));return ring.map(p=>{const dx=p[0]-c[0],dy=p[1]-c[1];const L=Math.hypot(dx,dy)||1;return[p[0]+dx/L*m,p[1]+dy/L*m];});}
function smooth(ring,it){it=it||2;let r=ring.slice(0,-1);for(let k=0;k<it;k++){const o=[];for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25]);o.push([a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);}r=o;}r.push(r[0]);return r;}
function zone(pts,pad){const h=hull(pts);if(!h)return null;return smooth(expand(h,pad||40),2);}
function bbox(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];});return[x0,y0,x1,y1];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- utcák névvel (a csempék több darabját egy vonallá fűzve) ---- */
function chain(parts){parts=parts.slice().sort((a,b)=>plen(b)-plen(a));let line=parts.shift().slice();let changed=true;
  while(changed&&parts.length){changed=false;for(let i=0;i<parts.length;i++){const p=parts[i];const h=line[0],t=line[line.length-1],ph=p[0],pt=p[p.length-1];
    if(dist(t,ph)<4)line=line.concat(p.slice(1));else if(dist(t,pt)<4)line=line.concat(p.slice().reverse().slice(1));
    else if(dist(h,pt)<4)line=p.slice(0,-1).concat(line);else if(dist(h,ph)<4)line=p.slice().reverse().slice(0,-1).concat(line);else continue;
    parts.splice(i,1);changed=true;break;}}
  return line;}
function streetList(){const m=new Map();
  D.named.forEach(n=>{if(n.pts.length<2)return;const k=n.name;if(!m.has(k))m.set(k,{name:k,parts:[],keys:new Set(),major:false,cls:n.cls});const s=m.get(k);
    const key=Math.round(n.pts[0][0])+','+Math.round(n.pts[0][1])+'|'+Math.round(n.pts[n.pts.length-1][0])+','+Math.round(n.pts[n.pts.length-1][1]);if(s.keys.has(key))return;s.keys.add(key);
    s.parts.push(n.pts);s.major=s.major||n.major;});
  const out=[];m.forEach(s=>{s.line=chain(s.parts);s.len=plen(s.line);s.dc=distToLine(s.line,0,0);
    const inside=s.line.filter(p=>Math.abs(p[0])<=RAD&&Math.abs(p[1])<=RAD).length/s.line.length;if(inside<0.3||s.len<80)return;
    s.shops=D.shops.filter(q=>distToLine(s.line,q.x,q.y)<40).length;out.push(s);});
  return out;}
function nameAt(x,y,maxD){const c=[];D.named.forEach(n=>{const d=distToLine(n.pts,x,y);if(d<=maxD&&!c.some(q=>q.name===n.name))c.push({name:n.name,d});});c.sort((a,b)=>a.d-b.d);return c.map(q=>q.name);}
function profile(line,step){const L=plen(line);const n=Math.max(2,Math.round(L/(step||30)));const pr=[];for(let i=0;i<=n;i++){const p=along(line,i/n);const e=DEM.at(p[0],p[1]);pr.push({t:i/n,p,e});}return pr;}

/* ---- a kártyák szövege: számokkal, településtípus szerint skálázva ----
   b: a napi keretek (M Ft, hétfő→péntek); hh: áram nélkül maradt háztartás; h: óra; eld: 75 év feletti lakó;
   amb: tavalyi hőségben mentőhívás; tank: tározó m³; where: hol élnek a 75+-osok */
const NUM={
 k:{b:[12,8,20,6,150],hh:'350',h:'kilenc',eld:'130',amb:4,tank:'4 000',where:'A településen'},
 v:{b:[25,15,30,10,300],hh:'1 600',h:'hat',eld:'450',amb:11,tank:'12 000',where:'A településen'},
 m:{b:[40,25,45,15,600],hh:'4 200',h:'hat',eld:'1 900',amb:30,tank:'20 000',where:'A városrészben'},
 n:{b:[60,40,60,25,1200],hh:'9 000',h:'öt',eld:'5 200',amb:70,tank:'30 000',where:'A városrészben'}
};
const nb=s=>String(s).replace(/ /g,' ');
const M=x=>x>=1000?nb((x/1000).toLocaleString('hu-HU')+' Mrd Ft'):nb(x+' M Ft');
const Mw=x=>x>=1000?((x/1000).toLocaleString('hu-HU')+' milliárdot'):(x+' milliót');
const art=x=>{const s=String(x);return(s[0]==='5'||(s[0]==='1'&&(s.length===1||s.length===4)))?'az':'a';};
/* P: a település nevei és számai (OSM-ből vagy a tartalék mintából) */
function copyWeek(P){
  const N=NUM[G.type]||NUM.v,b=N.b,e=GV.esc,az=GVMAP.az;
  const isk=P.schoolKind!=='óvoda';
  const sch=isk?'az iskola':'az óvoda',schTol=isk?'az iskolától':'az óvodától',schHoz=isk?'az iskolához':'az óvodához';
  const brand=(P.n1&&P.n2&&P.n1!==P.n2)?P.n1+' és '+P.n2:(P.n1?P.n1+' két külső vége':'a két külső szakasz');
  return[
   {setup:`Egy óra alatt 40 mm eső esett: ${az(P.slope)} ${e(P.slope)} felől lezúduló víz 3 utcát öntött el, ${P.dmgN} pince ázott el — ${az(P.main)} ${e(P.main)} házaié is. Egy beavatkozásra van keret: <b>${M(b[0])}</b>.`,

    R:{t:'Árkok, átereszek tisztítása '+az(P.slope)+' '+P.slope+' tetején',s:[M(Math.round(b[0]*0.3))+' · kész 1 hét alatt','2 eltömődött áteresz + 600 m árok']}},
   {setup:`3 év alatt ${P.accN} gyalogos- és kerékpáros-baleset ${sch} 500 méteres körzetében. Egy helyszínre jut forgalombiztonsági keret: <b>${M(b[1])}</b>.`,
    q:`Hová kerüljön ${art(b[1])} ${Mw(b[1])}?`,
    L:{t:'Csillapítás a csomópontban'+(P.jn?' ('+P.jn+')':''),s:[M(b[1])+' · '+P.juncD+' m-re '+schTol,'kiemelt átkelő + sávszűkítés + 30-as zóna']},
    R:{t:'Zebra '+schHoz,s:[M(b[1])+' · közvetlenül a kapunál','zebra + sárga villogó + gyalogoskorlát']}},
   {setup:`A vihar ${P.outN} ponton szakította el a légvezetéket: ${nb(N.hh)} háztartás maradt ${N.h} órán át áram nélkül. Egy szakasz megerősítésére van keret: <b>${M(b[2])}</b>.`,
    q:`Melyik szakaszra menjen ${art(b[2])} ${Mw(b[2])}?`,
    L:{t:'Földkábel '+az(P.main)+' '+P.mainOn,s:[M(b[2])+' · '+P.cabLen+' m földkábel',P.shops+' üzlet és '+P.mainN+' ház a belvárosban']},
    R:{t:'Megerősítés a két erdőszéli szakaszon',s:[M(b[2])+' · '+P.brLen+' m vezeték',brand+': szigetelt vezeték + gallyazás']}},
   {setup:`Két hét múlva 36 °C-os hőhullám jön, 5 napig. ${N.where} ${nb(N.eld)} lakó 75 év feletti; tavaly ${N.amb} mentőhívás volt a hőségben. Egy csomagra futja: <b>${M(b[3])}</b>.`,
    q:`Mire menjen ${art(b[3])} ${Mw(b[3])}?`,
    L:{t:'Hűsítő pontok a hőszigeten'+(P.hot?' ('+P.hot+')':''),s:[M(b[3])+' · kész 10 nap alatt','3 árnyékolt pihenő + ivókút + hűtött szoba a rendelőnél']},
    R:{t:'Árnyékolás '+P.sqRa,s:[M(b[3])+' · kész 10 nap alatt','12 napvitorla + 2 ivókút '+P.sqOn]}},
   {setup:`Megjött a klímabiztonsági keret: <b>${M(b[4])}</b>, 3 éven belül kell elkölteni. Egy nagy beruházás vagy egy csomag — a testület ma dönt.`,
    q:`Mire menjen ${art(b[4])} ${Mw(b[4])}?`,
    L:{t:'Minden a tározóra',s:[M(b[4])+' · 3 év építés',nb(N.tank)+' m³-es tározó '+(P.streams?'a patakon':az(P.slope)+' '+P.slope+' alján')+' · '+az(P.slope)+' '+P.slope+' alját védi']},
    R:{t:'Csomag a top-3 zónára',s:[M(b[4])+' · 1 év','fák + csillapítás + esőkertek + hűsítő pontok a 3 kockázati zónában']}}

}

/* ---- forgatókönyv-építés valós adatból ---- */
function buildWeek(){
  const S={};const rnd=grng(7);
  const streets=streetList();if(streets.length<4)return null;
  /* főutca: boltok, rang, hossz, középponthoz közelség */
  const streetsOnly=streets.filter(s=>!/\btér$/i.test(s.name)&&s.cls!=='pedestrian');
  const majorNamed=streetsOnly.filter(s=>s.major);
  const pool=majorNamed.length?majorNamed:(streetsOnly.length?streetsOnly:streets);
  pool.forEach(s=>{s.score=s.shops*3+(s.major?2:0)+Math.min(s.len,900)/300-s.dc/250;});
  S.main=pool.slice().sort((a,b)=>b.score-a.score)[0];
  /* főtér: „… tér” nevű hely a központhoz legközelebb; különben a településpont */
  const squares=streets.filter(s=>/\btér$/i.test(s.name)||/főtér/i.test(s.name)).sort((a,b)=>a.dc-b.dc);
  const place=D.places.filter(p=>/^(city|town|village)$/.test(p.cls)).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y))[0];
  if(squares.length){S.square={name:squares[0].name,pt:along(squares[0].line,0.5)};}
  else if(place){S.square={name:(place.name||G.town.name)+' központja',pt:[place.x,place.y],generic:true};}
  else S.square={name:'főtér',pt:[0,0],generic:true};
  /* iskola */
  const schools=D.pois.filter(p=>p.k==='school'&&Math.hypot(p.x,p.y)<1000).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y));
  const kinders=D.pois.filter(p=>/^(kindergarten|childcare)$/.test(p.k)&&Math.hypot(p.x,p.y)<1000).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y));
  S.school=schools[0]||kinders[0]||null;if(!S.school)return null;S.schoolKind=schools[0]?'iskola':'óvoda';
  /* lejtő: a legnagyobb, egyirányú szintkülönbségű utca */
  S.slope=null;
  if(DEM&&DEM.ok){let best=null;
    streets.forEach(s=>{if(s.len<220)return;const pr=profile(s.line,30).filter(q=>q.e!=null);if(pr.length<5)return;
      const es=pr.map(q=>q.e);const mx=Math.max(...es),mn=Math.min(...es);const drop=mx-mn;if(drop<6)return;
      const n=pr.length;const mt=(n-1)/2,me=es.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;pr.forEach((q,i)=>{sxy+=(i-mt)*(q.e-me);sxx+=(i-mt)**2;syy+=(q.e-me)**2;});
      const corr=sxx&&syy?sxy/Math.sqrt(sxx*syy):0;if(Math.abs(corr)<0.6)return;
      const sc=drop*corr*corr*Math.min(1,s.len/400)*(s.dc<700?1:0.6);if(!best||sc>best.sc){best={s,sc,corr,drop,pr};}});
    if(best){let line=best.s.line.slice();if(best.corr>0)line.reverse(); /* fentről lefelé */
      S.slope={name:best.s.name,line,drop:best.drop,top:line[0],bottom:line[line.length-1],topE:DEM.at(line[0][0],line[0][1]),botE:DEM.at(line[line.length-1][0],line[line.length-1][1])};}}
  if(!S.slope){ /* nincs domborzat-adat: a patakhoz legközelebb érő, hosszabb utca a „lejtő” */
    if(DEM&&DEM.ok)return null; /* van domborzat, de sík: ez a település nem jó a hétfői naphoz */
    let best=null;streets.forEach(s=>{if(s.len<220)return;let d=1e9;D.streams.forEach(w=>{const q=distToLine(w.pts,s.line[s.line.length-1][0],s.line[s.line.length-1][1]);const q2=distToLine(w.pts,s.line[0][0],s.line[0][1]);d=Math.min(d,q,q2);});
      const sc=(d<1e8?1/(1+d/100):0.2)*Math.min(1,s.len/400)*(s.dc<700?1:0.6);if(!best||sc>best.sc)best={s,sc,d};});
    if(!best)return null;let line=best.s.line.slice();let d0=1e9,d1=1e9;D.streams.forEach(w=>{d0=Math.min(d0,distToLine(w.pts,line[0][0],line[0][1]));d1=Math.min(d1,distToLine(w.pts,line[line.length-1][0],line[line.length-1][1]));});if(d0<d1)line.reverse();
    S.slope={name:best.s.name,line,drop:null,top:line[0],bottom:line[line.length-1]};}
  /* elöntés: a lejtő aljának mélyfekvésű utcapontjai + a patak közeli pontjai */
  const bot=S.slope.bottom;const low=[];
  RG.nodes.forEach(n=>{const d=Math.hypot(n.x-bot[0],n.y-bot[1]);if(d>240)return;if(DEM&&DEM.ok&&S.slope.botE!=null){const e=DEM.at(n.x,n.y);if(e!=null&&e>S.slope.botE+3)return;}low.push([n.x,n.y]);});
  D.streams.forEach(w=>w.pts.forEach(p=>{if(Math.hypot(p[0]-bot[0],p[1]-bot[1])<200)low.push(p);}));
  low.push(bot);S.flood=(low.length>=4?zone(low,45):null)||circle(bot[0],bot[1],120);
  S.floodC=GVMAP.centroid(S.flood.slice(0,-1));
  /* károk a lejtő alsó felén (ház felőli oldalon), néhány az elöntésben és a főutcán */
  S.dmg=[];for(let i=0;i<12;i++){const t=0.42+0.58*(i/11);const off=(i%2?9:-9)+(rnd()-0.5)*6;const p=sideAt(S.slope.line,t,off);S.dmg.push([p[0],p[1],0.5+0.5*t]);}
  for(let i=0;i<4;i++){const a=rnd()*Math.PI*2,r=20+rnd()*70;S.dmg.push([S.floodC[0]+Math.cos(a)*r,S.floodC[1]+Math.sin(a)*r,0.9]);}
  if(distToLine(S.main.line,S.floodC[0],S.floodC[1])<350){for(let i=0;i<3;i++){const p=sideAt(S.main.line,0.3+0.2*i,i%2?8:-8);S.dmg.push([p[0],p[1],0.5]);}}
  S.mainPt=(()=>{let b=null,bd=1e9;for(let t=0;t<=1;t+=0.05){const p=along(S.main.line,t);const d=Math.hypot(p[0]-S.floodC[0],p[1]-S.floodC[1]);if(d<bd){bd=d;b=p;}}return b;})();
  /* kedd: csomópont az iskolától 150–600 m-re a hálózaton, főút mentén */
  const sn=RG.nearest(S.school.x,S.school.y);const dj=RG.dijkstra(sn,1400);
  let junc=null,jsc=1e9;RG.nodes.forEach(n=>{const dd=dj.dist.get(n);if(dd==null||dd<150||dd>650)return;const deg=n.adj.length;if(deg<3)return;const maj=n.adj.filter(e=>e.r.major).length;if(!maj&&deg<4)return;
    const sc=Math.abs(dd-300)-maj*60-(deg>=4?40:0);if(sc<jsc){jsc=sc;junc=n;}});
  if(!junc){RG.nodes.forEach(n=>{const dd=dj.dist.get(n);if(dd==null||dd<120||dd>800)return;if(n.adj.length<3)return;const sc=Math.abs(dd-300)-n.adj.length*20;if(sc<jsc){jsc=sc;junc=n;}});}
  if(!junc)junc=sn.adj.length?sn.adj[0].n:sn;
  S.junc=[junc.x,junc.y];S.juncD=Math.round((dj.dist.get(junc)||300)/10)*10;S.juncNames=nameAt(junc.x,junc.y,16).slice(0,2);
  S.acc=[];junc.adj.forEach((e,k)=>{for(let i=0;i<4;i++){const t=Math.min(1,(8+i*13)/Math.max(1,e.L));const p=[junc.x+(e.n.x-junc.x)*t+(rnd()-0.5)*5,junc.y+(e.n.y-junc.y)*t+(rnd()-0.5)*5];S.acc.push([p[0],p[1],0.6+rnd()*0.4]);if(S.acc.length>=11)break;}});
  while(S.acc.length<12){const a=rnd()*Math.PI*2;S.acc.push([junc.x+Math.cos(a)*18,junc.y+Math.sin(a)*18,0.8]);}
  for(let i=0;i<3;i++){const p=sideAt(S.main.line,0.2+0.3*i,i%2?6:-6);S.acc.push([p[0],p[1],0.5]);}
  S.acc.push([sn.x+(rnd()-0.5)*20,sn.y+(rnd()-0.5)*20,0.5]);

  const sec4=[[],[],[],[]];leaves.forEach(l=>{const a=Math.atan2(l.n.y-cn.y,l.n.x-cn.x);sec4[Math.floor(((a+Math.PI)/(2*Math.PI))*4)%4].push(l);});
  const picked=[];sec4.forEach(sec=>{if(!sec.length)return;sec.sort((a,b)=>woodD([a.n.x,a.n.y])-woodD([b.n.x,b.n.y]));picked.push(sec[0]);});

/* ---- tartalék: illusztratív minta (a korábbi, rács-alapú forgatókönyv), méterbe váltva ---- */

  const DU=0.0016,DV=0.00105,O=G.town.ll;const toM=(u,v)=>GVMAP.toXY(O[0]+u*DU,O[1]+v*DV);
  const blob=(cu,cv,r,seed,irr)=>{irr=irr||0.35;const rnd=grng(seed),n=16,rad=[];for(let i=0;i<n;i++)rad.push(r*(1+(rnd()*2-1)*irr));for(let i=0;i<n;i++)rad[i]=(rad[i]+rad[(i+1)%n]+rad[(i+n-1)%n])/3;
    const ring=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=rad[i%n];ring.push(toM(cu+Math.cos(a)*rr,cv+Math.sin(a)*rr*0.75));}return ring;};
  const pts=(clusters,seed)=>{const rnd=grng(seed),f=[];clusters.forEach(c=>{for(let i=0;i<c[2];i++){const u=c[0]+((rnd()+rnd())-1)*c[3],v=c[1]+((rnd()+rnd())-1)*c[3]*0.8;const p=toM(u,v);f.push([p[0],p[1],0.4+rnd()*0.6]);}});return f;};
  const path=(sets,seed)=>{const rnd=grng(seed);return sets.map(w=>{const c=[];for(let i=0;i<w.length-1;i++){const [u1,v1]=w[i],[u2,v2]=w[i+1];c.push(toM(u1,v1));c.push(toM((u1+u2)/2+(rnd()-0.5)*0.2,(v1+v2)/2+(rnd()-0.5)*0.2));}c.push(toM(...w[w.length-1]));return c;});};
  const iso=(cu,cv,radii,seed)=>{const rnd=grng(seed),n=16,base=[];for(let i=0;i<n;i++)base.push(1+(rnd()*2-1)*0.3);for(let i=0;i<n;i++)base[i]=(base[i]+base[(i+1)%n]+base[(i+n-1)%n])/3;
    return radii.map((r,li)=>{const ring=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;ring.push(toM(cu+Math.cos(a)*r*base[i%n],cv+Math.sin(a)*r*base[i%n]*0.75));}return{ring,lvl:li};}).reverse();};

  return[
   {ic:'💧',disc:'Vízgazdálkodás',best:'R',pts:100,bonus:50,t:'Villámárvíz után',setup:T[0].setup,q:T[0].q,

/* ---- egyetlen állandó térkép ---- */
function initMap(){
  if(typeof maplibregl==='undefined'||typeof GVMAP==='undefined'){document.body.classList.add('maperr');return;}
  map=GVMAP.createMap(Object.assign({container:'map',interactive:true},HOME_VIEW),m=>{mapReady=true;GVMAP.add3D(m);GVMAP.addHillshade(m,{exaggeration:0.5});},()=>document.body.classList.add('maperr'));
  if(!map)document.body.classList.add('maperr');
}
const onceMoveEnd=()=>new Promise(res=>{if(!map)return res();let done=false;const f=()=>{if(!done){done=true;res();}};map.once('moveend',f);setTimeout(f,5000);});
function setLoad(t){G.loadTxt=t;const el=document.getElementById('gLoad');if(el)el.innerHTML='<span class="spin"></span><span>'+esc(t)+'</span>';}
function validateBase(d){if(!d.ok||d.roads.length<40)return 'kevés utca a csempékből';if(d.named.length<6)return 'nincs elég utcanév';
  if(!d.pois.some(p=>/^(school|kindergarten|childcare)$/.test(p.k)&&Math.hypot(p.x,p.y)<1000))return 'nincs iskola a központ közelében';return '';}
/* település sorsolása + adatbetöltés + ellenőrzés; ha nem jó, a következő jön */
async function pickTown(T){
  const order=shuffle(T.towns.slice());MODE='';const tried=[];
  for(const tw of order){
    G.town={name:tw[0],ll:[tw[1],tw[2]]};setLoad(tw[0]+' térképének betöltése…');
    if(!map||!mapReady){await new Promise(r=>setTimeout(r,800));if(!map||!mapReady)break;}
    GVMAP.setCenter(G.town.ll);
    const demP=GVMAP.demLoad(G.town.ll,RAD,14).catch(()=>({ok:false,at:()=>null})); /* a domborzat a repülés alatt töltődik */
    const c={center:G.town.ll,zoom:14.4,pitch:0,bearing:0};
    map.flyTo(Object.assign({duration:tried.length?1400:2200,essential:true},c));
    await onceMoveEnd();await GVMAP.whenIdle(map,5000);
    D=GVMAP.fromTiles(map);
    const why=validateBase(D);if(why){tried.push(tw[0]+': '+why);setLoad(tw[0]+': '+why+' — másik település…');await new Promise(r=>setTimeout(r,500));continue;}
    setLoad('Domborzat: '+tw[0]);
    DEM=await demP;
    E=GVMAP.evaluators(D);RG=GVMAP.roadGraph(D,{half:RAD});
    let w=null;try{w=buildWeek();}catch(e){console.warn('buildWeek',e);w=null;}
    if(!w){tried.push(tw[0]+': sík vagy hiányos');setLoad(tw[0]+': nincs lejtő vagy intézmény — másik település…');await new Promise(r=>setTimeout(r,600));continue;}
    WEEK=w;MODE='osm';break;
  }
  if(MODE!=='osm'){G.town={name:order[0][0],ll:[order[0][1],order[0][2]]};GVMAP.setCenter(G.town.ll);WEEK=legacyWeek();MODE='legacy';
    if(map&&mapReady){const c={center:G.town.ll,zoom:14.4,pitch:0,bearing:0};map.flyTo(Object.assign({duration:1500,essential:true},c));}}
  /* a helyes válasz oldala napról napra véletlen — ne lehessen a mintát megtanulni */
  WEEK.forEach(r=>{if(Math.random()<0.5){const t=r.L;r.L=r.R;r.R=t;r.best=r.best==='L'?'R':'L';}});
  G.tried=tried;MAXPTS=WEEK.reduce((a,r)=>a+r.pts+r.bonus,0);
  G.st='town';render(); /* a kamera marad, ahol a betöltés történt — a döntött nézetbe a hétfő indításakor repül */
}

/* ---- forduló-rétegek az állandó térképen (méter → földrajzi koordináta itt) ---- */
const FC=f=>({type:'FeatureCollection',features:f});
function polyF(ring,props){return{type:'Feature',properties:props||{},geometry:{type:'Polygon',coordinates:[ring.map(LL)]}};}
function lineF(pts,props){return{type:'Feature',properties:props||{},geometry:{type:'LineString',coordinates:pts.map(LL)}};}
function ptF(p,props){return{type:'Feature',properties:props||{},geometry:{type:'Point',coordinates:LL(p)}};}
function marker(cls,html,p,anchor){const el=document.createElement('div');el.className=cls;el.innerHTML=html;const mk=new maplibregl.Marker({element:el,anchor:anchor||'center'}).setLngLat(LL(p));return mk;}
let LYM=[]; /* rétegenkénti DOM-jelölők */
function addRoundLayers(r){
  if(!mapReady)return;LYM=r.layers.map(()=>[]);
  r.layers.forEach((ly,i)=>{
    const vis=G.ly[i]?'visible':'none';const sid='gs'+i;
    if(ly.type==='poly'){map.addSource(sid,{type:'geojson',data:FC(ly.polys.map((p,k)=>polyF(p,{op:ly.ops?ly.ops[k]:(ly.op||0.33)})))});
      map.addLayer({id:'gf'+i,type:'fill',source:sid,layout:{visibility:vis},paint:{'fill-color':ly.c,'fill-opacity':['get','op']}});
      map.addLayer({id:'gl'+i,type:'line',source:sid,layout:{visibility:vis},paint:{'line-color':ly.c,'line-opacity':0.9,'line-width':1.8}});
    }else if(ly.type==='pts'){map.addSource(sid,{type:'geojson',data:FC(ly.pts.map(p=>ptF(p,{w:p[2]||1})))});
      map.addLayer({id:'gp'+i,type:'circle',source:sid,layout:{visibility:vis},paint:{'circle-color':ly.c,'circle-opacity':0.92,'circle-radius':ly.big?8:['+',3.5,['*',4,['get','w']]],'circle-stroke-color':'#081a21','circle-stroke-width':1.4}});
    }else if(ly.type==='line'){map.addSource(sid,{type:'geojson',data:FC(ly.lines.map(l=>lineF(l)))});
      map.addLayer({id:'gl'+i,type:'line',source:sid,layout:{visibility:vis,'line-cap':'round','line-join':'round'},paint:Object.assign({'line-color':ly.c,'line-opacity':0.95,'line-width':3.5},ly.dash?{'line-dasharray':ly.dash}:{})});
    }else if(ly.type==='iso'){map.addSource(sid,{type:'geojson',data:FC(ly.lines.map(l=>lineF(l.pts,{lvl:l.lvl})))});
      map.addLayer({id:'gl'+i,type:'line',source:sid,layout:{visibility:vis,'line-cap':'round'},paint:{'line-color':ly.c,'line-opacity':['match',['get','lvl'],0,0.85,0.45],'line-width':['match',['get','lvl'],0,5,2.5]}});
    }else if(ly.type==='isopoly'){map.addSource(sid,{type:'geojson',data:FC(ly.rings.map(q=>polyF(q.ring,{lvl:q.lvl})))});
      map.addLayer({id:'gf'+i,type:'fill',source:sid,layout:{visibility:vis},paint:{'fill-color':ly.c,'fill-opacity':['case',['==',['get','lvl'],0],0.10,0.22]}});
      map.addLayer({id:'gl'+i,type:'line',source:sid,layout:{visibility:vis},paint:{'line-color':ly.c,'line-opacity':0.75,'line-width':1.5,'line-dasharray':[2,2]}});
    }else if(ly.type==='heat'){map.addSource(sid,{type:'geojson',data:FC(ly.pts.map(p=>ptF(p,{w:p[2]||0.6})))});
      map.addLayer({id:'gh'+i,type:'heatmap',source:sid,layout:{visibility:vis},paint:{'heatmap-weight':['get','w'],'heatmap-intensity':1.1,'heatmap-radius':['interpolate',['linear'],['zoom'],13,14,15,34,16,60,17,100],'heatmap-opacity':0.75,
        'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(0,0,0,0)',0.25,'rgba(42,209,181,0.35)',0.5,'rgba(255,209,102,0.6)',0.75,'rgba(255,159,69,0.8)',1,'rgba(255,80,60,0.95)']}});
    }else if(ly.type==='slope'){map.addSource(sid,{type:'geojson',lineMetrics:true,data:FC([lineF(ly.line)])});
      map.addLayer({id:'gl'+i,type:'line',source:sid,layout:{visibility:vis,'line-cap':'round','line-join':'round'},paint:{'line-width':6,'line-opacity':0.95,'line-gradient':['interpolate',['linear'],['line-progress'],0,'#ff9f45',1,'#4aa8ff']}});
      LYM[i].push(marker('mlab','<b>▲ fent</b>'+(ly.drop?' · +'+Math.round(ly.drop)+' m':''),ly.top,'bottom'),marker('mlab','<b>▼ mélypont</b> · '+esc(ly.name),ly.bottom,'top'));
      LYM[i].forEach(m=>m.getElement().style.setProperty('--c','#ff9f45'));
    }
    (ly.markers||[]).forEach(mk=>{const m=marker('micon',mk.ic,[mk.x,mk.y]);m.getElement().style.setProperty('--c',ly.c||C_VULN);m.getElement().title=mk.n||'';LYM[i].push(m);});
    if(ly.type==='markers'&&!ly.markers)ly.markers=[];
    if(G.ly[i])LYM[i].forEach(m=>m.addTo(map));
  });
}
function removeRoundLayers(r){
  if(!mapReady)return;
  r.layers.forEach((_,i)=>{['gf'+i,'gl'+i,'gp'+i,'gh'+i].forEach(id=>{if(map.getLayer(id))map.removeLayer(id);});if(map.getSource('gs'+i))map.removeSource('gs'+i);(LYM[i]||[]).forEach(m=>{try{m.remove();}catch(e){}});});

}
/* probléma-kiemelés: a kamera odarepül (mindig repül, sosem ugrik), a hely pulzál */
let PULSE=null;

function focusTo(f,close){
  if(!mapReady||!f)return;
  if(close&&f.spot){map.flyTo({center:LL(f.spot),zoom:Math.min(16.8,Math.max(map.getZoom()+0.6,16)),pitch:55,bearing:f.bearing||-15,offset:[0,-Math.round(Math.min(window.innerHeight*0.17,150))],duration:1700,essential:true});return;}
  const b=bbox(f.pts.concat(f.spot?[f.spot]:[]));const pad=90;
  const sw=LL([b[0]-pad,b[1]-pad]),ne=LL([b[2]+pad,b[3]+pad]);
  /* az alsó lap valós magassága fölé kerüljön a terület (a kártya a hét során más-más magas);
     a zoomot nem csökkentjük utólag, mert az a képernyő közepe felé — a lap alá — húzná a területet */
  const sh=(document.getElementById('sheet')||{}).offsetHeight||0;const bottom=Math.min(window.innerHeight*0.68,Math.max(300,sh+30));
  const cam=GVMAP.fitPitched(map,[sw,ne,[sw[0],ne[1]],[ne[0],sw[1]]],{padding:{top:90,bottom,left:30,right:30},bearing:f.bearing||-15,pitch:50,maxZoom:17,minZoom:13.8});
  if(cam)map.flyTo({center:cam.center,zoom:cam.zoom,bearing:cam.bearing,pitch:50,duration:2000,essential:true});
  clearPulse();if(f.spot&&f.tag)PULSE=marker('pulse','<span class="tag">'+esc(f.tag)+'</span>',f.spot).addTo(map);

function commitSwipe(dir){
  G.tutDone=true;
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  const r=WEEK[G.i];
  if(G.ph===1){
    G.p1=dir;G.ph=2;
    G.ly=r.layers.map(()=>false);G.seen=r.layers.map(()=>false);
    render();removePre();addRoundLayers(r);focusRound(r,false);
  }else{
    const ok=dir===r.best;
    const bonus=(ok&&G.p1===r.best)?r.bonus:0;
    G.earn=(ok?r.pts:0)+bonus;G.sc+=G.earn;
    G.hist.push({day:DAYS_HU[G.i],ic:r.ic,earn:G.earn,max:r.pts+r.bonus,bonus,pick:dir,ok});
    removeRoundLayers(r);
    addMark(r[dir].cell,ok);if(!ok)addMark(r[r.best].cell,true);
    if(mapReady)map.flyTo({center:LL(r[r.best].cell),zoom:Math.min(16.5,Math.max(15,map.getZoom())),pitch:55,offset:[0,-Math.round(Math.min(window.innerHeight*0.12,110))],duration:1500,essential:true});
    G.st='rev';G.lastOk=ok;render();

}

function gNext(){
  clearTimeout(G.stampTO);clearTimeout(G.stampTO2);
  const rs=document.getElementById('revstamp');const s=rs&&rs.querySelector('.st');
  if(s){s.classList.add('out');G.stampTO2=setTimeout(()=>{rs.hidden=true;},900);}else if(rs)rs.hidden=true;
  removeDayMarkers();showMarks(false); /* a ✓/✗ jelek csak a hét végi nézetben látszanak */
  if(G.i+1<WEEK.length){G.i++;G.ph=1;G.p1=null;G.st='q';render();startDay();}
  else{
    G.time=gElapsed();clearInterval(gTick);
    if(map&&mapReady)map.flyTo({zoom:13.8,pitch:45,bearing:-10,center:G.town.ll,duration:2800,essential:true});
    showMarks(true);G.st='legacy';render();
  }
  tickUI();
}
function gReplay(){
  clearTimeout(G.stampTO);clearTimeout(G.stampTO2);
  document.getElementById('revstamp').hidden=true;
  clearMarks();clearPulse();removePre();removeDayMarkers();
  if(G.st==='q'&&G.ph===2)removeRoundLayers(WEEK[G.i]);
  G.st='type';G.type=null;G.town=null;G.sc=0;G.hist=[];G.t0=null;G.time=null;G.i=0;G.ph=1;
  G.lead=null;G.board=null;G.rank=null;G.offline=false;WEEK=[];MODE='';SCN=null;
  clearInterval(gTick);
  if(map&&mapReady)map.flyTo(Object.assign({duration:2000,essential:true},HOME_VIEW));
  render();tickUI();
}

/* ---- SWIPE-motor (pointer events: ujj + egér) ---- */
function bindSwipe(cardId,onCommit){
  const card=document.getElementById(cardId);if(!card)return;
  let x0=0,dx=0,dragging=false,w=0;
  const stL=card.querySelector('.stampL'),stR=card.querySelector('.stampR');
  const optL=card.querySelector('.sc-opt.oL'),optR=card.querySelector('.sc-opt.oR');
  const set=()=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.05}deg)`;
    const p=Math.min(1,Math.abs(dx)/110);
    if(dx<0){if(stL)stL.style.opacity=p;if(stR)stR.style.opacity=0;if(optL)optL.classList.add('hotL');if(optR)optR.classList.remove('hotR');}
    else if(dx>0){if(stR)stR.style.opacity=p;if(stL)stL.style.opacity=0;if(optR)optR.classList.add('hotR');if(optL)optL.classList.remove('hotL');}
    else{if(stL)stL.style.opacity=0;if(stR)stR.style.opacity=0;}
  };
  card.addEventListener('pointerdown',e=>{dragging=true;x0=e.clientX;dx=0;w=card.offsetWidth;card.classList.add('drag');card.classList.remove('spring','demo');
    const hand=card.querySelector('.hand');if(hand)hand.remove();card.setPointerCapture(e.pointerId);});
  card.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-x0;set();});
  const finish=()=>{if(!dragging)return;dragging=false;card.classList.remove('drag');
    if(Math.abs(dx)>Math.max(80,w*0.28)){const dir=dx<0?'L':'R';card.classList.add('fly');card.style.transform=`translateX(${dx<0?-w*1.3:w*1.3}px) rotate(${dx<0?-18:18}deg)`;setTimeout(()=>onCommit(dir),240);}
    else{card.classList.add('spring');dx=0;set();}};
  card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);
}
document.addEventListener('keydown',e=>{if(G.st!=='q')return;if(e.key==='ArrowLeft')commitSwipe('L');if(e.key==='ArrowRight')commitSwipe('R');});

/* ---- renderelés ---- */
/* rétegsáv: a közös chip-sor (jelmagyarázat + kapcsoló egyben) */
let LCTL=null;
function mountLayerBar(r){const bar=document.getElementById('lybar');
  LCTL=GV.layerControl({container:bar,title:'Rétegek',hint:(matchMedia('(hover:hover) and (pointer:fine)').matches?'kattintásra':'koppintásra')+' be / ki',
    layers:r.layers.map((ly,i)=>({id:'l'+i,label:ly.n,icon:ly.ic,color:ly.c||C_HEAT,on:G.ly[i],apply:on=>setLayerVis(i,on)})),
    onChange:(id,on)=>{const i=+id.slice(1);if(on)G.seen[i]=true;updateCall(r);}});}
function setLayerVis(i,on){G.ly[i]=on;
  ['gf'+i,'gl'+i,'gp'+i,'gh'+i].forEach(id=>{if(mapReady&&map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none');});
  (LYM[i]||[]).forEach(m=>on?m.addTo(map):m.remove());}
function updateCall(r){const el=document.getElementById('gCall');if(!el)return;const n=r.layers.length,s=G.seen.filter(Boolean).length;
  if(s>=n){if(el.classList.contains('pending'))focusRound(r,true);el.innerHTML='<span class="ic">💡</span><span>'+esc(r.call)+'</span>';el.classList.remove('pending');}
  else{el.innerHTML='<span class="ic">🔒</span><span>Kapcsold be mindet ('+s+'/'+n+')</span>';el.classList.add('pending');}}
function optRow(r){
  /* opció: cím + két rövid sor (keret · idő / mit fed le) */
  const sub=o=>(o.s||[]).map((x,i)=>`<small class="s${i+1}">${esc(x)}</small>`).join('');
  return `<div class="sc-opts"><div class="sc-opt oL"><span class="dir">◀ BALRA</span><span class="ic">${r.L.ic}</span><div class="txt"><b>${esc(r.L.t)}</b>${sub(r.L)}</div></div>
    <div class="sc-opt oR"><span class="dir">JOBBRA ▶</span><span class="ic">${r.R.ic}</span><div class="txt"><b>${esc(r.R.t)}</b>${sub(r.R)}</div></div></div>`;
}
function stamps(r){return `<div class="stamp stampL">${r.L.ic}</div><div class="stamp stampR">${r.R.ic}</div>`;}
function srcNote(){
  if(MODE==='osm')return 'Utcák, iskola, főtér, patak: OpenStreetMap (térképcsempék)'+(DEM&&DEM.ok?' · domborzat: Terrain Tiles':' · domborzat nem elérhető')+'.';
  return 'Illusztratív minta-rétegek — a térképadat most nem volt elérhető'+(G.tried&&G.tried.length?' ('+esc(G.tried[0])+')':'')+'.';
}
function render(){
  const sheet=document.getElementById('sheet');const topbar=document.getElementById('topbar');
  topbar.hidden=(G.st==='type'||G.st==='town'||G.st==='load');
  if(G.st==='type'){
    sheet.innerHTML=`<div class="panel g-center"><h2>Krízishét 🗓️</h2><p class="sub">5 nap, 5 döntés. Válassz települést:</p>
      <div class="g-types">${TYPES.map(x=>`<button onclick="gSelType('${x.k}')"><span class="ic">${x.ic}</span><b>${x.n}</b><span>${x.s}</span></button>`).join('')}</div></div>`;
    return;
  }
  if(G.st==='load'){const T=TYPES.find(x=>x.k===G.type);
    sheet.innerHTML=`<div class="panel g-center"><div style="font-size:46px;margin-bottom:4px">${T.ic}</div><h2>${esc(G.town?G.town.name:T.n)}</h2>
      <div class="g-load" id="gLoad"><span class="spin"></span><span>${esc(G.loadTxt||'Település sorsolása…')}</span></div>
      <p class="g-src">A valódi utcák, az iskola, a főtér és a domborzat betöltése — pár másodperc.</p></div>`;
    return;
  }
  if(G.st==='town'){const T=TYPES.find(x=>x.k===G.type);
    sheet.innerHTML=`<div class="panel g-center"><div style="font-size:46px;margin-bottom:4px">${T.ic}</div><h2>${esc(G.town.name)}</h2>
      <p class="sub" style="margin:6px 0 18px">Te vagy a polgármester. Jön egy nehéz hét.</p>
      <button class="btn btn-wide" onclick="gStart()">Kezdjük a hétfőt →</button>${MODE==='legacy'?`<p class="g-src">Illusztratív minta — a térképadat most nem volt elérhető.</p>`:''}</div>`;
    return;
  }
  if(G.st==='q'){
    const r=WEEK[G.i];
    if(G.ph===1){const demo=!G.tutDone;
      sheet.innerHTML=`<div class="swipewrap"><div class="scard${demo?' demo':''}" id="scard">${stamps(r)}
        <div class="chevs"><span class="chev cL">‹</span><span class="chev cR">›</span></div>${demo?'<div class="hand">👆</div>':''}
        <div class="sc-disc"><span class="ic">${r.ic}</span>${DAYS_HU[G.i]} · ${r.disc}</div><div class="sc-title">${r.t}</div><p class="sc-setup">${r.setup}</p>
        ${r.chips.map(c=>`<div class="sc-chip"><span class="ic">${c[0]}</span>${esc(c[1])}</div>`).join('')}
        ${r.q?`<div class="sc-q">${esc(r.q)}</div>`:''}${optRow(r)}
        <div class="sc-hint">← húzd el a kártyát →</div></div></div>`;
      bindSwipe('scard',commitSwipe);
    }else{
      const n=r.layers.length;
      sheet.innerHTML=`<div id="lybar"></div><div class="swipewrap"><div class="scard minicard" id="scard">${stamps(r)}
        <div class="chevs"><span class="chev cL">‹</span><span class="chev cR">›</span></div>
        <div class="g-call pending" id="gCall"><span class="ic">🔒</span><span>Kapcsold be mindet (0/${n})</span></div>
        <div class="sc-title">${r.ic} Végleges döntés?</div>${optRow(r)}
        <div class="sc-hint">nézd a térképet · kapcsolgasd a rétegeket · aztán húzd</div></div></div>`;
      mountLayerBar(r);bindSwipe('scard',commitSwipe);
    }
    return;
  }
  if(G.st==='rev'){
    const r=WEEK[G.i],ok=G.lastOk;const rs=document.getElementById('revstamp');rs.hidden=false;
    rs.innerHTML=`<div class="st ${ok?'ok':'no'}">${ok?'Telitalálat':'Mellément'}</div>`;
    clearTimeout(G.stampTO);clearTimeout(G.stampTO2);
    G.stampTO=setTimeout(()=>{const s=rs.querySelector('.st');if(s)s.classList.add('out');G.stampTO2=setTimeout(()=>{rs.hidden=true;},900);},4500);
    sheet.innerHTML=`<div class="panel g-center"><p class="rev-why">${r.why}</p><div class="rev-earn">+${G.earn}<i> pont${G.earn>r.pts?' · bónusz ✓':''}</i></div>
      <button class="btn btn-wide" onclick="gNext()">${G.i+1<WEEK.length?DAYS_HU[G.i+1]+' →':'A hét vége →'}</button></div>`;
    return;
  }
  if(G.st==='legacy'){
    sheet.innerHTML=`<div class="panel g-center"><h2>A hét lenyomata 🗺️</h2><p class="sub" style="margin-bottom:4px">A döntéseid ott maradtak a városon.</p>
      <div class="big" style="margin:8px 0 2px">${G.sc}<span style="font-size:18px;color:var(--faint)"> / ${MAXPTS}</span></div>
      ${G.time!=null?`<p class="g-note">⏱ ${fmtTime(G.time)}</p>`:''}
      <div class="g-sum">${G.hist.map(h=>`<div class="row"><span>${h.ic} ${h.day}${h.bonus?' · bónusz ✓':''}</span><b>${h.earn} / ${h.max}</b></div>`).join('')}</div>
      <button class="btn btn-wide" onclick="G.st='form';render()">Fel a ranglistára! 🏆</button>
      <button class="btn-replay" onclick="gReplay()">Új hét, új település</button></div>`;
    return;
  }
  if(G.st==='form'){
    sheet.innerHTML=`<div class="panel"><h2 style="text-align:center">Ranglista 🏆</h2><div class="g-form">
        <input type="text" id="g-name" placeholder="Név" maxlength="60"><input type="text" id="g-org" placeholder="Szervezet" maxlength="80"><input type="email" id="g-email" placeholder="E-mail" maxlength="80">
        <label class="g-check"><input type="checkbox" id="g-prezi" checked>Kérem a prezit! 📑</label>
        <label class="g-check"><input type="checkbox" id="g-consent">Hozzájárulok adataim kezeléséhez (kapcsolatfelvétel, anyagküldés) — opcionális.</label>
        <div class="g-err" id="g-err"></div><button class="btn btn-wide" id="g-submit" onclick="gSubmit()">Mentés →</button></div></div>`;
    return;
  }
  if(G.st==='board'){
    const rows=(G.board||[]).map((b,i)=>{const me=G.lead&&b.nick===G.lead.name&&(b.email==null||b.email===String(G.lead.email||'').trim().toLowerCase());
      return `<div class="row${me?' me':''}"><span>#${i+1} · ${esc(b.nick)}${b.org?`<i class="borg">${esc(b.org)}</i>`:''}</span><b>${b.score}${(SHOW_TIME&&b.time!=null)?' <em>⏱ '+fmtTime(b.time)+'</em>':''}</b></div>`;}).join('');
    sheet.innerHTML=`<div class="panel g-center"><h2>Ranglista 🏆</h2>${G.rank?`<p class="sub">A helyed: <b>#${G.rank}</b></p>`:''}<div class="g-board">${rows}</div>
      ${G.offline?`<p class="g-note">Az eredmény most helyben mentődött — a központi ranglista épp nem elérhető.</p>`:''}
      ${(G.lead&&G.lead.prezi)?`<a class="btn btn-wide" style="display:block;text-decoration:none;margin-top:10px" href="anyagok/ETOSZ_2026_eloadas.pdf" download>Prezi letöltése 📑</a><p class="g-note">E-mailben is küldjük.</p>`:''}
      <button class="btn-replay" onclick="gReplay()">Új hét, új település</button></div>`;
    return;
  }
}

/* ---- mentés + helyi ranglista ---- */
function gSubmit(){
  const name=document.getElementById('g-name').value.trim();const org=document.getElementById('g-org').value.trim();const email=document.getElementById('g-email').value.trim();
  const prezi=document.getElementById('g-prezi').checked;const cons=document.getElementById('g-consent').checked;const err=document.getElementById('g-err');
  if(!name){err.textContent='A név megadása kötelező.';return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Érvényes e-mail cím kell.';return;}
  G.lead={ts:new Date().toISOString(),name,org,email,consent:cons,prezi,score:G.sc,max:MAXPTS,time:G.time,town:G.town?G.town.name:'',type:G.type||'',variant:'krizishet',mode:MODE,
    days:G.hist.map(h=>({day:h.day,pick:h.pick,ok:!!h.ok,earn:h.earn,max:h.max,bonus:!!h.bonus}))};
  try{const a=JSON.parse(localStorage.getItem('gp-sw-leads')||'[]');a.push(G.lead);localStorage.setItem('gp-sw-leads',JSON.stringify(a));}catch(e){}
  const btn=document.getElementById('g-submit');btn.disabled=true;btn.textContent='Mentés…';
  const finish=(board,rank,offline)=>{G.board=board;G.rank=rank;G.offline=offline;G.st='board';render();};
  if(SHEET_WEBHOOK){const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),8000);
    fetch(SHEET_WEBHOOK,{method:'POST',body:JSON.stringify(G.lead),signal:ctrl.signal}).then(r=>r.json())
      .then(j=>{clearTimeout(to);if(j&&j.ok)finish(j.board||[],j.rank,false);else{const lb=localBoard(name,G.sc,G.time,org,email);finish(lb.board,lb.rank,true);}})
      .catch(()=>{clearTimeout(to);const lb=localBoard(name,G.sc,G.time,org,email);finish(lb.board,lb.rank,true);});
  }else{const lb=localBoard(name,G.sc,G.time,org,email);finish(lb.board,lb.rank,true);}
}
function localBoard(nick,score,time,org,email){
  const em=String(email||'').trim().toLowerCase();let b=[];try{b=JSON.parse(localStorage.getItem('gp-sw-board')||'null')||[];}catch(e){}
  if(!b.length)b=[{nick:'Térkép Zsófi',org:'Főépítészi iroda',score:800,time:230},{nick:'Polgi Mester',org:'Polgármesteri hivatal',score:650,time:260},{nick:'Geo Róka',org:'Térinformatikai kft.',score:475,time:205}];
  const better=(s1,t1,s2,t2)=>s1>s2||(s1===s2&&(t1==null?1e9:t1)<(t2==null?1e9:t2));
  const me=b.find(x=>x.nick===nick&&String(x.email||'').trim().toLowerCase()===em);
  if(me){if(better(score,time,me.score,me.time)){me.score=score;me.time=time;me.org=org||me.org;}}else b.push({nick,score,time,org:org||'',email:em});
  b.sort((x,y)=>y.score-x.score||((x.time==null?1e9:x.time)-(y.time==null?1e9:y.time)));
  try{localStorage.setItem('gp-sw-board',JSON.stringify(b));}catch(e){}
  return{board:b.slice(0,10),rank:b.findIndex(x=>x.nick===nick)+1};
}

/* ---- init ---- */
render();tickUI();initMap();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('in')));
