<style>
:root{--bg:#050f14;--teal:#2AD1B5;--amber:#FF9F45;--red:#ff6b4a;--text:#EAF4F4;--muted:#9BB7BC;--faint:#5E7A80;
  --card:rgba(6,17,22,.9);--line:rgba(42,209,181,.25);--font:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  --gv-accent:var(--teal);--gv-accent-ink:#04211d;--gv-line:var(--line);--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
#map{position:fixed;inset:0;z-index:0}
body.maperr #map{display:none}
body.maperr::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(900px 600px at 70% 20%,rgba(15,74,87,.55),transparent 60%),var(--bg)}
.homelink{position:fixed;top:calc(10px + var(--sat));left:10px;z-index:40;font:700 12px var(--mono);letter-spacing:.06em;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(10px);text-decoration:none}
.topbar{position:fixed;top:calc(10px + var(--sat));right:10px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:100px;padding:4px 5px 4px 12px;backdrop-filter:blur(12px);font:500 13px var(--mono);color:var(--muted);max-width:calc(100vw - 126px);white-space:nowrap}
#tb-round{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* sötét / világos kapcsoló a felső sávban */
.thm{flex:none;display:inline-flex;gap:2px;padding:2px;border-radius:100px;background:rgba(127,127,127,.2)}
.thm button{border:none;background:transparent;width:27px;height:26px;border-radius:100px;font-size:13px;line-height:1;cursor:pointer;opacity:.5;filter:grayscale(.7);transition:background .2s,opacity .2s,filter .2s;touch-action:manipulation}
.thm button[aria-pressed=true]{background:var(--teal);opacity:1;filter:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.thm button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.topbar b{color:var(--amber);font-weight:500}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;padding:0 12px calc(12px + var(--sab))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;backdrop-filter:blur(16px);
  box-shadow:0 -10px 50px rgba(0,0,0,.55);max-height:62vh;overflow:auto}
h1{font-size:24px;font-weight:900;line-height:1.15;margin-bottom:6px}
h1 em{font-style:normal;color:var(--teal)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.18em;color:var(--teal);text-transform:uppercase;margin-bottom:8px;display:block}
p{color:var(--muted);font-size:15px}p+p{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;
  border:none;transition:.2s;font-family:var(--font);background:var(--teal);color:#04211d;min-height:50px;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;cursor:default}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.row .btn{flex:1}
.cnt{display:flex;gap:6px;margin:12px 0 2px}.cnt i{flex:1;height:8px;border-radius:4px;background:rgba(143,176,181,.25)}.cnt i.on{background:var(--teal)}
.hint{font:500 12.5px var(--mono);color:var(--faint);margin-top:10px;min-height:17px}
.hint b{color:var(--teal)}
/* a probléma pontokban: ikon + egy rövid mondat soronként */
.prob{display:grid;gap:8px;margin:4px 0 2px}
.prob>div{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text);line-height:1.4}
.prob .ic{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(42,209,181,.12);display:flex;align-items:center;justify-content:center;font-size:15px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sc{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(15,74,87,.2)}
.sc span{display:block;font:500 11px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.sc b{display:block;font:500 34px var(--mono);line-height:1.1;margin-top:4px}
.sc.b1 b{color:var(--amber)}.sc.b2 b{color:var(--teal)}
.msg{border-left:3px solid var(--amber);padding:8px 12px;margin-top:12px;color:var(--text);font-size:15px;background:rgba(255,159,69,.08);border-radius:0 10px 10px 0}
.src{font:500 11px var(--mono);color:var(--faint);margin-top:8px}
/* fa-markerek: a külső elemet a MapLibre pozicionálja (transform), ezért azon nincs saját transform/animáció */
.mk{width:34px;height:34px;cursor:pointer}
.tree{width:34px;height:34px;border-radius:50%;background:rgba(6,17,22,.85);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;
  font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.6);position:relative;animation:pop .35s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.tree .pt{position:absolute;top:-9px;right:-11px;font:700 11px var(--mono);background:var(--teal);color:#04211d;border-radius:100px;padding:1px 6px;display:none}
.tree.scored .pt{display:block}
.tree.lo{border-color:var(--red)}.tree.lo .pt{background:var(--red);color:#fff}
.tree.mid{border-color:var(--amber)}.tree.mid .pt{background:var(--amber);color:#2b1400}
/* az 1. kör fái a 2. körben: halvány „szellem”-jelölők, nem fogják a koppintást */
.mk.ghost{pointer-events:none}.mk.ghost .tree{opacity:.42;animation:none}
.poi{width:26px;height:26px;border-radius:50%;background:rgba(199,123,255,.25);border:1.5px solid #c77bff;display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none;animation:fadein .35s}
/* legjobb helyek: térképi réteg (sárga „metszet”-ragyogás + gyűrűk), nem HTML-jelölő — zoomolásra, mozgatásra a térképpel együtt mozog */
@keyframes fadein{from{opacity:0}to{opacity:1}}
.maplibregl-ctrl-attrib{font-size:10px!important}
/* ---- világos mód: Positron alaptérkép, világos panel és jelölők (a választás a böngészőben megmarad) ---- */
html[data-theme=light]{--bg:#eef2f1;--teal:#087f6e;--amber:#c2620f;--red:#d94a32;--text:#0d2229;--muted:#3f5d66;--faint:#6b858c;
  --card:rgba(255,255,255,.93);--line:rgba(8,127,110,.26);--gv-accent:#2AD1B5;--gv-accent-ink:#04211d}
html[data-theme=light] .panel{box-shadow:0 -8px 36px rgba(0,30,40,.18)}
html[data-theme=light] .btn{background:#2AD1B5;color:#04211d}
html[data-theme=light] .btn-ghost{background:transparent;color:var(--text)}
html[data-theme=light] .cnt i{background:rgba(13,34,41,.12)}html[data-theme=light] .cnt i.on{background:#2AD1B5}
html[data-theme=light] .sc{background:rgba(8,127,110,.07)}
html[data-theme=light] .tree{background:rgba(255,255,255,.96);box-shadow:0 3px 10px rgba(0,20,30,.28)}
html[data-theme=light] .tree .pt,html[data-theme=light] .tree.mid .pt{color:#fff}
html[data-theme=light] .poi{background:rgba(139,63,217,.14);border-color:#8b3fd9}
html[data-theme=light] .thm button[aria-pressed=true]{background:#2AD1B5}
html[data-theme=light] body.maperr::before{background:radial-gradient(900px 600px at 70% 20%,rgba(42,209,181,.18),transparent 60%),var(--bg)}
html[data-theme=light] .gvl-chip[data-id=best]{--c:#c99a06!important;--cbg:rgba(201,154,6,.16)!important}
html[data-theme=light] .gvl-chip[data-id=canopy]{--c:#1f9d5c!important;--cbg:rgba(31,157,92,.14)!important}
html[data-theme=light] .gvl-chip[data-id=vuln]{--c:#8b3fd9!important;--cbg:rgba(139,63,217,.12)!important}
html[data-theme=light] .gvl-chip[data-id=ped]{--c:#d89a00!important;--cbg:rgba(216,154,0,.14)!important}
html[data-theme=light] .gvl-chip[data-id=ghost]{--c:#6b858c!important;--cbg:rgba(107,133,140,.14)!important}
.err{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
body.maperr .err{display:flex}
.err div{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<script>
/* =====================================================================
   HOVÁ ÜLTETNÉL 10 FÁT? — a település valódi utcáin (OSM), két kör: vakon → adattal
   A fa csak utca mellé kerülhet (úthoz igazítva), vízre nem; koppintás a fára = visszavétel.
   Rétegek az OSM-ből: hőség (burkolt felület, útsűrűség, zöld és víz hiánya), sérülékeny lakók
   (bölcsőde, óvoda, iskola, idősotthon, rendelő, kórház), gyalogos forgalom (boltok, főutak), lombkorona (parkok, erdők).
   A rétegek az 1. kör kiértékelése után egyenként kapcsolhatók a térkép fölötti chip-sorral (GVMAP.layerControl);
   alapból a hőség, a sérülékeny lakók és a meglévő zöld van bekapcsolva, a boltok nem. Az 1. kör fái halványan maradnak.
   Ha az OSM nem érhető el: illusztratív minta-rétegek.
   ===================================================================== */
const T=GV.TOWN;
document.getElementById('homelink').href=GV.hubUrl();
document.getElementById('err-next').href=GV.urlFor('jatekok/esokert.html');
const AX=520,AY=470; /* a játéktér fél-szélessége / fél-magassága méterben */
/* v3.3: alapból 5 fa és döntött, 3D nézet (épületek a csempékből). Felülírás az URL-ben: ?fak=10 (3–10), ?3d=0 */
const Q=new URLSearchParams(location.search);
const N=Math.max(3,Math.min(10,+Q.get('fak')||5));const D3=Q.get('3d')!=='0';
const NW={3:'három',4:'négy',5:'öt',6:'hat',7:'hét',8:'nyolc',9:'kilenc',10:'tíz'};const nw=NW[N]||String(N);const nwA=(/^[aeiouáéíóöőúüű]/.test(nw)?'az ':'a ')+nw;
let S={st:'loading',round:1,trees:[],ghosts:[],r1:null,r2:null,blindPts:null,toggles:{}};
let map=null,mapReady=false,D=null,E=null,MODE='osm',center=T.center;
const P=document.getElementById('panel');const TB=document.getElementById('tb-round');
/* ---- téma: sötét (alap) vagy világos. ?tema=vilagos|sotet felülírja; a választást a böngésző megjegyzi ---- */
let THEME=(()=>{const q=(Q.get('tema')||Q.get('theme')||'').toLowerCase();if(/^(light|vilagos|világos)$/.test(q))return 'light';if(/^(dark|sotet|sötét)$/.test(q))return 'dark';
  try{const t=localStorage.getItem('gv-theme');if(t==='light'||t==='dark')return t;}catch(e){}return 'dark';})();
document.documentElement.dataset.theme=THEME;
const TP={ /* a saját térképi rétegek színei témánként (a világos alapon sötétebb, telítettebb árnyalatok) */
 dark:{area:'#2AD1B5',areaW:1.5,areaOp:.55,areaDash:[3,3],caseW:4,caseOp:0,canopy:'#3ddc97',vuln:'#c77bff',ped:'#ffd166',pedStroke:'#2b1400',ring:'#ffe08a',ringFill:'rgba(255,224,138,.16)',core:'#fff6cc',coreStroke:'#3a2a00',ping:'#fff1a8',
  heat:['interpolate',['linear'],['heatmap-density'],0,'rgba(255,107,74,0)',0.3,'rgba(255,159,69,.08)',0.55,'rgba(255,120,74,.4)',0.8,'rgba(255,80,50,.78)',1,'rgba(255,50,35,.95)'],
  glow:['interpolate',['linear'],['heatmap-density'],0,'rgba(255,224,138,0)',0.25,'rgba(190,230,110,.18)',0.55,'rgba(255,230,120,.55)',0.85,'rgba(255,245,170,.85)',1,'rgba(255,255,220,.98)']},
 light:{area:'#06695c',areaW:2.6,areaOp:.95,areaDash:[2.4,1.6],caseW:6,caseOp:.9, /* világos alapon vastagabb, sötétebb szaggatott keret fehér szegéllyel */canopy:'#1f9d5c',vuln:'#8b3fd9',ped:'#f2b705',pedStroke:'#5a3b00',ring:'#a86b00',ringFill:'rgba(250,204,21,.28)',core:'#fffbe6',coreStroke:'#6b4200',ping:'#d69e2e',
  heat:['interpolate',['linear'],['heatmap-density'],0,'rgba(255,107,74,0)',0.3,'rgba(255,140,60,.08)',0.55,'rgba(240,100,60,.4)',0.8,'rgba(225,60,40,.72)',1,'rgba(200,30,30,.9)'],
  glow:['interpolate',['linear'],['heatmap-density'],0,'rgba(250,204,21,0)',0.25,'rgba(250,204,21,.3)',0.55,'rgba(250,190,20,.6)',0.85,'rgba(245,165,10,.85)',1,'rgba(240,140,0,.95)']}};
let mapTheme=THEME,swapping=false;
function thmUI(){document.querySelectorAll('#thm button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===THEME)));}
function setTheme(t){if(t!=='light'&&t!=='dark'||t===THEME)return;THEME=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('gv-theme',t);}catch(e){}thmUI();applyMapTheme();}
document.getElementById('thm').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t);});thmUI();
/* a saját források és rétegek átkerülnek az új alaptérkép-stílusba; a 3D-épületek új színnel, a feliratok alá */
const KEEP=new Set(['area','area-case','heat','canopy','vuln','ped','best-glow','best-top','canopy-f','vuln-f','vuln-l','best-ring','best-ping','best-core']);
function applyMapTheme(){if(!mapReady||!layersAdded||swapping||mapTheme===THEME)return;swapping=true;const want=THEME;cancelAnimationFrame(pingRAF);
  GVMAP.setMapTheme(map,want,id=>KEEP.has(id)).then(()=>{mapTheme=want;swapping=false;if(D3)GVMAP.add3D(map,want);themePaint();syncLayers();if(THEME!==mapTheme)applyMapTheme();});}
function themePaint(){const t=TP[THEME];const sp=(id,p,v)=>{try{if(map.getLayer(id))map.setPaintProperty(id,p,v);}catch(e){}};
  sp('area','line-color',t.area);sp('area','line-width',t.areaW);sp('area','line-opacity',t.areaOp);sp('area','line-dasharray',t.areaDash);sp('area-case','line-width',t.caseW);sp('area-case','line-opacity',t.caseOp);sp('canopy-f','fill-color',t.canopy);sp('vuln-f','fill-color',t.vuln);sp('vuln-l','line-color',t.vuln);sp('ped','circle-color',t.ped);sp('ped','circle-stroke-color',t.pedStroke);
  sp('heat','heatmap-color',t.heat);sp('best-glow','heatmap-color',t.glow);sp('best-ring','circle-color',t.ringFill);sp('best-ring','circle-stroke-color',t.ring);
  sp('best-core','circle-color',t.core);sp('best-core','circle-stroke-color',t.coreStroke);sp('best-ping','circle-stroke-color',t.ping);}
/* csere után a rétegek láthatósága a chipek állapotát követi (ha közben kapcsoltak) */
function syncLayers(){if(!LC)return;Object.keys(MAPL).forEach(id=>{const on=LC.get(id);(MAPL[id]||[]).forEach(([lid,prop,val])=>{try{if(!map.getLayer(lid))return;map.setLayoutProperty(lid,'visibility',on?'visible':'none');map.setPaintProperty(lid,prop,on?val:0);}catch(e){}});});}
const townTxt=T.name?GV.esc(T.name):'a település';
const rnd=GV.rng('fak-'+T.key);

/* ---- illusztratív tartalék-rétegek (méterben, gauss-foltok) ---- */
function procedural(){const g=(blobs,x,y)=>{let s=0;blobs.forEach(b=>{const d2=((x-b[0])/b[2])**2+((y-b[1])/(b[2]*0.8))**2;s+=b[3]*Math.exp(-d2*0.9);});return Math.min(1,s);};
  const L={heat:[[330,100,205,1],[150,265,130,.75],[-265,-200,150,.55],[430,-100,100,.5]],vuln:[[345,80,165,1],[-100,75,100,.65],[265,300,90,.5]],
    ped:[[165,50,115,.8],[330,80,100,.9],[15,10,80,.7],[-50,60,65,.6]],canopy:[[0,0,100,.95],[-330,215,155,1],[165,-215,90,.75],[-180,-35,75,.6]]};
  return{L,E:{heat:(x,y)=>g(L.heat,x,y),vuln:(x,y)=>g(L.vuln,x,y),ped:(x,y)=>g(L.ped,x,y),canopy:(x,y)=>g(L.canopy,x,y),inWater:()=>false}};}
function blobPoly(cx,cy,r,seed){const rr=GV.rng('b'+seed),n=18,rad=[];for(let i=0;i<n;i++)rad.push(r*(1+(rr()*2-1)*.3));for(let i=0;i<n;i++)rad[i]=(rad[i]+rad[(i+1)%n]+rad[(i+n-1)%n])/3;
  const ring=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,q=rad[i%n];ring.push([cx+Math.cos(a)*q,cy+Math.sin(a)*q*0.8]);}return ring;}

/* ---- rétegek: chip-sor a panel fölött (jelmagyarázat + kapcsoló), a térképi rétegek 0→teljes átlátszatlansággal úsznak be ---- */
const LAYERS=[
  {id:'heat',label:'Hőség',icon:'🔥',color:'#ff6b4a',title:'Hol gyűlik a hő: burkolat, sűrű utcák, kevés zöld és víz'},
  {id:'vuln',label:'Sérülékeny lakók',icon:'🧒',color:'#c77bff',title:'Bölcsőde, óvoda, iskola, rendelő, idősotthon — kb. 150 m-es körzet'},
  {id:'canopy',label:'Meglévő zöld',icon:'🌳',color:'#3ddc97',title:'Parkok, erdők, gyep — ahol már van lombkorona'},
  {id:'ped',label:'Gyalogos forgalom',icon:'🛍️',color:'#ffd166',title:'Boltok, vendéglátás — ahol sokan járnak'},
  {id:'best',label:'Legjobb helyek',icon:'⭐',color:'#ffe08a',title:'A rétegek metszete: ahol a hőség, a sérülékeny lakók és a hiányzó lombkorona találkozik — a sárga ragyogás a legértékesebb sáv, a gyűrűk a 8 legjobb hely'},
  {id:'ghost',label:'1. kör fái',icon:'📍',color:'#9BB7BC',title:'Ahová az első körben, adat nélkül ültettél'}];
/* a legjobb helyek: utca melletti rácspontok értéke (treeValue = a rétegek metszete). A felső negyed sárgán ragyog
   (heatmap-réteg), a nyolc legjobb — egymástól legalább 90 m-re — gyűrűt kap. A szaggatott kerettől legalább EDGE méterre
   (a kereten kívülre nem lehet ültetni, ott ne legyen gyűrű). */
const EDGE=35;
function bestGrid(){const c=[];for(let x=-AX;x<=AX;x+=25)for(let y=-AY;y<=AY;y+=25){if(E.inWater(x,y))continue;const rd=E.roadDist?E.roadDist(x,y):0;if(rd>60)continue;
    let px=x,py=y;if(MODE==='osm'){const sn=GVMAP.snapToRoad(D,x,y,60);if(!sn)continue;px=sn.x;py=sn.y;if(E.inWater(px,py)||E.nearRail(px,py))continue;}
    if(Math.abs(px)>AX-EDGE||Math.abs(py)>AY-EDGE)continue;
    c.push([px,py,GVMAP.treeValue(E,px,py)]);}
  return c;}
/* pontozás a település saját skáláján: a legjobb (gyűrűs) hely 10 pont, a többi ehhez mérten */
let VMAX=1;
function ptsAt(x,y){return Math.max(0,Math.min(10,Math.round(10*GVMAP.treeValue(E,x,y)/VMAX)));}
function bestSpots(c){const s=c.slice().sort((a,b)=>b[2]-a[2]);const out=[];for(const q of s){if(out.length>=8)break;if(out.some(o=>Math.hypot(o[0]-q[0],o[1]-q[1])<90))continue;out.push(q);}return out;}
function bestSources(){const c=bestGrid();if(!c.length)return{glow:GVMAP.pointsFC([]),top:GVMAP.pointsFC([])};
  VMAX=Math.max(0.05,...c.map(q=>q[2]));
  const vs=c.map(q=>q[2]).sort((a,b)=>a-b);const q0=vs[Math.floor(vs.length*0.72)],mx=vs[vs.length-1];const span=Math.max(0.05,mx-q0);
  const glow={type:'FeatureCollection',features:c.filter(q=>q[2]>q0).map(q=>({type:'Feature',properties:{w:+Math.pow((q[2]-q0)/span,1.4).toFixed(3)},geometry:{type:'Point',coordinates:GVMAP.toLL(q[0],q[1])}}))};
  const top={type:'FeatureCollection',features:bestSpots(c).map((q,i)=>({type:'Feature',properties:{rank:i+1,pts:Math.min(10,Math.round(10*q[2]/VMAX))},geometry:{type:'Point',coordinates:GVMAP.toLL(q[0],q[1])}}))};
  return{glow,top};}
/* térképi réteg → (réteg-id, átlátszatlanság-tulajdonság, bekapcsolt érték) */
const MAPL={heat:[['heat','heatmap-opacity',.8]],vuln:[['vuln-f','fill-opacity',.22],['vuln-l','line-opacity',.9]],canopy:[['canopy-f','fill-opacity',.3]],ped:[['ped','circle-opacity',.85],['ped','circle-stroke-opacity',1]],
  best:[['best-glow','heatmap-opacity',.95],['best-ring','circle-opacity',1],['best-ring','circle-stroke-opacity',1],['best-core','circle-opacity',1]]};
let LC=null,revealT=[];
function applyLayer(id,on){
  if(id==='ghost'){S.ghosts.forEach(t=>on?t.mk.addTo(map):t.mk.remove());return;}
  if(!mapReady||!layersAdded||swapping)return; /* stílus-csere alatt a syncLayers állítja be utána */
  const safe=f=>{if(swapping)return;try{f();}catch(e){}}; /* (az isStyleLoaded csempetöltés közben is hamis — nem jó őr) */
  (MAPL[id]||[]).forEach(([lid,prop,val])=>{
    if(on){safe(()=>map.setLayoutProperty(lid,'visibility','visible'));requestAnimationFrame(()=>safe(()=>map.setPaintProperty(lid,prop,val)));}
    else{safe(()=>map.setPaintProperty(lid,prop,0));setTimeout(()=>{if(LC&&!LC.get(id))safe(()=>map.setLayoutProperty(lid,'visibility','none'));},450);}});
  if(id==='vuln')poiMarkers.forEach(m=>on?m.addTo(map):m.remove());
  if(id==='best'&&on)setTimeout(()=>pingBest(3),420);
}
/* „radar-ping”: a 8 legjobb hely gyűrűje háromszor kitágul és elhalványul — térképi rétegen (best-ping), így a térképpel
   együtt mozog; nem fut folyamatosan (akku), és csökkentett mozgásnál elmarad */
let pingRAF=0;
function pingBest(times){if(!mapReady||!layersAdded||!map.getLayer('best-ping'))return;cancelAnimationFrame(pingRAF);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dur=1500,t0=performance.now();map.setLayoutProperty('best-ping','visibility','visible');
  const baseR=()=>{const z=map.getZoom();return z<=13?6:z>=17?19:z<15?6+(z-13)*2.5:11+(z-15)*4;};
  const step=now=>{const e=(now-t0)/dur;if(swapping||!map.getLayer('best-ping'))return;
    if(e>=times||!LC||!LC.get('best')){map.setPaintProperty('best-ping','circle-stroke-opacity',0);map.setLayoutProperty('best-ping','visibility','none');return;}
    const t=e%1;map.setPaintProperty('best-ping','circle-radius',baseR()*(1+1.7*t));map.setPaintProperty('best-ping','circle-stroke-opacity',0.9*(1-t)*(1-t));
    pingRAF=requestAnimationFrame(step);};
  pingRAF=requestAnimationFrame(step);}
LC=GVMAP.layerControl({container:'layers',title:'Rétegek',hint:(matchMedia('(hover:hover) and (pointer:fine)').matches?'kattintásra':'koppintásra')+' be / ki',
  layers:LAYERS.map(l=>Object.assign({apply:on=>applyLayer(l.id,on)},l)),
  onChange:(id,on,user)=>{if(user){S.toggles[id]=(S.toggles[id]||0)+1;if(S.demo)endDemo();}if(S.st==='place'&&S.round===2&&id==='best')render();}});
function showChips(v){LC.show(v);}

/* ---- indulás: középpont → térkép → adat a betöltött csempékből (tartalék: Overpass) ---- */
render();
GVMAP.resolveCenter(T).then(c=>{center=c;GVMAP.setCenter(c);initMap();});
function initMap(){
  map=GVMAP.createMap({container:'map',theme:THEME,center,zoom:15,pitch:D3?50:0,bearing:D3?-15:0,dragRotate:false,pitchWithRotate:false,touchPitch:false},
    m=>{mapReady=true;try{m.touchZoomRotate.disableRotation();}catch(e){}if(D3)GVMAP.add3D(m,THEME);
      const ring=[[-AX,-AY],[AX,-AY],[AX,AY],[-AX,AY],[-AX,-AY]].map(p=>GVMAP.toLL(p[0],p[1]));
      m.addSource('area',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[ring]}}});
      m.addLayer({id:'area-case',type:'line',source:'area',paint:{'line-color':'#ffffff','line-width':TP[THEME].caseW,'line-opacity':TP[THEME].caseOp,'line-blur':.5}});
      m.addLayer({id:'area',type:'line',source:'area',paint:{'line-color':TP[THEME].area,'line-width':TP[THEME].areaW,'line-dasharray':TP[THEME].areaDash,'line-opacity':TP[THEME].areaOp}});
      fitArea();m.on('click',onTap);
      GVMAP.whenIdle(m,7000).then(()=>GVMAP.loadData(m,T,center,800)).then(d=>{D=d;
        if(D.ok&&!D.water.some(p=>GVMAP.pointInPoly(0,0,p))){E=GVMAP.evaluators(D);MODE='osm';}
        else{const pr=procedural();E=pr.E;S.PL=pr.L;MODE='proc';}
        if(S.st==='loading')S.st='intro';render();addLayers();fitArea(true);});},
    ()=>document.body.classList.add('maperr'));
}
function fitArea(anim){if(!mapReady)return;const sheet=document.querySelector('.sheet');const bottom=Math.min(window.innerHeight*0.55,(sheet?sheet.offsetHeight:260)+18);
  if(!D3){map.fitBounds([GVMAP.toLL(-AX,-AY),GVMAP.toLL(AX,AY)],{padding:{top:70,bottom,left:16,right:16},duration:anim?700:0,maxZoom:17});return;}
  /* 3D: a célkamerát kiszámoljuk, és egy mozdulattal odaúszunk — nincs közbenső (pitch 0) ugrás */
  let cam=null;try{cam=map.cameraForBounds([GVMAP.toLL(-AX,-AY),GVMAP.toLL(AX,AY)],{padding:{top:70,bottom:bottom+10,left:14,right:14},maxZoom:17});}catch(e){}
  if(!cam)return;map.easeTo({center:cam.center,zoom:cam.zoom+0.4,pitch:50,bearing:-15,duration:anim?900:0,essential:true});}
window.addEventListener('resize',()=>fitArea(true));

let layersAdded=false,poiMarkers=[];
function addLayers(){if(layersAdded||!mapReady||!E)return;layersAdded=true;const v='none',tr={duration:380,delay:0};
  if(MODE==='osm'){
    map.addSource('heat',{type:'geojson',data:GVMAP.heatGrid(E,Math.max(AX,AY)+60,26)});
    map.addSource('canopy',{type:'geojson',data:GVMAP.polysFC(D.green)});
    map.addSource('vuln',{type:'geojson',data:GVMAP.circleFC(D.pois,150)});
    map.addSource('ped',{type:'geojson',data:GVMAP.pointsFC(D.shops)});
    D.pois.forEach(p=>{const el=document.createElement('div');el.className='poi';el.textContent=p.ic||'🏥';el.title=p.n;const mk=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(GVMAP.toLL(p.x,p.y));poiMarkers.push(mk);});
  }else{const L=S.PL;const pf=(blobs,seed)=>({type:'FeatureCollection',features:blobs.map((b,i)=>({type:'Feature',properties:{w:b[3]},geometry:{type:'Polygon',coordinates:[blobPoly(b[0],b[1],b[2],seed+i).map(q=>GVMAP.toLL(q[0],q[1]))]}}))});
    const hf=[];for(let i=0;i<900;i++){const x=(rnd()*2-1)*AX*1.1,y=(rnd()*2-1)*AY*1.1;const w=E.heat(x,y);if(w>0.08&&rnd()<w)hf.push({type:'Feature',properties:{w},geometry:{type:'Point',coordinates:GVMAP.toLL(x,y)}});}
    map.addSource('heat',{type:'geojson',data:{type:'FeatureCollection',features:hf}});
    map.addSource('canopy',{type:'geojson',data:pf(L.canopy,'c')});map.addSource('vuln',{type:'geojson',data:pf(L.vuln,'v')});
    const sf=[];L.ped.forEach(b=>{for(let i=0;i<5;i++)sf.push({type:'Feature',properties:{},geometry:{type:'Point',coordinates:GVMAP.toLL(b[0]+(rnd()*2-1)*b[2]*.7,b[1]+(rnd()*2-1)*b[2]*.6)}});});
    map.addSource('ped',{type:'geojson',data:{type:'FeatureCollection',features:sf}});}
  /* minden réteg rejtve és 0 átlátszatlansággal indul; a chip kapcsolja be (applyLayer), átmenettel */
  map.addLayer({id:'heat',type:'heatmap',source:'heat',layout:{visibility:v},paint:{'heatmap-weight':['get','w'],'heatmap-intensity':1.1,
    'heatmap-radius':['interpolate',['linear'],['zoom'],13,14,15,30,17,70],'heatmap-opacity':0,'heatmap-opacity-transition':tr,
    'heatmap-color':TP[THEME].heat}});
  map.addLayer({id:'canopy-f',type:'fill',source:'canopy',layout:{visibility:v},paint:{'fill-color':TP[THEME].canopy,'fill-opacity':0,'fill-opacity-transition':tr}});
  map.addLayer({id:'vuln-f',type:'fill',source:'vuln',layout:{visibility:v},paint:{'fill-color':TP[THEME].vuln,'fill-opacity':0,'fill-opacity-transition':tr}});
  map.addLayer({id:'vuln-l',type:'line',source:'vuln',layout:{visibility:v},paint:{'line-color':TP[THEME].vuln,'line-width':1.5,'line-dasharray':[2,2],'line-opacity':0,'line-opacity-transition':tr}});
  map.addLayer({id:'ped',type:'circle',source:'ped',layout:{visibility:v},paint:{'circle-color':TP[THEME].ped,'circle-radius':4.5,'circle-opacity':0,'circle-opacity-transition':tr,'circle-stroke-color':TP[THEME].pedStroke,'circle-stroke-width':1,'circle-stroke-opacity':0,'circle-stroke-opacity-transition':tr}});
  /* a rétegek metszete: sárga ragyogás a legértékesebb sávon + gyűrű a 8 legjobb helyen — térképi réteg, a térképpel mozog */
  const B=bestSources();map.addSource('best-glow',{type:'geojson',data:B.glow});map.addSource('best-top',{type:'geojson',data:B.top});
  map.addLayer({id:'best-glow',type:'heatmap',source:'best-glow',layout:{visibility:v},paint:{'heatmap-weight':['get','w'],'heatmap-intensity':['interpolate',['linear'],['zoom'],13,0.9,17,1.6],
    'heatmap-radius':['interpolate',['linear'],['zoom'],13,9,15,20,17,46],'heatmap-opacity':0,'heatmap-opacity-transition':tr,
    'heatmap-color':TP[THEME].glow}});
  map.addLayer({id:'best-ring',type:'circle',source:'best-top',layout:{visibility:v},paint:{'circle-color':TP[THEME].ringFill,'circle-radius':['interpolate',['linear'],['zoom'],13,6,15,11,17,19],
    'circle-opacity':0,'circle-opacity-transition':tr,'circle-stroke-color':TP[THEME].ring,'circle-stroke-width':2.5,'circle-stroke-opacity':0,'circle-stroke-opacity-transition':tr}});
  map.addLayer({id:'best-ping',type:'circle',source:'best-top',layout:{visibility:v},paint:{'circle-color':'rgba(0,0,0,0)','circle-radius':10,'circle-stroke-color':TP[THEME].ping,'circle-stroke-width':2,'circle-stroke-opacity':0}});
  map.addLayer({id:'best-core',type:'circle',source:'best-top',layout:{visibility:v},paint:{'circle-color':TP[THEME].core,'circle-radius':3.2,'circle-opacity':0,'circle-opacity-transition':tr,'circle-stroke-color':TP[THEME].coreStroke,'circle-stroke-width':1}});
  if(mapTheme!==THEME)setTimeout(applyMapTheme,0); /* ha betöltés közben váltottak témát */
}

/* ---- ültetés ---- */
function onTap(e){
  if(S.st!=='place'||S.trees.length>=N)return;
  let [x,y]=GVMAP.toXY(e.lngLat.lng,e.lngLat.lat);
  if(Math.abs(x)>AX||Math.abs(y)>AY){flash('A szaggatott kereten belül ültess.');return;}
  if(E.inWater(x,y)){flash('Vízre nem lehet fát ültetni.');return;}
  if(MODE==='osm'){if(E.nearRail(x,y)){flash('Vasútra nem — koppints egy utca mellé.');return;}
    const s=GVMAP.snapToRoad(D,x,y,60);if(!s){flash('Koppints egy utca mellé — a fa a járda mellé kerül.');return;}x=s.x;y=s.y;
    if(E.inWater(x,y)||E.nearRail(x,y)){flash('Itt víz vagy vasút van — válassz másik utcát.');return;}}
  const ll=GVMAP.toLL(x,y);
  const el=document.createElement('div');el.className='mk';el.innerHTML='<div class="tree">🌳<span class="pt"></span></div>';
  const t={x:+x.toFixed(1),y:+y.toFixed(1),el};
  el.addEventListener('click',ev=>{ev.stopPropagation();if(S.st!=='place')return;removeTree(t);});
  t.mk=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(ll).addTo(map);
  if(S.round===2){const p=ptsAt(t.x,t.y);t.p=p;const tr=el.querySelector('.tree');tr.classList.add('scored',p<=3?'lo':p<=6?'mid':'hi');tr.querySelector('.pt').textContent=p;S.last=p;}
  S.trees.push(t);render();
}
function removeTree(t){const i=S.trees.indexOf(t);if(i<0)return;t.mk.remove();S.trees.splice(i,1);render();}
function undo(){const t=S.trees[S.trees.length-1];if(t)removeTree(t);}
function evaluate(){let total=0;S.trees.forEach(t=>{const p=ptsAt(t.x,t.y);t.p=p;total+=p;const tr=t.el.querySelector('.tree');tr.classList.add('scored',p<=3?'lo':p<=6?'mid':'hi');tr.querySelector('.pt').textContent=p;});return total;}
let flashT=null;function flash(m){const h=P.querySelector('.hint');if(!h)return;const o=h.dataset.base||h.textContent;h.dataset.base=o;h.textContent=m;clearTimeout(flashT);flashT=setTimeout(()=>{h.textContent=o;},2200);}

/* ---- képernyők ---- */
/* egy rövid sor az indítóképernyőn: minta-település és adatforrás (részletek: README) */
const srcTxt=()=>(T.demo?'Minta-település: '+T.demo+' · ':'')+(MODE==='osm'?'Utcák, zöld, intézmények: OpenStreetMap ('+(D&&D.src==='tiles'?'térképcsempék':'Overpass')+')':'Illusztratív minta-rétegek — az OSM-adat most nem érhető el');
function render(){const n=S.trees.length;
  showChips(S.st==='layers'||(S.st==='place'&&S.round===2)); /* a záróképernyőn a panelé a hely */
  if(S.st==='loading'){TB.innerHTML='Hőhullám · <b>'+townTxt+'</b>';P.innerHTML=`<span class="eyebrow">Lakossági döntésjáték · 2–3 perc</span><h1>Hová ültetnél <em>${N} fát</em>?</h1>
    <p><span class="spin"></span>${T.name?townTxt:(T.demo||'A település')} utcáinak betöltése…</p><div class="hint">OpenStreetMap-adat a térképcsempékből, pár másodperc.</div>`;return;}
  if(S.st==='intro'){TB.innerHTML='Hőhullám · <b>'+townTxt+'</b>';P.innerHTML=`<span class="eyebrow">Lakossági döntésjáték · 2–3 perc</span>
    <h1>Hová ültetnél <em>${N} fát</em>?</h1>
    <div class="prob"><div><span class="ic">🌡️</span><span>Hőhullám jön.</span></div><div><span class="ic">🌳</span><span>${nw.charAt(0).toUpperCase()+nw.slice(1)} fára van keret — ugyanannyiba kerül mind, de nem ugyanannyit ér.</span></div><div><span class="ic">🗺️</span><span>Előbb adat nélkül ültetsz, aztán a rétegekkel — és látod a különbséget.</span></div></div>
    <div class="row"><button class="btn" onclick="start()">Indítás</button></div><div class="src">${srcTxt()}</div>`;return;}
  if(S.st==='place'){TB.innerHTML=(S.round===1?'1. kör · vakon':'2. kör · adattal')+' · <b>'+n+'/'+N+'</b>';
    P.innerHTML=`<span class="eyebrow">${S.round===1?'1. kör — adat nélkül':'2. kör — a rétegekkel'}</span>
    <h1>${S.round===1?'Koppints az utcákra, ahová fát ültetnél':(LC.get('best')?'Most ültesd újra — a sárga gyűrűkre':'Most ültesd újra — a rétegek alapján')}</h1>
    <div class="cnt">${Array.from({length:N},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost" onclick="undo()" ${n?'':'disabled'}>Vissza</button><button class="btn" onclick="finishRound()" ${n===N?'':'disabled'}>Kiértékelés</button></div>
    <div class="hint">${S.round===2?(n<N?(S.last!=null?'Ez a hely <b>'+S.last+' pont</b>. ':'')+(LC.get('best')?'A sárga ragyogás a rétegek metszete, a gyűrűk a 8 legjobb hely, a legjobb 10 pont — oda ültess. ':'Tipp: kapcsold be a ⭐ Legjobb helyek réteget. ')+'Még '+(N-n)+' fa.':'Mind '+nwA+' fa a helyén — jöhet a kiértékelés.'):(n<N?'Még '+(N-n)+' fa. A fa a járda mellé áll; egy fára koppintva visszaveszed.':'Mind '+nwA+' fa a helyén — jöhet a kiértékelés.')}</div>`;return;}
  if(S.st==='reveal1'){TB.innerHTML='1. kör · <b>'+S.r1+' pont</b>';P.innerHTML=`<span class="eyebrow">1. kör — eredmény</span>
    <h1>Vakon: <em>${S.r1}</em> / ${N*10}</h1>
    <p>Minden fa 0–10 pontot ér: annyit, amennyi hőséget, sérülékeny lakót és gyalogost árnyékol — és annyival kevesebbet, amennyi lombkorona már ott van. A település legjobb helye 10 pont.</p>
    <div class="row"><button class="btn" onclick="showLayers()">Rétegek bekapcsolása</button></div><div class="hint">A számok a fákon: hány pontot ér a hely.</div>`;return;}
  if(S.st==='layers'){P.innerHTML=`<h1>Ugyanaz a város. Más utca.</h1>
    <p>${S.demo?'Betöltöttük az összes réteget — mindjárt kikapcsoljuk őket. A RÉTEGEK sorban bármelyiket visszakapcsolhatod.':'Koppints a rétegekre, és visszakapcsolod őket. A ⭐ Legjobb helyek a metszet: ahol hő, sérülékeny lakó és hiányzó lombkorona találkozik — a gyűrűk a 8 legjobb hely, a legjobb 10 pontot ér.'}</p>
    <div class="row"><button class="btn" onclick="round2()">Újra, adattal</button></div>`;return;}
  if(S.st==='final'){const d=S.r2-S.r1;TB.innerHTML='Vakon <b>'+S.r1+'</b> · adattal <b>'+S.r2+'</b>';
    P.innerHTML=`<span class="eyebrow">A hét lenyomata</span>
    <h1>${d>0?'Ugyanaz '+nwA+' fa. <em>+'+d+' pont</em> árnyék.':d===0?'Ugyanannyi — <em>nálad</em> a megérzés is adat volt.':'Vakon jobb volt — <em>ritka</em>, de előfordul.'}</h1>
    <div class="score"><div class="sc b1"><span>1. kör · vakon</span><b>${S.r1}</b></div><div class="sc b2"><span>2. kör · adattal</span><b>${S.r2}</b></div></div>
    ${GV.endPanel({game:'fak',share:'Hová ültetnél '+N+' fát? Vakon '+S.r1+', adattal '+S.r2+' pont.'})}`;return;}
}
function start(){S.st='place';S.round=1;render();fitArea(true);}
function finishRound(){const sc=evaluate();if(S.round===1){S.r1=sc;S.st='reveal1';}else{S.r2=sc;S.st='final';
  GV.record('fak',{mode:MODE,src:(D&&D.src)||'',n:N,d3:D3,center:[+center[0].toFixed(5),+center[1].toFixed(5)],blind:{score:S.r1,pts:S.blindPts},informed:{score:S.r2,pts:S.trees.map(t=>[t.x,t.y])},
    layers:LC.all(),toggles:S.toggles,known:T.known});}render();fitArea(true);}
/* 1. kör kiértékelve → a fák „szellemként” maradnak, a chip-sor megjelenik, a rétegek egymás után úsznak be */
/* rétegek: előbb mind bekapcsol (a teljes kép), közben a „RÉTEGEK” felirat ragyog, aztán egyszerre mind kikapcsol — ugyanazzal a
   mozdulattal, mint egy koppintás (lenyomás + villanás, a réteg kiúszik), így látszik, hogy a chipek kapcsolók és visszakapcsolhatók.
   Ha a játékos közben koppint, a bemutató megáll. */
const SEQ=['heat','vuln','canopy','ped','best','ghost'];
function showLayers(){S.blindPts=S.trees.map(t=>[t.x,t.y]);S.ghosts=S.trees;S.trees=[];S.ghosts.forEach(t=>t.el.classList.add('ghost'));
  S.st='layers';S.demo=true;render();fitArea(true);
  revealT.forEach(clearTimeout);revealT=[];
  SEQ.forEach((id,i)=>revealT.push(setTimeout(()=>LC.set(id,true),150+i*160)));
  const tOn=150+SEQ.length*160,tOff=tOn+2200;
  revealT.push(setTimeout(()=>LC.glow(true),tOn));
  revealT.push(setTimeout(()=>LC.demoAll(SEQ,false),tOff));
  revealT.push(setTimeout(endDemo,tOff+1600));}
function endDemo(){revealT.forEach(clearTimeout);revealT=[];LC.glow(false);if(!S.demo)return;S.demo=false;if(S.st==='layers')render();
  const row=LC.el.querySelector('.gvl-row');if(row)try{row.scrollTo({left:0,behavior:'smooth'});}catch(e){row.scrollLeft=0;}} /* a chip-sor vissza az elejére */
function dataOn(){return SEQ.some(id=>id!=='ghost'&&LC.get(id));}
function round2(){endDemo();S.round=2;S.st='place';S.last=null;
  if(!dataOn())setTimeout(()=>LC.demo('best',true),700); /* „adattal”: ha minden réteg ki van kapcsolva, a Legjobb helyek bekapcsol */
  else if(LC.get('best'))setTimeout(()=>pingBest(3),950);
  render();fitArea(true);}

</script>
<script>window.addEventListener('pageshow',function(){document.body.style.opacity='';document.body.classList.add('in');});</script>
