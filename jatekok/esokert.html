<title>Esőkert vagy csatorna? — GEOVERN játékok</title>
<meta name="description" content="Villámárvíz után 120 millió forint keret: nagy cső, esőkertek, vízáteresztő burkolat vagy zöldtető? Oszd el, aztán jön a vihar. Lakossági döntésjáték sematikus utcametszeten.">
<meta name="theme-color" content="#050f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23FF9F45' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FF9F45'/%3E%3C/svg%3E">

<style>
:root{--paper:#050f14;--paper2:#0b1a21;--ink:#EAF4F4;--ink2:#9BB7BC;--blue:#2AD1B5;--water:#4AA8FF;--green:#3ddc97;--amber:#FF9F45;--red:#ff6b4a;
  --line:rgba(42,209,181,.25);--font:'Roboto',system-ui,sans-serif;--slab:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  --gv-accent:var(--blue);--gv-accent-ink:#04211d;--gv-line:var(--line)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 600px at 70% 10%,rgba(15,74,87,.5),transparent 60%),linear-gradient(rgba(42,209,181,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(42,209,181,.05) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px}
a{color:var(--blue)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:760px;margin:0 auto}
.home{font:700 12px var(--mono);letter-spacing:.08em;color:var(--blue);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:100px;background:transparent}
.stamp{font:700 11px var(--mono);letter-spacing:.12em;color:var(--amber);border:1.5px solid var(--amber);padding:5px 10px;border-radius:4px;transform:rotate(-2deg)}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
/* széles képernyőn (keretosztás, eredmény): a kép balra, a vezérlők jobbra — a kép nem veszi el a helyet a csúszkáktól */
@media(min-width:900px){
  main.wide{max-width:1180px}
  .cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(380px,1fr);gap:18px;align-items:stretch}
  .cols .colL{display:block}
  .cols .scenewrap{margin-bottom:0}
  .cols .scenewrap.stick{top:12px}
  .cols .sheet{margin-bottom:0}
  .cols .ctl{grid-template-columns:1fr}
  .cols .badges{flex-wrap:wrap;overflow:visible}
}
.sheet{background:rgba(6,17,22,.85);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:18px 18px 16px;margin-bottom:16px;position:relative;backdrop-filter:blur(10px)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.18em;color:var(--blue);text-transform:uppercase;display:block;margin-bottom:6px}
h1{font:900 clamp(24px,6vw,32px)/1.12 var(--slab);margin-bottom:8px}
h2{font:700 20px/1.2 var(--slab);margin-bottom:6px}
p{color:var(--ink2);font-size:15.5px}p+p{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font:700 16px var(--font);cursor:pointer;border:none;
  background:var(--blue);color:#04211d;min-height:50px;touch-action:manipulation;transition:.15s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.4;cursor:default}
.btn-light{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* a probléma pontokban: ikon + egy rövid mondat soronként */
.prob{display:grid;gap:8px;margin:6px 0 10px}
.prob>div{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.4;color:var(--ink)}
.prob .ic{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(42,209,181,.12);display:flex;align-items:center;justify-content:center;font-size:16px}
/* metszet */
/* a metszet: generált háttérkép (img/esokert-metszet.jpg, 1200×1022) + a beavatkozások rajzolt rétege + HTML-feliratok */
.scene{background:linear-gradient(180deg,#0b2430 0%,#10384a 40%,#3a2f24 41%,#2a2119 100%);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1200/807}
.scene .ovl{position:absolute;inset:0;z-index:2}
.scene .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.scene svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.rain{opacity:0;transition:opacity .4s}.scene.storm .rain{opacity:1}
.drop{stroke:#9fd3ff;stroke-width:2.5;stroke-linecap:round;animation:fall .75s linear infinite}
@keyframes fall{0%{transform:translateY(-80px)}100%{transform:translateY(720px)}}
.ov{position:absolute;z-index:3;transform:translate(-50%,-50%);font:600 10.5px var(--mono);letter-spacing:.06em;color:#EAF4F4;background:rgba(6,17,22,.78);border:1px solid rgba(42,209,181,.5);border-radius:100px;padding:3px 8px;white-space:nowrap;pointer-events:none;text-transform:uppercase}
.ov.on{border-color:var(--green);color:var(--green)}.ov.off{opacity:.5}.ov.water{border-color:var(--water);color:#bfe0ff}
.scenewrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b1a21;margin-bottom:12px}
.scenewrap .scene{border:none;border-radius:0}
/* keretosztáskor a kép a képernyő tetején marad, a csúszkák alatta görgethetők — látszik, mit állítasz */
.scenewrap.stick{position:sticky;top:6px;z-index:6;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.colL{display:contents} /* keskeny képernyőn nincs külön oszlop: a kép közvetlenül a main-ben ragad */
.badges{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-height:46px}
.badges::-webkit-scrollbar{display:none}
.badges .t{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;flex:none;margin-right:2px}
.bd{white-space:nowrap;flex:none;display:inline-flex;align-items:center;height:28px;line-height:1;box-sizing:border-box} /* fix magasság: az emoji sem tolja el a sort */
.bd{font:600 12px var(--font);background:rgba(15,74,87,.25);border:1px solid var(--line);border-radius:100px;padding:5px 10px;color:#EAF4F4}
.bd.on{border-color:var(--green)}.bd.m{border-color:var(--amber);color:#ffd9b0}.bd.none{color:var(--ink2);border-style:dashed}
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);z-index:3;font:900 clamp(18px,5vw,34px) var(--font);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9);text-align:center;pointer-events:none;padding:0 12px}
.banner.good{color:#c8ffe9}
.lbl{font:500 17px var(--mono);fill:#9BB7BC;letter-spacing:.02em}
.lbl.b{fill:#2AD1B5}
.dim{opacity:.18}
.plan .hid{visibility:hidden}
@media(max-width:480px){.ov{font-size:9px;padding:2px 6px}.bd{font-size:11px;padding:4px 8px;height:26px}}
/* vezérlők */
.ctl{display:grid;gap:8px;margin-top:8px}
@media(min-width:560px){.ctl{grid-template-columns:1fr 1fr}}
.m{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 12px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(15,74,87,.18)}
.m b{font:700 14px/1.2 var(--font);display:block}
/* alsó sor: balra átfutás / hűsítés, jobbra az „1 liter ára” — a helye mérés nélkül is megvan (? Ft), így a gombnyomásra nem mozdul semmi */
.m .mf{grid-column:1/3;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:24px}
.m .mf small{color:var(--ink2);font-size:11.5px;line-height:1.3}
.m .pl{font:700 18px/1 var(--mono);color:var(--ink);white-space:nowrap;flex:none}
.m .pl i{font:500 11px var(--mono);font-style:normal;color:var(--ink2);margin-left:4px}
.m .pl.best{color:#9af0dc}
.m .pl.lock{color:var(--ink2);opacity:.5}
.m .v{font:500 15px var(--mono);color:var(--blue);min-width:52px;text-align:right}
.m input[type=range]{grid-column:1/3;width:100%;accent-color:var(--blue);height:34px;margin:0;touch-action:pan-y;cursor:pointer}
.m.off>b,.m.off>.v,.m.off>input,.m.off .mf small{opacity:.6}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.hd .eyebrow{margin:0}
.m{user-select:none;-webkit-user-select:none}
.sum{margin-top:0;padding:6px 10px;font-size:13px;white-space:nowrap}
.sum b{font-size:16px}
.sum{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(15,74,87,.25);font:500 14px var(--mono)}
.sum.over b{color:var(--red)}
/* eredmény */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.k{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(15,74,87,.2)}
.k span{display:block;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.k b{display:block;font:500 26px/1.1 var(--mono);margin-top:3px}
.k.bad b{color:var(--red)}.k.good b{color:var(--green)}
.verdict{border-left:4px solid var(--amber);padding:10px 14px;background:rgba(255,159,69,.1);border-radius:0 12px 12px 0;margin-top:12px;font-size:15.5px}
.verdict.good{border-color:var(--green);background:rgba(61,220,151,.1)}
.plan{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b1a21}
.plan svg{display:block;width:100%;height:auto}
.hist{font:500 12.5px var(--mono);color:var(--ink2);margin-top:10px}
/* mérőhálózat: egyirányú döntés (ha telepítetted, marad), −10 M a keretből; csak ezután látszik az elemek mért hatékonysága */
.meas{display:grid;margin-top:12px;padding:12px 14px;border:1.5px dashed var(--blue);border-radius:14px;background:rgba(42,209,181,.08)}
.meas .mst{grid-area:1/1;min-width:0}.meas .mst.hide{visibility:hidden} /* mindkét állapot ugyanabban a cellában: a doboz magassága nem változik */
.meas.on{border-style:solid;border-color:rgba(42,209,181,.6);background:rgba(42,209,181,.1)}
.meas .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meas .mh b{font-size:15px}
.meas .cost{font:700 12.5px var(--mono);color:var(--amber);white-space:nowrap}
.meas small{display:block;color:var(--ink2);font-size:12.5px;margin-top:5px;line-height:1.4}
.btn-sm{padding:9px 16px;font-size:14px;min-height:38px;border-radius:10px}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--ink2)}
</style>
</head>
<body>
<header><a class="home" id="homelink" href="../jatekok.html">← JÁTÉKOK</a><span class="stamp">TERV-01 · <span data-town>MINTAUTCA</span></span></header>
<main id="main"></main>
<footer><a href="../impresszum.html#jatek-forrasok">Források és adatok a játékokhoz →</a></footer>
<script>
/* =====================================================================
   ESŐKERT VAGY CSATORNA? — keretosztás csúszkákkal, utcametszet, vihar
   Modell: 3 600 m³ lefolyás, a meglévő csatorna 2 000 m³-t visz → 1 600 m³ többlet.
   ===================================================================== */
document.getElementById('homelink').href=GV.hubUrl();
const BUDGET=120, MEAS=10;
const M=[
 {k:'cso',ic:'🚰',short:'Nagyobb cső',n:'Csatornabővítés — nagyobb cső',s0:'18 hónap · nem hűsít · a lakók fele ezt kéri',per:150,lead:18,cool:0},
 {k:'eso',ic:'🌱',short:'Esőkertek',n:'Esőkertek az utcában',s0:'6 hónap · hűsít · 60 M felett nincs több hely',per:200,per2:60,cap:60,lead:6,cool:1,meas:true},
 {k:'burk',ic:'🧱',short:'Áteresztő burkolat',n:'Vízáteresztő burkolat a parkolókon',s0:'8 hónap · kicsit hűsít',per:110,lead:8,cool:.5,meas:true},
 {k:'teto',ic:'🏢',short:'Zöldtető + ciszterna',n:'Zöldtető + ciszterna a középületeken',s0:'10 hónap · hűsít',per:90,lead:10,cool:1}
];
const MF=1.3; /* mérés után az esőkert és a burkolat a mélypontokra kerül: +30 % */
/* mért ár: mennyibe kerül 1 liter visszatartott esővíz (Ft / liter) — csak telepített mérőhálózattal látszik, a csúszkák alatt.
   per = m³ / 10 M Ft → Ft / liter = 10 000 000 Ft / (per × 1 000 l) = 10 000 / per */
const ftL=m=>Math.round(10000/(m.per*(m.meas?MF:1)));
const BEST_K=M.slice().sort((x,y)=>ftL(x)-ftL(y))[0].k;
/* a mérés egyirányú: ha telepítetted, marad (a 10 M elköltve); ha így túllépné a keretet, a legnagyobb tételből veszünk le */
function measure(){if(S.meas)return;S.meas=true;let over=total(S.a)-BUDGET;
  if(over>0)['cso','eso','burk','teto'].sort((x,y)=>S.a[y]-S.a[x]).forEach(k=>{if(over<=0)return;const d=Math.min(S.a[k],over);S.a[k]-=d;over-=d;});
  render();}
let S={st:'intro',a:{cso:0,eso:0,burk:0,teto:0},meas:false,tries:[]};
const main=document.getElementById('main');
const townTxt=GV.TOWN.name?GV.esc(GV.TOWN.name):'a település';

function capacity(a,meas){const f=meas?MF:1;let c=0,cool=0,lead=0;
  c+=a.cso/10*M[0].per; if(a.cso)lead=Math.max(lead,M[0].lead);
  const e1=Math.min(a.eso,M[1].cap),e2=Math.max(0,a.eso-M[1].cap);c+=(e1/10*M[1].per+e2/10*M[1].per2)*f;cool+=a.eso/10*M[1].cool;if(a.eso)lead=Math.max(lead,M[1].lead);
  c+=a.burk/10*M[2].per*f;cool+=a.burk/10*M[2].cool;if(a.burk)lead=Math.max(lead,M[2].lead);
  c+=a.teto/10*M[3].per;cool+=a.teto/10*M[3].cool;if(a.teto)lead=Math.max(lead,M[3].lead);
  return{cap:Math.round(c),cool:Math.min(5,Math.round(cool)),lead};}
const built=a=>a.cso+a.eso+a.burk+a.teto; /* a vihar csak akkor jöhet, ha épül is valami (a mérés magában nem tart vissza vizet) */
const total=a=>built(a)+(S.meas?MEAS:0);

/* A kép 1200×807 (az ég levágva). Az overlay (svg + feliratok) és az összefoglaló sor külön frissül, hogy a csúszka húzása közben ne épüljön újra a DOM. */
function sceneOverlay(storm,res){
  const a=S.a;const gardens=Math.min(5,Math.round(a.eso/15));const perm=a.burk>0;const roof=a.teto>0;const pipeW=a.cso?30+a.cso/10*4.2:0;
  const level=res?Math.min(60,res.surplus/1600*60):0;   /* víz a felszínen, kép-egység */
  const bLevel=res?Math.min(120,res.surplus/1600*120):0; /* víz a pincében */
  let drops='';if(storm)for(let i=0;i<46;i++){const x=Math.round((i*131)%1200),d=(i*37%75)/100;drops+=`<line class="drop" x1="${x}" y1="-60" x2="${x-8}" y2="-30" style="animation-delay:-${d}s"/>`;}
  /* új esőkertek a burkolt felületeken (a kép ágyása az első) */
  const GPOS=[[300,440],[385,440],[790,427],[870,427],[1085,419]];
  let g='';for(let i=0;i<gardens;i++){const [x,y]=GPOS[i];g+=`<ellipse cx="${x}" cy="${y}" rx="40" ry="15" fill="#2f5d36" stroke="#8bd49a" stroke-width="2" opacity=".95"/>
    <path d="M${x-22} ${y-2} l5-16 l5 16 M${x-6} ${y-4} l5-20 l5 20 M${x+12} ${y-2} l5-15 l5 15" stroke="#7fd68d" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="${x-9}" cy="${y-20}" r="4" fill="#e39bd3"/><circle cx="${x+15}" cy="${y-16}" r="4" fill="#9db9ff"/>`;}
  return `<svg viewBox="0 0 1200 807" aria-hidden="true">
   <defs><pattern id="perm" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 12 H24 M12 0 V24" stroke="#9ff0c4" stroke-width="1.2" opacity=".55"/></pattern></defs>
   <g class="rain">${drops}</g>
   ${level?`<rect x="250" y="${475-level}" width="760" height="${level}" fill="#4AA8FF" opacity=".5"/>`:''}
   ${bLevel?`<rect x="50" y="${620-bLevel}" width="195" height="${bLevel}" fill="#4AA8FF" opacity=".72"/>`:''}
   ${perm?`<polygon points="760,385 990,385 1010,473 740,473" fill="#3ddc97" opacity=".22"/><polygon points="760,385 990,385 1010,473 740,473" fill="url(#perm)"/>`:''}
   ${g}
   ${roof?`<rect x="978" y="169" width="204" height="18" rx="5" fill="#3A7D44" stroke="#8bd49a" stroke-width="2"/><path d="M990 169 l4-9 l4 9 M1010 169 l4-11 l4 11 M1032 169 l4-9 l4 9 M1054 169 l4-11 l4 11 M1076 169 l4-9 l4 9 M1098 169 l4-11 l4 11 M1120 169 l4-9 l4 9 M1142 169 l4-11 l4 11 M1164 169 l4-9 l4 9" stroke="#8bd49a" stroke-width="2.5" fill="none"/>
     <line x1="1170" y1="187" x2="1170" y2="475" stroke="#b9c7cc" stroke-width="6" opacity=".9"/><path d="M1170 475 V 520 H1135" stroke="#b9c7cc" stroke-width="6" fill="none"/>
     <rect x="1040" y="497" width="95" height="66" rx="10" fill="#1b4a66" stroke="#2AD1B5" stroke-width="3"/><rect x="1046" y="${563-40*(storm?1:.45)}" width="83" height="${40*(storm?1:.45)}" rx="6" fill="#4AA8FF" opacity=".75"/>`:''}
   ${pipeW?`<line x1="256" y1="590" x2="915" y2="590" stroke="#aebfc6" stroke-width="${pipeW}" stroke-linecap="round" opacity=".88"/><line x1="256" y1="590" x2="915" y2="590" stroke="#4AA8FF" stroke-width="${Math.max(4,pipeW-14)}" stroke-linecap="round" opacity=".55"/>`:''}
  </svg>
   <span class="ov" style="left:12%;top:69%">Pince</span>
   <span class="ov ${gardens?'on':'off'}" style="left:40%;top:53%">${gardens?'Esőkert ×'+(gardens+1):'Zöldsáv'}</span>
   <span class="ov ${perm?'on':'off'}" style="left:73%;top:62%">${perm?'Áteresztő burkolat':'Parkoló'}</span>
   <span class="ov ${roof?'on':'off'}" style="left:90%;top:16%">${roof?'Zöldtető':'Középület'}</span>
   ${roof?`<span class="ov on" style="left:90.5%;top:75%">Ciszterna</span>`:''}
   <span class="ov water" style="left:49%;top:80%">Csatorna · ${2000+a.cso/10*150} m³</span>
   ${res?`<div class="banner ${res.surplus>0?'':'good'}">${res.surplus>0?res.surplus+' m³ a felszínen':'Száraz utca, száraz pincék'}</div>`:''}`;
}
function sceneBadges(res){
  const a=S.a;const gardens=Math.min(5,Math.round(a.eso/15));const perm=a.burk>0;const roof=a.teto>0;const badges=[];
  const num=S.meas||res; /* a m³-számok csak méréssel (vagy a vihar után) látszanak */
  if(a.cso)badges.push(`<span class="bd on">🚰 Nagyobb cső${num?' · +'+a.cso/10*M[0].per+' m³':' · '+a.cso+' M'}</span>`);
  if(a.eso)badges.push(`<span class="bd on">🌱 ${gardens+1} esőkert${num?' · +'+Math.round((Math.min(a.eso,M[1].cap)/10*M[1].per+Math.max(0,a.eso-M[1].cap)/10*M[1].per2)*(S.meas?MF:1))+' m³':' · '+a.eso+' M'}</span>`);
  if(perm)badges.push(`<span class="bd on">🧱 Áteresztő parkoló${num?' · +'+Math.round(a.burk/10*M[2].per*(S.meas?MF:1))+' m³':' · '+a.burk+' M'}</span>`);
  if(roof)badges.push(`<span class="bd on">🏢 Zöldtető + ciszterna${num?' · +'+a.teto/10*M[3].per+' m³':' · '+a.teto+' M'}</span>`);
  if(S.meas)badges.push(`<span class="bd m">📡 Mérőhálózat (−${MEAS} M) · a zöld oda kerül, ahová a víz</span>`);
  if(!badges.length)badges.push(`<span class="bd none">Még nincs beavatkozás — oszd el a keretet</span>`);
  return `<span class="t">${res?'Ez volt a terv':'A terved a képen'}</span>${badges.join('')}`;
}
function scene(storm,res,stick){
  return `<div class="scenewrap${stick?' stick':''}"><div class="scene ${storm?'storm':''}" id="scene"><img class="bgimg" src="img/esokert-metszet.jpg?v=${GV.VER}" alt="Utcametszet: lakóház pincével, esőkert, parkoló, középület, a föld alatt a csatorna">
   <div class="ovl" id="ovl">${sceneOverlay(storm,res)}</div></div><div class="badges" id="badges">${sceneBadges(res)}</div></div>`;
}
function plan(){ /* felülnézeti vázlat: hol gyűlik a víz — csak méréssel látszik */
  const on=S.meas;return `<div class="plan"><svg viewBox="0 0 800 220">
   <rect width="800" height="220" fill="#0b1a21"/>
   <g stroke="#2AD1B5" stroke-width="1.2" fill="none" opacity=".8"><rect x="40" y="34" width="720" height="156"/><line x1="40" y1="110" x2="760" y2="110"/><line x1="280" y1="30" x2="280" y2="190"/><line x1="520" y1="30" x2="520" y2="190"/></g>
   <g class="${on?'':'hid'}"><path d="M60 50 C 200 90, 300 130, 430 150 S 650 170, 740 182" stroke="#4AA8FF" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/>
   <ellipse cx="430" cy="152" rx="70" ry="22" fill="#4AA8FF" opacity=".35"/><ellipse cx="700" cy="178" rx="48" ry="16" fill="#4AA8FF" opacity=".35"/>
   <text x="430" y="158" text-anchor="middle" class="lbl b">MÉLYPONT · ITT GYŰLIK</text><text x="700" y="184" text-anchor="middle" class="lbl b">MÉLYPONT</text></g>
   <text x="60" y="22" class="lbl">${on?'MÉRŐHÁLÓZAT (10 M): 4 ESŐMÉRŐ + 6 VÍZSZINT-SZONDA':'HOVÁ FOLYIK A VÍZ?'}</text>
   ${on?'':'<text x="400" y="118" text-anchor="middle" class="lbl">🔒 MÉRÉS NÉLKÜL NEM LÁTSZIK</text>'}
   <text x="60" y="210" class="lbl">${on?'ESŐKERT A MÉLYPONTOKRA → +30% VISSZATARTÁS':'A ZÖLD ODA KERÜL, AHOL HELY VAN — NEM AHOVÁ A VÍZ MEGY'}</text>
  </svg></div>`;}

function render(){
  if(S.st==='intro'){main.className='';main.innerHTML=`<div class="sheet"><span class="eyebrow">Lakossági döntésjáték · 2–3 perc</span>
   <h1>Esőkert vagy csatorna?</h1>
   <div class="prob"><div><span class="ic">🌧️</span><span>Villámárvíz után ${BUDGET} millió forint jut csapadékvíz-kezelésre.</span></div><div><span class="ic">🗣️</span><span>A lakók fele nagyobb csövet akar, a másik fele zöldet.</span></div><div><span class="ic">⛈️</span><span>Oszd el a keretet — a következő vihar megmutatja, mit ér.</span></div></div>
   <div class="row"><button class="btn" onclick="go('alloc')">Oszd el a 120 milliót</button></div></div>
   ${scene(false,null)}`;return;}
  if(S.st==='alloc'){const t=total(S.a);const over=t>BUDGET;
   main.className='wide';main.innerHTML=`<div class="cols"><div class="colL">${scene(false,null,true)}</div>
   <div class="sheet"><div class="hd"><span class="eyebrow">Keretosztás</span><div class="sum ${over?'over':''}" id="sum"><span>Elköltve</span><b>${t} / ${BUDGET} M</b></div></div><h2>Mire menjen a pénz?</h2>
   <div class="ctl">${M.map(m=>`<label class="m ${S.a[m.k]?'':'off'}" id="m-${m.k}"><b>${m.n}</b><span class="v">${S.a[m.k]} M</span>
     <input type="range" min="0" max="${BUDGET}" step="10" value="${S.a[m.k]}" aria-label="${m.n}" oninput="setA('${m.k}',this)">
     <span class="mf"><small>${m.s0}</small><span class="pl${S.meas?(m.k===BEST_K?' best':''):' lock'}" title="${S.meas?'Mért ár: 1 liter visszatartott esővíz':'Mérés nélkül nem látszik'}">${S.meas?ftL(m):'?'} Ft<i>/ liter</i></span></span></label>`).join('')}</div>
   <div class="meas ${S.meas?'on':''}">
     <div class="mst${S.meas?' hide':''}"><div class="mh"><b>📡 Mérőhálózat előbb — ${MEAS} M Ft</b><button class="btn btn-sm" onclick="measure()" ${S.meas?'disabled tabindex="-1"':''}>Telepítem</button></div><small>Esőmérők és vízszint-szondák: megmutatják, hová folyik a víz, és mennyibe kerül egy-egy elemmel 1 liter visszatartott víz. Mérés nélkül ez csak a vihar után derül ki.</small></div>
     <div class="mst${S.meas?'':' hide'}"><div class="mh"><b>📡 Mérőhálózat telepítve</b><span class="cost">−${MEAS} M a keretből · ${BUDGET-MEAS} M marad</span></div><small>4 esőmérő + 6 vízszint-szonda. Az esőkert és a burkolat a mélypontokra kerül (+30 %); a csúszkák alatt látszik, mennyibe kerül 1 liter visszatartott víz.</small></div></div>
   ${plan()}
   <div class="row"><button class="btn" id="stormbtn" onclick="storm()" ${built(S.a)===0||over?'disabled':''}>Jön a vihar ⛈</button></div>
   ${S.tries.length?`<div class="hist">Eddigi próbák: ${S.tries.map(x=>x.surplus>0?x.surplus+' m³ felszínen':'száraz').join(' · ')}</div>`:''}
   </div></div>`;return;}
  if(S.st==='result'){const r=S.res;const good=r.surplus===0;
   main.className='wide';main.innerHTML=`<div class="cols"><div class="colL">${scene(true,r,true)}</div>
   <div class="sheet"><span class="eyebrow">A vihar után</span>
   <h2>${good?'Száraz pincék.':r.basements+' pince ázott el.'}</h2>
   <div class="kpis"><div class="k ${good?'good':'bad'}"><span>Víz a felszínen</span><b>${r.surplus} m³</b></div><div class="k"><span>Visszatartva / elvezetve</span><b>+${r.cap} m³</b></div>
   <div class="k"><span>1 liter ára</span><b>${r.cap?r.cost+' Ft':'—'}</b></div><div class="k"><span>Elkészül</span><b>${r.cap?r.lead+' hó':'—'}</b></div></div>
   <p>Hűsítő hatás az utcán: ${'●'.repeat(r.cool)}${'○'.repeat(5-r.cool)} · Mérés: ${S.meas?'volt — az esőkertek a mélypontokra kerültek':'nem volt — a zöld oda került, ahol hely volt'}</p>
   <div class="verdict ${good&&r.cool>=2?'good':''}">${r.verdict}</div>
   <div class="row"><button class="btn btn-light" onclick="go('alloc')">Újratervezem</button><button class="btn" onclick="finish()">Ennyi, lezárom</button></div></div></div>`;return;}
  if(S.st==='final'){main.className='';const best=S.tries.reduce((a,b)=>b.surplus<a.surplus||(b.surplus===a.surplus&&b.cool>a.cool)?b:a,S.tries[0]);
   main.innerHTML=`<div class="sheet"><span class="eyebrow">A hét lenyomata</span>
   <h1>${best.surplus===0?'Megtaláltad a receptet.':'A víz megtalálta a rést.'}</h1>
   <p>${S.tries.length} próba · legjobb: ${best.surplus===0?'száraz utca':best.surplus+' m³ a felszínen'}${best.cap?', '+best.cost+' Ft / liter, kész '+best.lead+' hónap alatt':''}${best.meas?', méréssel':''}.</p>
   <div class="verdict good">A nagy cső a tünetet kezeli, és két nyárba kerül. A sok kicsi gyorsabb és hűsít is — de csak akkor ér annyit, ha oda kerül, ahová a víz folyik. Ezért kell előbb mérni, aztán építeni.</div>
   ${GV.endPanel({game:'esokert',share:'Esőkert vagy csatorna? Az én receptem: '+(best.surplus===0?'száraz utca':best.surplus+' m³ a felszínen')+'.'})}</div>`;return;}
}
/* csúszka: nem építjük újra a DOM-ot (az megszakítaná a húzást), csak a számot, a képet és az összeget frissítjük */
function setA(k,el){let v=+el.value;const others=total(S.a)-S.a[k];if(others+v>BUDGET)v=Math.max(0,BUDGET-others);v=Math.round(v/10)*10;S.a[k]=v;if(+el.value!==v)el.value=v;refreshAlloc();}
function refreshAlloc(){const t=total(S.a),over=t>BUDGET;
  M.forEach(m=>{const el=document.getElementById('m-'+m.k);if(!el)return;el.classList.toggle('off',!S.a[m.k]);el.querySelector('.v').textContent=S.a[m.k]+' M';});
  const o=document.getElementById('ovl');if(o)o.innerHTML=sceneOverlay(false,null);const b=document.getElementById('badges');if(b)b.innerHTML=sceneBadges(null);
  const sum=document.getElementById('sum');if(sum){sum.classList.toggle('over',over);sum.querySelector('b').textContent=t+' / '+BUDGET+' M';}
  const btn=document.getElementById('stormbtn');if(btn)btn.disabled=(built(S.a)===0||over);}
function go(st){S.st=st;render();window.scrollTo({top:0,behavior:'smooth'});}
function storm(){const c=capacity(S.a,S.meas);const surplus=Math.max(0,1600-c.cap);const spent=total(S.a);
  const r={surplus,cap:c.cap,cool:c.cool,lead:c.lead,basements:Math.round(surplus/40),cost:c.cap?Math.round(spent*1000/c.cap):0,meas:S.meas,alloc:Object.assign({},S.a)};
  const a=S.a;const sewerShare=a.cso/Math.max(1,spent-(S.meas?MEAS:0));
  if(surplus===0&&sewerShare>=.8)r.verdict='Száraz pincék — 18 hónap múlva. Addig két nyár, két vihar. És az utca ugyanolyan forró marad, mint eddig: a cső nem hűsít.';
  else if(surplus===0&&c.cool>=2)r.verdict='Száraz pincék, hűsebb utca'+(c.lead<=10?', fél-egy év alatt.':' — de a csőrész miatt másfél év, mire minden kész.')+' Ez a gdański recept: '+(S.meas?'előbb mérés, aztán sok kicsi — és a cső csak akkora, amekkora kell.':'sok kicsi beavatkozás. Méréssel még 30%-kal olcsóbb lett volna.');
  else if(surplus===0)r.verdict='Száraz pincék. Jó mix — de hűsítés alig: a zöld elemekből kevés jutott.';
  else if(a.eso>=80)r.verdict='Esőkertek majdnem mindenre: a 60 milliós határ után alig tartanak többet, mert nincs hová tenni őket. '+surplus+' m³ maradt a felszínen.'+(S.meas?'':' Méréssel ugyanez a pénz 30%-kal többet ért volna.');
  else if(!S.meas&&(a.eso+a.burk)>=40)r.verdict='A zöld elemek vakon kerültek ki: ahol hely volt, nem ahová a víz megy. A '+MEAS+' milliós mérőhálózat '+Math.round(capacity(S.a,true).cap-c.cap)+' m³-rel többet hozott volna — majdnem ugyanennyi pénzből.';
  else r.verdict='Kevés a kapacitás: '+surplus+' m³ a felszínen. Nézd meg, melyik tétel ad a legtöbbet egy forintért — és hogy méréssel hová kerülne.';
  S.res=r;S.tries.push(r);GV.record('esokert',{try:S.tries.length,alloc:r.alloc,meas:S.meas,surplus,cap:c.cap,cool:c.cool,lead:c.lead});S.st='result';render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(){S.st='final';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
<script>window.addEventListener('pageshow',function(){document.body.style.opacity='';document.body.classList.add('in');});</script>
</body>
</html>
