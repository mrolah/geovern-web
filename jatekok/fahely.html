<style>
:root{--bg:#050f14;--teal:#2AD1B5;--amber:#FF9F45;--red:#ff6b4a;--text:#EAF4F4;--muted:#9BB7BC;--faint:#5E7A80;
  --card:rgba(6,17,22,.92);--line:rgba(42,209,181,.25);--font:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  --gv-accent:var(--teal);--gv-accent-ink:#04211d;--gv-line:var(--line);--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
#map{position:fixed;inset:0;z-index:0}
.homelink{position:fixed;top:calc(10px + var(--sat));left:10px;z-index:40;font:700 12px var(--mono);letter-spacing:.06em;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(10px);text-decoration:none}
.topbar{position:fixed;top:calc(10px + var(--sat));right:10px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(12px);font:500 13px var(--mono);color:var(--muted);max-width:calc(100vw - 132px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar b{color:var(--amber);font-weight:500}
.fitbtn{position:fixed;top:calc(54px + var(--sat));right:10px;z-index:40;font:500 12px var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--line);
  border-radius:100px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(10px);touch-action:manipulation}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:540px;padding:0 12px calc(12px + var(--sab))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px 16px;backdrop-filter:blur(16px);
  box-shadow:0 -10px 50px rgba(0,0,0,.55);max-height:58vh;overflow:auto}
h1{font-size:23px;font-weight:900;line-height:1.16;margin-bottom:6px}
h1 em{font-style:normal;color:var(--teal)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;color:var(--teal);text-transform:uppercase;margin-bottom:8px;display:block}
.eyebrow i{font-style:normal;color:var(--faint)}
p{color:var(--muted);font-size:15px}p+p{margin-top:8px}
p b{color:var(--text);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;
  border:none;transition:.2s;font-family:var(--font);background:var(--teal);color:#04211d;min-height:50px;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;cursor:default}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.row .btn{flex:1}
.cnt{display:flex;gap:6px;margin:12px 0 2px}.cnt i{flex:1;height:8px;border-radius:4px;background:rgba(143,176,181,.25)}.cnt i.on{background:var(--teal)}
.hint{font:500 12.5px var(--mono);color:var(--faint);margin-top:10px;min-height:17px;line-height:1.5}
.hint b{color:var(--teal)}.hint .bad{color:var(--red)}.hint .warn{color:var(--amber)}
.prob{display:grid;gap:8px;margin:4px 0 2px}
.prob>div{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text);line-height:1.4}
.prob .n{flex:none;width:24px;height:24px;border-radius:8px;background:rgba(42,209,181,.12);display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);color:var(--teal)}
.guess{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.guess button{font:700 16px var(--mono);padding:13px 0;border-radius:12px;border:1.5px solid var(--line);background:rgba(15,74,87,.25);color:var(--text);cursor:pointer;touch-action:manipulation;min-height:50px}
.guess button:active{background:var(--teal);color:#04211d}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sc{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(15,74,87,.2)}
.sc span{display:block;font:500 11px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.sc b{display:block;font:500 32px var(--mono);line-height:1.1;margin-top:4px}
.sc.b1 b{color:var(--amber)}.sc.b2 b{color:var(--teal)}
.src{font:500 11px var(--mono);color:var(--faint);margin-top:10px;line-height:1.5}
/* a tölcsér sávja: a szabad terület aránya lépcsőnként */
.fun{display:grid;gap:5px;margin:12px 0 4px}

.fun i{display:block;height:10px;border-radius:5px;background:rgba(143,176,181,.16);overflow:hidden}
.fun i u{display:block;height:100%;border-radius:5px;background:var(--teal)}
.fun b{color:var(--text);font-weight:500;text-align:right}
.fun .cur{color:var(--text)}.fun .cur u{background:var(--amber)}
/* a játékos fáinak sorsa */
.fate{display:grid;gap:5px;margin-top:10px}

.fate b{color:var(--text);font-weight:500}
/* vizsgálólap: keresztmetszet + okok */
.insp{border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;margin:10px 0 2px;background:rgba(15,74,87,.16)}
.insp h3{font:700 13.5px var(--font);margin-bottom:2px}.insp h3.x{color:var(--red)}.insp h3.ok{color:var(--teal)}.insp h3.lim{color:var(--amber)}
.insp svg{display:block;width:100%;height:auto;margin:4px 0 2px}
.insp ul{list-style:none;display:grid;gap:3px;margin-top:4px}
.insp li{font-size:13px;color:var(--muted);line-height:1.35}
.insp li b{color:var(--text);font-weight:500}.insp li.x::before{content:'✕ ';color:var(--red);font-weight:700}.insp li.l::before{content:'! ';color:var(--amber);font-weight:700}.insp li.o::before{content:'✓ ';color:var(--teal);font-weight:700}
.insp .fn{font:500 10.5px var(--mono);color:var(--faint);margin-top:6px}
details.cat{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.cat summary{cursor:pointer;font:500 12.5px var(--mono);color:var(--teal);list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:' ›'}details.cat[open] summary::after{content:' ⌄'}
.cat h4{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
.cat p{font-size:13px;line-height:1.5}
.poll{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.poll button{font:500 13.5px var(--font);padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer;touch-action:manipulation}
.poll button.on{background:var(--teal);color:#04211d;border-color:var(--teal)}
/* fa-jelölők (a külső elemet a MapLibre pozicionálja, azon nincs saját transform) */
.mk{width:30px;height:30px;cursor:pointer}
.tree{width:30px;height:30px;border-radius:50%;background:rgba(6,17,22,.88);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;
  font:700 12px var(--mono);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.tree.x{border-color:var(--red);color:var(--red);background:rgba(40,8,4,.9)}
.tree.lim{border-color:var(--amber);color:var(--amber)}
.tree.ok{border-color:var(--teal);color:var(--teal)}
.mk.ghost{pointer-events:none}.mk.ghost .tree{opacity:.5;animation:none;width:24px;height:24px;margin:3px;font-size:10px}
.mk.probe .tree{border-style:dashed;animation:none}
.maplibregl-ctrl-attrib{font-size:10px!important}
.err{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
body.maperr .err{display:flex}
.err div{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:900px){.sheet{left:18px;transform:none;max-width:430px;bottom:6px}.panel{max-height:78vh}}
@media(prefers-reduced-motion:reduce){.tree{animation:none}}
</style>

<div class="sheet"><div id="layers" style="display:none"></div><div class="panel" id="panel"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
   HOL FÉR EL EGY FA? — egy valós utca (Diósd, Kossuth Lajos utca), valós adatokon.
   Két kör, mint a testvérjátékban: előbb adat nélkül ültetsz, aztán négy lépcsőben megnézzük, mit enged az utca
   (közlekedés → telek és felszín → föld fölött → föld alatt), végül ugyanezt adattal.
   Adatok (data/fahely-diosd-kossuth.json, előre kiszámolva):
     · utca, behajtók, kerítések, járdák, parkolók, oszlopok, légvezeték, fák: OpenStreetMap
     · közművek: az e-közmű lakossági térképe alapján, egyszerűsítve — tájékoztató jellegű
   A szabályértékek jellemző értékek (a rules táblában, forrással); a számítás a fahely-engine.js-ben van,
   ugyanaz a kód számolta az adatcsomag számait, mint ami itt a koppintásokat vizsgálja.
   ===================================================================== */
const N = 5;                                   /* fák száma körönként */
const P = document.getElementById('panel'), TB = document.getElementById('tb-round');
document.getElementById('homelink').href = GV.hubUrl();
document.getElementById('err-next').href = GV.hubUrl();
const esc = GV.esc;
const hu = (v, d = 1) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace('.', ',');   /* tizedesvessző */
const nf = v => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

let D = null, M = null, G = null, EN = null, AX = null;      /* adatcsomag, meta, motor-bemenet, előkészített motor, tengely */
let map = null, mapReady = false, layersAdded = false, LC = null;
let S = { st: 'loading', guess: null, stage: 0, trees: [], ghosts: [], r1: null, tries: 0, toggles: {}, t0: Date.now(), last: null, probe: null, poll: null };

/* ---------- koordináták: helyi méter ↔ földrajzi ---------- */
const LL = (x, y) => [M.lon0 + M.inv[0] * x + M.inv[1] * y, M.lat0 + M.inv[2] * x + M.inv[3] * y];
const XY = (lon, lat) => { const a = lon - M.lon0, b = lat - M.lat0; return [M.fwd[0] * a + M.fwd[1] * b, M.fwd[2] * a + M.fwd[3] * b]; };
const LLst = (s, t) => { const p = AX.xy(s, t); return LL(p[0], p[1]); };
const unflat = a => { const o = []; for (let i = 0; i < a.length; i += 2) o.push([a[i] / 10, a[i + 1] / 10]); return o; };
const FC = f => ({ type: 'FeatureCollection', features: f });
const lineFC = (arr, props) => FC(arr.map(l => ({ type: 'Feature', properties: props || {}, geometry: { type: 'LineString', coordinates: l.map(p => LL(p[0], p[1])) } })));
const polyFC = (arr, props) => FC(arr.map(l => ({ type: 'Feature', properties: props || {}, geometry: { type: 'Polygon', coordinates: [l.map(p => LL(p[0], p[1]))] } })));
const ptFC = (arr, fn) => FC(arr.map((p, i) => ({ type: 'Feature', properties: fn ? fn(p, i) : {}, geometry: { type: 'Point', coordinates: LL(p[0], p[1]) } })));
/* méterhű vonalvastagság / körsugár: képpont = méter · 2^z · 512 / (40 075 017 · cos φ) */
let PXM14 = 0.3093;
const mw = m => ['interpolate', ['exponential', 2], ['zoom'], 14, m * PXM14, 22, m * PXM14 * 256];

/* ---------- szabályok szövege ---------- */
const STAGE_TXT = {
  1: { name: 'Közlekedés', src: 'adat: OpenStreetMap', chip: 's1' },
  2: { name: 'Telek és felszín', src: 'adat: OpenStreetMap', chip: 's2' },
  3: { name: 'Föld fölött', src: 'adat: OpenStreetMap', chip: 's3' },
  4: { name: 'Föld alatt', src: 'adat: e-közmű lakossági térkép', chip: 's4' } };
const CROWN = ['', 'kis', 'közepes', 'nagy'], CROWN_M2 = [0, 12, 38, 113];
const rule = id => EN.rules[id];
function failText(c) { const r = rule(c.id); return '<b>' + esc(r.n) + '</b> ' + hu(Math.max(0, c.d)) + ' m — kell ' + hu(c.need) + ' m'; }
function limText(c) { const r = rule(c.id);
  if (c.id === 'tel') return '<b>' + esc(r.n) + '</b> ' + hu(Math.max(0, c.d)) + ' m-re: csak védelemmel, kézi földmunkával';
  return '<b>' + esc(r.n) + '</b> ' + hu(Math.max(0, c.d)) + ' m-re: legfeljebb ' + CROWN[c.cap] + ' koronájú fa'; }

/* ---------- indulás: adat → motor → térkép ---------- */
render();
fetch('data/fahely-diosd-kossuth.json?v=15').then(r => { if (!r.ok) throw new Error('adat'); return r.json(); }).then(init).catch(() => document.body.classList.add('maperr'));

function init(data) {
  D = data; M = D.meta;
  PXM14 = 16384 * 512 / (40075016.686 * Math.cos(M.lat0 * Math.PI / 180));
  const f = {}; Object.keys(D.f).forEach(k => f[k] = D.f[k].map(unflat));
  ['pole', 'lamp', 'tree', 'manhole', 'junc'].forEach(k => f[k] = D.pt[k].map(p => [p[0] / 10, p[1] / 10, p[2] || 0]));
  G = { meta: { half: M.half, driveHalf: M.driveHalf, walkHalf: M.walkHalf, limStep: M.limStep }, axis: unflat(D.axis), rules: D.rules, f, lim: { L: D.lim.L.map(v => v / 10), R: D.lim.R.map(v => v / 10) } };
  EN = FH.prepare(G); AX = EN.axis;
  /* a 4. lépcső utáni szabad rácspontok — a 2. körben a koppintás ehhez igazodik (ujjnyi pontatlanságon belül) */
  S.freePts = []; ['L', 'R'].forEach(side => { const F = D.free[side], r = F.runs[4]; for (let i = 0; i < r.length; i += 4) for (let is = r[i + 1]; is <= r[i + 2]; is++) { const p = AX.xy(M.s0 + is * M.step, F.sign * (F.tMin + r[i] * M.step)); S.freePts.push([p[0], p[1], r[i + 3]]); } });
  S.st = 'intro'; render(); initMap();
}

const BLANK = { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#050f14' } }] };
let blankTried = false;
function initMap() {
  const opts = { container: 'map', theme: 'dark', center: [M.lon0, M.lat0], zoom: 17, bearing: M.az - 90, pitch: 0, minZoom: 15, maxZoom: 21, dragRotate: false, pitchWithRotate: false, touchPitch: false };
  const ready = m => { map = m; mapReady = true; try { m.touchZoomRotate.disableRotation(); } catch (e) {} addLayers(); applyStage(); fitStreet(false); m.on('click', onTap); document.getElementById('fitbtn').style.display = ''; };
  /* ha az alaptérkép nem jön, üres stílussal megyünk tovább: a játék minden rétege a saját adatcsomagból rajzolódik */
  const fail = () => { if (mapReady || blankTried) return; blankTried = true; try { map && map.remove(); } catch (e) {}
    try { const m = new maplibregl.Map(Object.assign({}, opts, { style: BLANK, attributionControl: false })); m.on('load', () => ready(m)); } catch (e) { document.body.classList.add('maperr'); } };
  try { map = GVMAP.createMap(opts, ready, fail); } catch (e) { fail(); }
}

/* ---------- a térkép saját rétegei (mind fh- előtaggal) ---------- */
const VIS = {};      /* chip-azonosító → [réteg-azonosítók] */
function addLayers() {
  if (layersAdded || !mapReady) return; layersAdded = true;
  const f = G.f, src = (id, data) => map.addSource(id, { type: 'geojson', data, buffer: 256, tolerance: 0.1 });
  const lay = (id, type, source, paint, layout, grp) => { map.addLayer({ id, type, source, paint, layout: Object.assign({ visibility: grp ? 'none' : 'visible' }, layout || {}) }); if (grp) (VIS[grp] = VIS[grp] || []).push(id); };
  const round = { 'line-cap': 'round', 'line-join': 'round' };
  /* a közterületi sáv (szőnyeg) és az utca saját rajza */
  const strip = []; ['L', 'R'].forEach(side => { const sg = side === 'L' ? 1 : -1, a = [], b = []; const lim = G.lim[side];
    for (let i = 0; i < lim.length; i++) { const s = Math.min(i * M.limStep, AX.L); a.push(AX.xy(s, sg * M.half)); b.push(AX.xy(s, sg * lim[i])); }
    strip.push(a.concat(b.reverse(), [a[0]])); });
  src('fh-strip', polyFC(strip)); lay('fh-strip', 'fill', 'fh-strip', { 'fill-color': '#0d2a31', 'fill-opacity': 0.94 });
  src('fh-grass', polyFC(f.grass)); lay('fh-grass', 'fill', 'fh-grass', { 'fill-color': '#1d4a3a', 'fill-opacity': 0.55 });
  src('fh-park', polyFC(f.park)); lay('fh-park', 'fill', 'fh-park', { 'fill-color': '#33454d', 'fill-opacity': 0.9 }); lay('fh-park-l', 'line', 'fh-park', { 'line-color': '#5d747c', 'line-width': 0.7 });
  src('fh-road', lineFC([G.axis].concat(f.side))); lay('fh-road', 'line', 'fh-road', { 'line-color': '#27343a', 'line-width': mw(2 * M.half) }, { 'line-cap': 'butt', 'line-join': 'round' });

  o += '<line x1="' + x(0) + '" y1="' + (H - 9) + '" x2="' + x(Math.floor(span)) + '" y2="' + (H - 9) + '" stroke="#5e7a80" stroke-width="0.8"/>';
  for (let m = 0; m <= span; m += 5) o += '<line x1="' + x(m) + '" y1="' + (H - 12) + '" x2="' + x(m) + '" y2="' + (H - 6) + '" stroke="#5e7a80" stroke-width="0.8"/><text x="' + x(m) + '" y="' + (H - 0.5) + '" class="sl" text-anchor="middle">' + m + ' m</text>';
  return o + '<style>.sl{font:500 8.5px Roboto Mono,monospace;fill:#9bb7bc}</style></svg>';
}
function inspHTML(ev, upTo, title) {
  const r = reasons(ev, upTo, 4), st = r.st, cls = st.alive ? (st.crown < 3 ? 'lim' : 'ok') : 'x';
  const head = title || (st.alive ? 'Itt elfér egy fa — ' + CROWN[st.crown] + ' koronával (kb. ' + CROWN_M2[st.crown] + ' m² árnyék)' : 'Itt nem állhat fa');
  return '<div class="insp"><h3 class="' + cls + '">' + head + '</h3>' + section(ev, upTo) + '<ul>' + r.html + '</ul><div class="fn">A távolságok jellemző értékek — településenként és üzemeltetőnként eltérhetnek.</div></div>';
}

/* ---------- a játékos fáinak sorsa a lépcsőkön ---------- */
function fateRows(upTo, full) {
  return S.ghosts.map((t, i) => { const st = FH.stateAt(t.ev, upTo);
    if (!st.alive) { const by = st.by, sn = STAGE_TXT[by.stage].name.toLowerCase(); return '<div class="x"><span class="t">' + (i + 1) + '</span><span>' + failText(by) + (full ? ' <span style="color:var(--faint)">· ' + sn + '</span>' : '') + '</span></div>'; }
    if (st.crown < 3) return '<div class="lim"><span class="t">' + (i + 1) + '</span><span>áll, de legfeljebb <b>' + CROWN[st.crown] + ' koronával</b></span></div>';
    return '<div class="ok"><span class="t">' + (i + 1) + '</span><span>áll</span></div>'; }).join('');
}
function markGhosts(upTo) { S.ghosts.forEach((t, i) => { const st = FH.stateAt(t.ev, upTo); setTree(t, st.alive ? (st.crown < 3 ? 'lim' : 'ok') : 'x', st.alive ? String(i + 1) : '✕'); }); }
const aliveN = upTo => S.ghosts.filter(t => FH.stateAt(t.ev, upTo).alive).length;
function funnelHTML(cur) { const lab = ['Papíron', 'Közlekedés', 'Telek, felszín', 'Föld fölött', 'Föld alatt'];
  return '<div class="fun">' + M.pct.map((p, i) => (cur != null && i > cur) ? '' : '<div class="' + (i === cur ? 'cur' : '') + '"><span>' + lab[i] + '</span><i><u style="width:' + Math.max(1.5, p) + '%"></u></i><b>' + Math.round(p) + '%</b></div>').join('') + '</div>'; }

/* ---------- képernyők ---------- */
function showChips(v) { LC.show(v); }
function render() {
  if (!LC) return; const n = S.trees.length;
  showChips(S.st === 'step' || S.st === 'mid' || S.st === 'inf' || S.st === 'final');
  if (S.st === 'loading') { P.innerHTML = '<span class="eyebrow">Döntésjáték · 4–5 perc</span><h1>Hol fér el <em>egy fa</em>?</h1><p><span class="spin"></span>Az utca adatainak betöltése…</p>'; return; }
  const c = M.counts;
  if (S.st === 'intro') { TB.innerHTML = 'Diósd · <b>Kossuth Lajos utca</b>';
    P.innerHTML = `<span class="eyebrow">Döntésjáték · 4–5 perc</span><h1>Hol fér el <em>egy fa</em>?</h1>
    <div class="prob"><div><span class="n">1</span><span>${esc(M.town)}, ${esc(M.street)}: ${Math.round(M.len)} méter, a házak előtt ${M.stripW.L} méter széles közterületi sáv.</span></div>
    <div><span class="n">2</span><span>Ránézésre bárhová fér fa. Megnézzük, mit enged az utca: a felszínen, fölötte és alatta.</span></div>
    <div><span class="n">3</span><span>Előbb egy tipp: <b>a közterületi sáv mekkora részén állhat fa?</b></span></div></div>
    <div class="guess">${[90, 70, 50, 30, 10].map(g => `<button type="button" onclick="guess(${g})">${g}%</button>`).join('')}</div>
    <div class="src">Utca, behajtók, kerítések, oszlopok, fák: OpenStreetMap (${esc(M.osmDate)}) · Közművek: az e-közmű lakossági térképe alapján, egyszerűsítve — tájékoztató jellegű</div>`; return; }
  if (S.st === 'blind') { TB.innerHTML = '1. kör · adat nélkül · <b>' + n + '/' + N + '</b>';
    P.innerHTML = `<span class="eyebrow">1. kör — adat nélkül</span><h1>Koppints ${N} helyre, ahová fát ültetnél</h1>
    <div class="cnt">${Array.from({ length: N }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost" onclick="undo()" ${n ? '' : 'disabled'}>Vissza</button><button class="btn" onclick="startFunnel()" ${n === N ? '' : 'disabled'}>Megnézzük</button></div>
    <div class="hint">${n < N ? 'A világosabb sáv a közterület az úttest és a kerítések között. Nagyíts bátran; egy fára koppintva visszaveszed.' : 'Mind az ' + N + ' fa a helyén — nézzük, mit szól hozzá az utca.'}</div>`; return; }
  if (S.st === 'step') { const i = S.stage, T = STAGE_TXT[i], pct = Math.round(M.pct[i]), al = aliveN(i), lost = S.ghosts.filter(t => { const a = FH.stateAt(t.ev, i - 1).alive, b = FH.stateAt(t.ev, i).alive; return a && !b; }).length;
    TB.innerHTML = i + '/4 · ' + T.name + ' · <b>' + pct + '%</b>';
    const body = { 1: `${c.drive} kapubehajtó, ${c.junc} útcsatlakozás, ${c.cross} gyalogátkelő. A behajtó szélétől legalább 1 méter, a saroktól 10 méter kell; a járdából és a szegély mellől sem vehetünk el.`,
      2: `A kerítéstől és a homlokzattól 2 méter, a meglévő fától 5 méter, a nyílt ároktól 3 méter kell. ${c.tree} fa már áll a sávban.`,
      3: `${nf(c.wireLen)} méter légvezeték és ${c.pole} oszlop. A vezeték 3 méteres sávjában csak alacsony fa maradhat: a még szabad terület ${M.smallPct[3]}%-án legfeljebb kis koronájú fa fér el.`,
      4: `${nf(c.utilLen)} méter vezeték fut ${Math.round(M.len)} méter utca alatt: gáz ${nf(c.gasLen)} m, víz ${nf(c.waterLen)} m, csatorna ${nf(c.sewerLen)} m, földkábel ${nf(c.cableLen)} m, hírközlés ${nf(c.telLen)} m. Gáztól és víztől 2, csatornától 3, kábeltől 1 méter kell.` }[i];
    const h1 = i === 3 ? 'A hely megvan — <em>a lombkorona nem</em>' : 'A sáv <em>' + pct + '%</em>-a maradt szabad';
    let worst = null; if (i === 4) { worst = S.ghosts.find(t => { const st = FH.stateAt(t.ev, 4); return !st.alive && st.by.stage === 4; }) || null; }
    P.innerHTML = `<span class="eyebrow">${i}/4 · ${T.name} <i>· ${T.src}</i></span><h1>${h1}</h1><p>${body}</p>
    <div class="fate">${fateRows(i)}</div>
    <div class="row"><button class="btn" onclick="nextStep()">${i < 4 ? 'Tovább' : 'Mérleg'}</button></div>
    <div class="hint">${N} fádból <b>${al}</b> áll még${lost ? ' · ebben a lépésben <span class="bad">' + lost + ' esett ki</span>' : ''}.${i === 4 ? ' Az e-közmű lakossági térképe tájékoztató jellegű.' : ' Jellemző értékek — a helyi rendelet eltérhet.'}</div>
    ${funnelHTML(i)}
    ${worst ? inspHTML(worst.ev, 4, (S.ghosts.indexOf(worst) + 1) + '. fád helye a föld alatt') : ''}`; return; }
  if (S.st === 'mid') { const al = aliveN(4); TB.innerHTML = 'Vakon · <b>' + al + '/' + N + '</b>';
    P.innerHTML = `<span class="eyebrow">1. kör — eredmény</span><h1>Adat nélkül: <em>${al}</em> / ${N} fa maradt</h1>
    <p>A közterületi sáv <b>${Math.round(M.pct[4])}%</b>-án állhat fa — a tipped <b>${S.guess}%</b> volt.</p>
    <div class="fate">${fateRows(4, true)}</div>
    ${S.last && S.last.probe ? inspHTML(S.last.ev, 4) : ''}
    <div class="row"><button class="btn" onclick="startInformed()">Újra, adattal</button></div>
    <div class="hint">A zöld foltok a szabad helyek. Koppints bárhová a sávban: megmutatjuk, mi van ott.</div>`; return; }
  if (S.st === 'inf') { TB.innerHTML = '2. kör · adattal · <b>' + n + '/' + N + '</b>';
    let msg = 'Koppints a zöld foltokra. Nagyíts rá: a szabad helyek kicsik.';
    if (S.last) { if (S.last.own) msg = '<span class="bad">Túl közel van egy másik fádhoz — legalább ' + M.spacing + ' méter kell.</span>';
      else if (S.last.ok) msg = 'Elfér: <b>' + CROWN[S.last.ev.crown] + ' koronájú</b> fa, kb. ' + CROWN_M2[S.last.ev.crown] + ' m² árnyék' + (S.last.ev.flags.park ? ' · <span class="warn">−1 parkolóhely</span>' : '') + '.';
      else { const st = FH.stateAt(S.last.ev, 4); msg = '<span class="bad">Itt nem lehet:</span> ' + failText(st.by) + '.'; } }
    P.innerHTML = `<span class="eyebrow">2. kör — adattal</span><h1>Ültess ${N} fát a szabad helyekre</h1>
    <div class="cnt">${Array.from({ length: N }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost" onclick="undo()" ${n ? '' : 'disabled'}>Vissza</button><button class="btn" onclick="finish()" ${n === N ? '' : 'disabled'}>Kiértékelés</button></div>
    <div class="hint">${msg}</div>
    ${S.last && !S.last.ok && !S.last.own ? inspHTML(S.last.ev, 4) : ''}`; return; }
  if (S.st === 'final') { const f = M.final, truth = Math.round(M.pct[4]), diff = S.guess - truth; TB.innerHTML = 'Vakon <b>' + S.r1 + '</b> · adattal <b>' + n + '</b>';
    const h1 = diff >= 15 ? `Tipped: ${S.guess}%. A valóság: <em>${truth}%</em>.` : `A sáv <em>${truth}%</em>-án állhat fa — jól érezted.`;
    const groups = [['elo', 'Itt, ezen az utcán mérve'], ['papir', 'Papíron dől el — ültetés előtt tisztázni kell'], ['godor', 'Csak a próbagödör mutatja meg'], ['faj', 'Nem a helyet, hanem a fajt és a méretet szűkíti'], ['opt', 'Rangsorol: hol ér a legtöbbet a fa'], ['nincs', 'Ezen az utcán nincs ilyen'], ['videk', 'Csak vidéken és erdőben számít']];
    const cat = groups.map(([k, t]) => { const it = D.catalog.filter(q => q[4] === k); return it.length ? '<h4>' + t + ' · ' + it.length + '</h4><p>' + it.map(q => esc(q[1])).join(' · ') + '</p>' : ''; }).join('');
    P.innerHTML = `<span class="eyebrow">Az utca mérlege</span><h1>${h1}</h1>
    ${S.last && S.last.probe ? inspHTML(S.last.ev, 4) : ''}
    <div class="score"><div class="sc b1"><span>1. kör · adat nélkül</span><b>${S.r1}/${N}</b></div><div class="sc b2"><span>2. kör · adattal</span><b>${n}/${N}</b></div></div>
    ${funnelHTML(null)}
    <p>Ezen a ${Math.round(M.len)} méteren <b>${f.n} új fa</b> férne el — ha pontosan oda kerülnek. Közülük ${f.small} csak kis koronájú lehet a légvezeték miatt, ${f.park} parkolóhelyet vinne el.</p>
    <p>A szabad ${truth}%-ot az találja meg elsőre, aki a behajtókat, a légvezetéket, a meglévő fákat és a közműveket egy térképen látja — még az ígéret előtt, nem a gödör mellett.</p>
    <p style="font-size:13.5px">Ásás előtt: az e-közmű lakossági térképe tájékoztató jellegű; hiteles adatot a közműegyeztetés ad, és a házi bekötések egy része a nyilvántartásból is hiányozhat.</p>
    <details class="cat"><summary>${D.catalog.length} szempontból ${M.roles.elo} dőlt el itt a térképen — a többi</summary>${cat}</details>
    <p style="margin-top:12px;color:var(--text);font-size:14px">Melyik lépcső lepett meg a legjobban?</p>
    <div class="poll">${[1, 2, 3, 4].map(i => `<button type="button" class="${S.poll === i ? 'on' : ''}" onclick="poll(${i})">${STAGE_TXT[i].name}</button>`).join('')}</div>
    <div class="src">Koppints bárhová a sávban: megmutatjuk, mi van ott. Az ⭕ Elférő fák réteg a ${f.n} lehetséges helyet mutatja.</div>
    ${GV.endPanel({ game: 'fahely' })}`; return; }
}

/* ---------- lépések ---------- */
function guess(g) { S.guess = g; S.st = 'blind'; render(); fitStreet(true); }
function startFunnel() { S.ghosts = S.trees; S.trees = []; S.ghosts.forEach(t => t.el.classList.add('ghost')); LC.set('ghost', true); S.stage = 0; nextStep(); }
function nextStep() {
  if (S.stage < 4) { S.stage++; S.st = 'step'; [1, 2, 3, 4].forEach(i => LC.set('s' + i, i === S.stage)); LC.set('free', true); markGhosts(S.stage); render(); applyStage(); fitStreet(true); P.scrollTop = 0; return; }
  S.r1 = aliveN(4); S.st = 'mid'; S.last = null; [1, 2, 3].forEach(i => LC.set('s' + i, false)); LC.set('s4', false); LC.set('free', true); render(); applyStage(); fitStreet(true); P.scrollTop = 0;
}
function startInformed() { clearProbe(); S.st = 'inf'; S.last = null; S.tries = 0; LC.set('ghost', false); LC.set('free', true); render(); applyStage(); zoomToFree(); }
/* a 2. kör elején ráközelítünk az utca egy olyan részére, ahol több szabad folt is van */
function zoomToFree() { if (!mapReady) return; let best = 0, bs = AX.L / 2; for (let s = 30; s < AX.L - 30; s += 10) { let nn = 0; for (const p of S.freePts) { const q = AX.st(p[0], p[1]); if (Math.abs(q.s - s) < 28) nn++; } if (nn > best) { best = nn; bs = s; } }
  const sheet = document.querySelector('.sheet'), wide = innerWidth >= 900, pad = wide ? { top: 60, bottom: 20, left: 470, right: 20 } : { top: 60, bottom: Math.min(innerHeight * 0.6, sheet.offsetHeight + 14), left: 12, right: 12 };
  const w = Math.max(120, innerWidth - pad.left - pad.right); const z = Math.log2((w / 62) / PXM14) + 14;
  map.easeTo({ center: LLst(bs, 4), zoom: Math.min(20, z), bearing: M.az - 90, padding: pad, duration: 900, essential: true }); }
function finish() { clearProbe(); S.st = 'final'; S.last = null; LC.set('final', true); LC.set('ghost', true);
  GV.record('fahely', { ds: M.id, score: S.r1, guess: S.guess, truth: M.pct[4],
    blind: { alive: S.r1, pts: S.ghosts.map(t => { const st = FH.stateAt(t.ev, 4); return [+t.x.toFixed(1), +t.y.toFixed(1), st.alive ? 0 : st.by.stage, st.alive ? '' : st.by.id, st.crown]; }) },
    informed: { score: S.trees.length, tries: S.tries, pts: S.trees.map(t => [+t.x.toFixed(1), +t.y.toFixed(1), t.ev.crown, t.ev.flags.park ? 1 : 0]) },
    layers: LC.all(), toggles: S.toggles, dur: Math.round((Date.now() - S.t0) / 1000), vw: innerWidth });
  render(); applyStage(); fitStreet(true); P.scrollTop = 0; }
function poll(i) { if (S.poll) return; S.poll = i; GV.record('velemeny', { game: 'fahely', q: 'meglepett', a: STAGE_TXT[i].name }); render(); }
</script>
<script>window.addEventListener('pageshow',function(){document.body.style.opacity='';document.body.classList.add('in');});</script>
</body>
</html>
