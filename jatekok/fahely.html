<style>
:root{--bg:#050f14;--teal:#2AD1B5;--amber:#FF9F45;--red:#ff6b4a;--text:#EAF4F4;--muted:#9BB7BC;--faint:#5E7A80;
  --card:rgba(6,17,22,.94);--line:rgba(42,209,181,.25);--font:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  --gv-accent:var(--teal);--gv-accent-ink:#04211d;--gv-line:var(--line);--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
#map{position:fixed;inset:0;z-index:0}
.homelink{position:fixed;top:calc(10px + var(--sat));left:10px;z-index:40;font:700 12px var(--mono);letter-spacing:.06em;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(10px);text-decoration:none}
.topbar{position:fixed;top:calc(10px + var(--sat));right:10px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:100px;padding:8px 14px;backdrop-filter:blur(12px);font:500 13px var(--mono);color:var(--muted);max-width:calc(100vw - 132px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar b{color:var(--amber);font-weight:500}
/* második sor a tetején: áttekintő sáv (keskeny képernyőn) és a nézetgombok */
.tools{position:fixed;top:calc(52px + var(--sat));left:10px;right:10px;z-index:40;display:none;gap:6px;align-items:center;justify-content:flex-end;pointer-events:none}
.tools>*{pointer-events:auto}
.tools button{font:500 12px var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:8px 12px;cursor:pointer;
  backdrop-filter:blur(10px);touch-action:manipulation;min-height:40px;flex:none}
#mini{display:none;flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(6,17,22,.9);touch-action:none;cursor:pointer}
.tools.seg #mini{display:block}.tools.seg #fitbtn{display:none}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* a panel: mindig alul, vízszintesen középen (telefonon teljes szélességű lap) */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:580px;padding:0 10px calc(10px + var(--sab))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px 14px;backdrop-filter:blur(16px);
  box-shadow:0 -10px 50px rgba(0,0,0,.55);max-height:62vh;max-height:62dvh;overflow:auto}
/* a záróképernyőn a panel alacsonyabb, hogy a rétegkapcsolókkal együtt se takarja el az utcát */
.sheet.fin .panel{max-height:46vh;max-height:46dvh}
/* a záró lapokon a lapozógombok a panel alján maradnak, ha a tartalom görgetni kell */
.sheet.fin .panel .row:last-child{position:sticky;bottom:-14px;margin-bottom:-14px;padding:12px 0 14px;background:linear-gradient(rgba(6,17,22,0),rgba(6,17,22,.98) 12px);z-index:1}
.row a.btn{text-decoration:none;text-align:center;line-height:1.25;font-size:15px}
.sheet.fin h1:focus{outline:none}
h1{font-size:22px;font-weight:900;line-height:1.18;margin-bottom:6px}
h1 em{font-style:normal;color:var(--teal)}
h1 .sw{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c,var(--teal));margin-right:9px;vertical-align:1px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin-bottom:8px;display:block}
p{color:var(--muted);font-size:15px}p+p{margin-top:8px}
p b{color:var(--text);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;
  border:none;transition:.2s;font-family:var(--font);background:var(--teal);color:#04211d;min-height:50px;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;cursor:default}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}.row .btn.sm{flex:0 0 auto;min-width:104px;padding-left:14px;padding-right:14px}
.cnt{display:flex;gap:6px;margin:10px 0 2px}.cnt i{flex:1;height:8px;border-radius:4px;background:rgba(143,176,181,.25)}.cnt i.on{background:var(--teal)}
.hint{font:500 12.5px var(--mono);color:var(--muted);margin-top:10px;min-height:17px;line-height:1.5}
.hint b{color:var(--teal)}.hint .bad{color:var(--red)}.hint .warn{color:var(--amber)}
.lnk{background:none;border:none;color:var(--teal);font:500 12.5px var(--mono);cursor:pointer;padding:13px 0;text-decoration:underline;text-underline-offset:3px}
.guess{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.guess button{font:700 16px var(--mono);padding:13px 0;border-radius:12px;border:1.5px solid var(--line);background:rgba(15,74,87,.25);color:var(--text);cursor:pointer;touch-action:manipulation;min-height:50px}
.guess button:active{background:var(--teal);color:#04211d}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(15,74,87,.2)}
.sc span{display:block;font:500 11px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.sc b{display:block;font:500 30px var(--mono);line-height:1.1;margin-top:4px}
.sc.b1 b{color:var(--amber)}.sc.b2 b{color:var(--teal)}
.src{font:500 11px var(--mono);color:var(--faint);margin-top:10px;line-height:1.5}
/* varázsló: egy réteg = egy kártya (asztali gépen a rajz a szöveg mellett) */
.wiz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wiz-top .eyebrow{margin:0;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;align-items:center;margin:0 0 10px}
.dots i{flex:1;height:5px;border-radius:3px;background:rgba(143,176,181,.22)}.dots i.d{background:var(--muted)}.dots i.c{background:var(--c,var(--teal))}.dots i.g{margin-left:7px}
.skip{background:none;border:none;color:var(--faint);font:500 11.5px var(--mono);cursor:pointer;padding:13px 0 13px 10px;margin:-9px 0;text-decoration:underline;text-underline-offset:3px;flex:none}
.wz-body{display:grid;gap:8px}
.wz-body p{font-size:14.5px;line-height:1.42}
.art{display:block;width:100%;height:auto;border-radius:12px;background:#0b1d24;border:1px solid var(--line)}
.eff{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px;font:500 12px var(--mono);color:var(--muted)}
.eff .bar{height:10px;border-radius:5px;background:rgba(143,176,181,.16);position:relative;overflow:hidden}
.eff .bar u{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .5s ease}
.eff .bar u.p{background:var(--c,var(--amber));opacity:.75}.eff .bar u.n{background:var(--teal)}
.eff b{color:var(--text);font-weight:500;white-space:nowrap}
.eff.note{display:block;color:var(--text);font:500 12.5px var(--mono);line-height:1.45}
/* egyetlen halmozott sáv: mi vitte el a helyet */
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:12px 0 6px;background:rgba(143,176,181,.16)}
.stack i{display:block;height:100%;min-width:2px}
.stkl{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 11.5px var(--mono);color:var(--muted)}
.stkl span{white-space:nowrap}.stkl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}.stkl b{color:var(--text);font-weight:500}
/* a játékos fáinak sorsa */
.fate{display:grid;gap:4px;margin-top:8px}
.fate div{display:flex;gap:8px;align-items:baseline;font-size:13.5px;color:var(--muted);line-height:1.35}
.fate .t{flex:none;font:700 11px var(--mono);border-radius:100px;padding:1px 7px;background:rgba(143,176,181,.2);color:var(--text)}
.fate .x .t{background:var(--red);color:#fff}.fate .ok .t{background:var(--teal);color:#04211d}.fate .lim .t{background:var(--amber);color:#2b1400}
.fate b{color:var(--text);font-weight:500}
/* vizsgálólap: keresztmetszet + okok */
.insp{border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;margin:10px 0 2px;background:rgba(15,74,87,.16)}
.insp h3{font:700 13.5px var(--font);margin-bottom:2px}.insp h3.x{color:var(--red)}.insp h3.ok{color:var(--teal)}.insp h3.lim{color:var(--amber)}
.insp svg{display:block;width:100%;height:auto;margin:4px 0 2px}
.insp .art{margin:6px auto 4px;max-width:min(100%,420px)}
.insp ul{list-style:none;display:grid;gap:3px;margin-top:4px}
.insp li{font-size:13px;color:var(--muted);line-height:1.35}
.insp li b{color:var(--text);font-weight:500}.insp li.x::before{content:'✕ ';color:var(--red);font-weight:700}.insp li.l::before{content:'! ';color:var(--amber);font-weight:700}.insp li.o::before{content:'✓ ';color:var(--teal);font-weight:700}
.insp .fn{font:500 10.5px var(--mono);color:var(--faint);margin-top:6px}
details.cat{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.cat summary{cursor:pointer;font:500 12.5px var(--mono);color:var(--teal);list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:' ›'}details.cat[open] summary::after{content:' ⌄'}
.cat h4{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
.cat p{font-size:13px;line-height:1.5}
.poll{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.poll button{font:500 13.5px var(--font);padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer;touch-action:manipulation}
.poll button.on{background:var(--teal);color:#04211d;border-color:var(--teal)}
.poll button i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
/* záró lapok: a csík lépcsőzetes felbontása, az egyenkénti hatás és az elférő fák */
.cap{font:500 11.5px var(--mono);color:var(--muted);line-height:1.45}
.wf{display:grid;gap:6px;margin:8px 0 2px}
.wr{display:grid;grid-template-columns:minmax(124px,32%) 1fr;gap:3px 12px;align-items:center}
.wr .wl{font:500 12px var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .wl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.wr .wl b{font-weight:500;color:var(--c)}
.wb{height:12px;border-radius:4px;background:rgba(143,176,181,.12);position:relative;overflow:hidden}
.wb u{position:absolute;top:0;bottom:0;background:var(--c);border-radius:3px;min-width:3px}
.wb.stk{display:flex;height:16px}.wb.stk i{display:block;height:100%;min-width:2px}
.wb u.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.wr .wk{grid-column:2;font:500 10.5px var(--mono);color:var(--muted);line-height:1.4}
.wr.sum{margin-top:2px;padding-top:8px;border-top:1px dashed rgba(143,176,181,.25)}.wr.sum .wl{color:var(--muted)}
.sr{display:grid;grid-template-columns:116px 1fr 38px;gap:10px;align-items:center;font:500 12px var(--mono);color:var(--text)}
.sr b{font-weight:500;text-align:right;color:var(--muted)}.sr .wb{height:10px}
.sr.lim{color:var(--amber)}.sr.lim b{color:var(--amber)}
.tdots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px}
.tdots i,.tleg i{display:inline-block;border-radius:50%;background:rgba(42,209,181,.5);border:1.5px solid var(--teal);flex:none}
.tdots i.c3,.tleg i.c3{width:20px;height:20px}.tdots i.c2,.tleg i.c2{width:15px;height:15px}.tdots i.c1,.tleg i.c1{width:10px;height:10px}
.tdots i.pk,.tleg i.pk{border-color:var(--amber);background:rgba(255,159,69,.5)}
.tdots i.tl,.tleg i.tl{outline:1.5px dashed var(--muted);outline-offset:2px}
.tleg{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 11.5px var(--mono);color:var(--muted)}
.tleg span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.tleg b{color:var(--text);font-weight:500}
.thx{margin-top:8px;font:500 12.5px var(--mono);color:var(--text)}
@media(max-width:819px){.sheet.fin .panel .row:last-child{bottom:-12px;margin-bottom:-12px;padding-bottom:12px}.wr{grid-template-columns:1fr;gap:4px}.wr .wk{grid-column:1}.sr{grid-template-columns:96px 1fr 34px;gap:8px;font-size:11.5px}}
/* a fák sorszáma a törzs tövénél (a külső elemet a MapLibre pozicionálja, azon nincs saját transform) */
.mk{width:24px;height:24px;cursor:pointer}
.tree{width:24px;height:24px;border-radius:50%;background:rgba(6,17,22,.92);border:2px solid #eafaf7;display:flex;align-items:center;justify-content:center;
  font:700 11px var(--mono);color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.tree.x{border-color:var(--red);color:var(--red);background:rgba(40,8,4,.92)}
.tree.x.now{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tree.lim{border-color:var(--amber);color:var(--amber)}
.tree.ok{border-color:var(--teal);color:var(--teal)}
.mk.ghost{pointer-events:none}.mk.ghost .tree{animation:none}.mk.ghost .tree.x.now{animation:shake .5s ease-in-out 2}
.mk.probe .tree{border-style:dashed;animation:none}
.tip{background:rgba(40,8,4,.96);border:1px solid var(--red);color:#fff;font:500 13px var(--font);padding:7px 11px;border-radius:10px;white-space:normal;width:max-content;max-width:min(78vw,300px);text-align:center;line-height:1.35;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(100px + var(--sat));z-index:45;max-width:min(92vw,430px);background:rgba(6,17,22,.96);border:1px solid var(--line);color:#fff;
  font:500 14px var(--font);padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
.maplibregl-ctrl-attrib{font-size:10px!important}
.maplibregl-ctrl-top-left{top:calc(98px + var(--sat))!important;z-index:35}
.err{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
body.maperr .err{display:flex}
.err div{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:820px){.sheet{bottom:12px}.sheet.wide{max-width:780px}.panel{padding:18px 22px 16px}.sheet.fin .panel{max-height:50vh;max-height:min(50vh,calc(100vh - 400px))}.sheet.fin .panel .row:last-child{bottom:-16px;margin-bottom:-16px;padding-bottom:16px}.insp svg{max-height:132px;width:auto;max-width:100%;margin-left:auto;margin-right:auto}
  .sheet.wide .wz-body{grid-template-columns:320px 1fr;gap:16px;align-items:start;min-height:100px}}
@media(max-width:819px){.art{max-height:88px;width:auto;max-width:100%;margin:0 auto}.wz-body p{font-size:14px}.src.cav{display:none}.src.cav.keep{display:block}.panel{padding:14px 16px 12px}}
@media(prefers-reduced-motion:reduce){.tree,.tree.x.now,.mk.ghost .tree.x.now{animation:none}.eff .bar u{transition:none}}
</style>
</head>

<div class="row"><a class="btn" id="err-next" href="../jatekok.html">Másik játék</a></div></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
   HOL FÉR EL EGY FA? — egy valós utca (Diósd, Kossuth Lajos utca), valós adatokon, 3D-ben.
   Menet: bemutatkozik az utca → tipp → 5 fa adat nélkül → rétegenként (egy kattintás = egy réteg) kiderül,
   mit enged az utca → eredmény → 5 fa adattal → az utca mérlege.
   Elvek: · ami az utcán szemmel látszik (úttest, szegély, járda, behajtó, kerítés, ház, fa), az kezdettől látszik, semleges színnel;
            a szabályok távolságai, a légvezeték és a föld alatti vezetékek rétegenként jönnek;
          · a zöld egyet jelent: ide fér fa. A sáv zölden indul, és minden réteg kiharap belőle;
          · minden megjelenített adat a térképen kap feliratot (nincs külön jelmagyarázat).
   Adatok (data/fahely-diosd-kossuth.json, előre kiszámolva):

/* ---------- koordináták: helyi méter ↔ földrajzi ---------- */
const LL = (x, y) => [M.lon0 + M.inv[0] * x + M.inv[1] * y, M.lat0 + M.inv[2] * x + M.inv[3] * y];
const XY = (lon, lat) => { const a = lon - M.lon0, b = lat - M.lat0; return [M.fwd[0] * a + M.fwd[1] * b, M.fwd[2] * a + M.fwd[3] * b]; };
const LLst = (s, t) => { const p = AX.xy(s, t); return LL(p[0], p[1]); };
const unflat = a => { const o = []; for (let i = 0; i < a.length; i += 2) o.push([a[i] / 10, a[i + 1] / 10]); return o; };
const FC = f => ({ type: 'FeatureCollection', features: f });
const lineFC = arr => FC(arr.map(l => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: l.map(p => LL(p[0], p[1])) } })));

/* ---------- adat → motor → térkép (az indítás a szkript végén van) ---------- */
function init(data) {
  D = data; M = D.meta; STEPS = D.steps; CH = D.chapters; NST = M.nstep;
  PXM14 = 16384 * 512 / (40075016.686 * Math.cos(M.lat0 * Math.PI / 180));
  const f = {}; Object.keys(D.f).forEach(k => f[k] = D.f[k].map(unflat));
  ['pole', 'lamp', 'tree', 'manhole', 'junc'].forEach(k => f[k] = D.pt[k].map(p => [p[0] / 10, p[1] / 10, p[2] || 0]));
  G = { meta: { half: M.half, driveHalf: M.driveHalf, walkHalf: M.walkHalf, limStep: M.limStep }, axis: unflat(D.axis), rules: D.rules, f, lim: { L: D.lim.L.map(v => v / 10), R: D.lim.R.map(v => v / 10) } };
  EN = FH.prepare(G); AX = EN.axis;
  /* a rács lépésenként: melyik cellában mekkora korona fér el (0 = nem állhat fa) */
  ['L', 'R'].forEach(side => { const F = D.free[side], ns = M.ns, arr = [];
    for (let st = 0; st <= NST; st++) { const g = new Uint8Array(F.nt * ns), r = F.runs[st]; for (let i = 0; i < r.length; i += 4) for (let is = r[i + 1]; is <= r[i + 2]; is++) g[r[i] * ns + is] = r[i + 3]; arr.push(g); }
    GRID[side] = { nt: F.nt, sign: F.sign, tMin: F.tMin, crown: arr }; });
  /* a végső szabad rácspontok — a 2. körben a koppintás ehhez igazodik (ujjnyi pontatlanságon belül) */
  S.freePts = []; ['L', 'R'].forEach(side => { const g = GRID[side], c = g.crown[NST], ns = M.ns; for (let i = 0; i < c.length; i++) if (c[i]) { const p = AX.xy(M.s0 + (i % ns) * M.step, g.sign * (g.tMin + Math.floor(i / ns) * M.step)); S.freePts.push([p[0], p[1], c[i]]); } });
  /* lépésenként: hol a legtöbb a kieső terület (keskeny képernyőn oda csúszunk) */
  for (let k = 1; k <= NST; k++) { const bins = new Map();
    ['L', 'R'].forEach(side => { const g = GRID[side], a = g.crown[k - 1], b = g.crown[k], ns = M.ns; for (let i = 0; i < a.length; i++) if (a[i] && (!b[i] || (b[i] === 1 && a[i] > 1))) { const key = Math.floor((M.s0 + (i % ns) * M.step) / 12); bins.set(key, (bins.get(key) || 0) + 1); } });
    let best = null; bins.forEach((n, key) => { const m = n + (bins.get(key - 1) || 0) + (bins.get(key + 1) || 0); if (!best || m > best.n) best = { n: m, s: key * 12 + 6 }; });
    SHOW[k] = best ? clamp(best.s, 28, AX.L - 28) : (SHOW[k - 1] || AX.L / 2); }
  S.st = 'intro'; S.intro = 0; render(); initMap();
}

const BLANK = { version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf', sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#050f14' } }] };
let blankTried = false;
/* keskeny képernyőn a teljes utca túl apró lenne a játékhoz: ott utcaszakaszt mutatunk, fölötte áttekintő sávval */
const seg = () => !!AX && (innerWidth - 48) / (AX.L + 16) < 4.2;
const segPx = () => Math.max(5.6, innerWidth / 60);
const pitchNow = () => S.d3 ? 42 : 0;
function pickFont(m) { try { const st = m.getStyle() || {}; if (!st.glyphs) return null;
  const A = (st.layers || []).filter(l => l.type === 'symbol' && l.layout && Array.isArray(l.layout['text-font']) && typeof l.layout['text-font'][0] === 'string').map(l => l.layout['text-font']).filter(s => !/italic/i.test(s[0]));
  return A.find(s => /bold/i.test(s[0])) || A.find(s => /medium|regular/i.test(s[0])) || A[0] || ['Noto Sans Regular']; } catch (e) { return ['Noto Sans Regular']; } }
function initMap() {
  const opts = { container: 'map', theme: 'dark', center: [M.lon0, M.lat0], zoom: 16.2, bearing: M.az - 90, pitch: 0, minZoom: 15, maxZoom: 21, maxPitch: 60, dragRotate: false, pitchWithRotate: false, touchPitch: false,
    pixelRatio: Math.min(devicePixelRatio || 1, 2), antialias: FINE, attributionControl: false };
  const ready = m => { map = m; mapReady = true;
    try { m.touchZoomRotate.disableRotation(); m.keyboard.disableRotation(); m.doubleClickZoom.disable(); } catch (e) {}
    try { m.setLight({ anchor: 'viewport', intensity: 0.25 }); } catch (e) {}
    m.on('error', e => { try { console.warn('[fahely]', e && e.error && e.error.message); } catch (x) {} });
    const fo = pickFont(m); hasGlyphs = !!fo; if (fo) FONT = fo;
    /* az alaptérkép lapos épületei és POI-feliratai a saját 3D-s jelenet alatt csak zavarnának */
    try { (m.getStyle().layers || []).forEach(l => { const sl = l['source-layer'] || ''; if (/^buildings?$/.test(sl) || (l.type === 'symbol' && /poi|housenum/i.test(l.id + ' ' + sl))) m.setLayoutProperty(l.id, 'visibility', 'none'); }); } catch (e) {}
    TOOLS.style.display = 'flex'; try { m.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-left');   /* a forrásmegjelölés néhány másodpercig kinyitva látszik, aztán az (i) gombba húzódik */
      setTimeout(() => { const a = document.querySelector('.maplibregl-ctrl-attrib'); if (a) { a.classList.remove('maplibregl-compact-show'); a.removeAttribute('open'); } }, 6000); } catch (e) {}
    addLayers(); applyScene(); cam(true); m.on('click', onTap); m.on('move', miniFrame); m.on('moveend', segSnap); if (FINE) m.on('mousemove', onHover); };
  /* ha az alaptérkép nem jön, üres stílussal megyünk tovább: a játék minden rétege a saját adatcsomagból rajzolódik */
  const fail = () => { if (mapReady || blankTried) return;
    /* háttérben lévő lapon a térkép nem tud betölteni: ilyenkor nem váltunk tartalékra, megvárjuk, amíg a lap előtérbe kerül */
    if (document.hidden) { const h = () => { document.removeEventListener('visibilitychange', h); setTimeout(fail, 7000); }; document.addEventListener('visibilitychange', h); return; }
    blankTried = true; try { map && map.remove(); } catch (e) {}
    try { const o = Object.assign({}, opts, { style: BLANK }); delete o.theme; const m = new maplibregl.Map(o); m.on('load', () => ready(m)); } catch (e) { document.body.classList.add('maperr'); } };
  try { map = GVMAP.createMap(opts, ready, fail); } catch (e) { fail(); }
}

/* ---------- geometria a 3D-s elemekhez (helyi méterből) ---------- */
const ringLL = (x, y, r, n) => { const o = []; for (let i = 0; i <= n; i++) { const a = i / n * 6.283185307; o.push(LL(x + r * Math.cos(a), y + r * Math.sin(a))); } return o; };
const ext = (ring, base, h, col) => ({ type: 'Feature', properties: { b: base, h: h, c: col }, geometry: { type: 'Polygon', coordinates: [ring] } });
function treeF(x, y, R, H, pal) { const th = Math.min(3, H * 0.36), tr = Math.max(0.16, R * 0.085), c1 = th + (H - th) * 0.5, c2 = th + (H - th) * 0.82;
  return [ext(ringLL(x, y, tr, 6), 0, th, pal[0]), ext(ringLL(x, y, R, 14), th, c1, pal[1]), ext(ringLL(x, y, R * 0.8, 14), c1, c2, pal[2]), ext(ringLL(x, y, R * 0.48, 10), c2, H, pal[3])]; }
const stump = (x, y) => [ext(ringLL(x, y, 0.55, 8), 0, 1.5, '#ff6b4a')];
const ribbon = (a, b, w) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2; return [LL(a[0] + nx, a[1] + ny), LL(b[0] + nx, b[1] + ny), LL(b[0] - nx, b[1] - ny), LL(a[0] - nx, a[1] - ny), LL(a[0] + nx, a[1] + ny)]; };
const ribbonF = (lines, w, base, h, col) => { const o = []; lines.forEach(l => { for (let i = 0; i + 1 < l.length; i++) if (Math.hypot(l[i + 1][0] - l[i][0], l[i + 1][1] - l[i][1]) > 0.05) o.push(ext(ribbon(l[i], l[i + 1], w), base, h, col)); }); return o; };
const PAL_OLD = ['#5a4631', '#3f6b33', '#4a7a3b', '#57893f'], PAL_NEW = ['#8a6a48', '#c9f3ea', '#dff8f2', '#f2fdfa'], PAL_LIM = ['#8a6a48', '#f0c36a', '#f6d48c', '#fbe6b5'], PAL_FIN = ['#8aa0a6', '#bfeee6', '#d5f5ef', '#eafaf7'];
const lineMid = l => { let L = 0; for (let i = 1; i < l.length; i++) L += Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]); let a = L / 2; for (let i = 1; i < l.length; i++) { const d = Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]); if (a <= d && d > 0) return { p: [l[i - 1][0] + (l[i][0] - l[i - 1][0]) * a / d, l[i - 1][1] + (l[i][1] - l[i - 1][1]) * a / d], L }; a -= d; } return { p: l[0], L }; };

/* ---------- a játékos fáinak sorsa ---------- */
function markGhosts(upTo, prev) { S.ghosts.forEach((t, i) => { const st = FH.stateAt(t.ev, upTo), was = prev == null ? false : FH.stateAt(t.ev, prev).alive;
  setTree(t, st.alive ? (st.crown < 2 ? 'lim' : '') : ('x' + (was ? ' now' : '')), st.alive ? String(i + 1) : '✕'); }); }
const aliveN = upTo => S.ghosts.filter(t => FH.stateAt(t.ev, upTo).alive).length;
/* egyetlen halmozott sáv: a teljes közterületi sávból melyik fejezet mennyit vett el, és mennyi maradt szabadon */
const pcs = v => v > 0 && v < 0.5 ? '<1%' : pc(v);   /* a „0%” félrevezető, ha kevés, de nem semmi */
const stackSeg = () => CH.map((c, i) => ({ n: c.label, v: M.chPct[i] - M.chPct[i + 1], col: CHCOL[c.id] })).concat([{ n: 'szabad', v: M.chPct[CH.length], col: FREE }]);
function stackHTML() { const seg2 = stackSeg();
  return '<div class="stack" role="img" aria-label="A közterületi sáv megoszlása">' + seg2.map(q => '<i style="width:' + q.v + '%;background:' + q.col + '"></i>').join('') + '</div><div class="stkl">'
    + seg2.map(q => '<span><i style="background:' + q.col + '"></i>' + esc(q.n) + ' <b>' + pcs(q.v) + '</b></span>').join('') + '</div>'
    + '<div class="src" style="margin-top:6px">100% = a teljes közterületi sáv; balról jobbra a lépések sorrendjében.' + (capShare(3) >= 1 ? ' A légvezeték helyet alig vesz el, de a szabad hely ' + capShare(3) + '%-át kis koronára szorítja.' : '') + '</div>'; }
/* egy fejezet saját koronakorlátozása: a végül szabad cellák hány %-át szorította kis koronára éppen ez a fejezet */
function capShare(chId) { const st = STEPS.filter(q => q.ch === chId); if (!st.length) return 0; const a = st[0].id - 1, b = st[st.length - 1].id; let n = 0, fr = 0;
  ['L', 'R'].forEach(sd => { const g = GRID[sd]; if (!g) return; const z = g.crown[NST], c0 = g.crown[a], c1 = g.crown[b]; for (let i = 0; i < z.length; i++) if (z[i]) { fr++; if (c1[i] === 1 && c0[i] > 1) n++; } });
  return fr ? Math.round(100 * n / fr) : 0; }
/* egész százalékok úgy, hogy a részek összege a kerekített egészet adja (legnagyobb maradék módszere) */
function lrRound(vals, total) { const fl = vals.map(Math.floor); let rest = Math.round(total) - fl.reduce((x, y) => x + y, 0);
  vals.map((v, i) => i).sort((i, j) => (vals[j] - fl[j]) - (vals[i] - fl[i])).forEach(i => { if (rest > 0) { fl[i]++; rest--; } }); return fl; }

/* ---------- a záró lapok ábrái ---------- */
const KW = { road: 'szegély', drive: 'behajtók', sight: 'kereszteződés, zebra', walk: 'járda', plot: 'kerítés, ház', tree: 'meglévő fák', drain: 'árok', wire: 'légvezeték', cable: 'kábelek', water: 'ivóvíz', sewer: 'csatorna', gas: 'gáz' };
const RK = { road: 'szegély', sideroad: 'keresztutca', drive: 'behajtók', junc: 'kereszteződés', cross: 'zebra', walk: 'járda', fence: 'kerítés', bld: 'homlokzat', tree: 'meglévő fák', drain: 'árok', pole: 'oszlop', gas: 'gáz', water: 'ivóvíz', sewer: 'csatorna', cable: 'földkábel', manhole: 'aknafedlap', culv: 'befedett árok', wire: 'légvezeték', lamp: 'lámpa' };
const nevelo = w => /^[aáeéiíoóöőuúüű]/i.test(w) ? 'Az' : 'A';
/* a csík lépcsőzetesen: minden fejezet csak azt kapja, ami előtte még szabad volt; alul az összerakott csík */
function wfHTML() { const fr = M.chPct[CH.length];
  const rows = CH.map((c, i) => { const v = M.chPct[i] - M.chPct[i + 1], left = 100 - M.chPct[i];
    const st = STEPS.filter(q => q.ch === c.id), raw = st.map(q => 100 * (M.area[q.id - 1] - M.area[q.id]) / M.stripArea), rd = lrRound(raw, v);   /* egész m²-ből: a részek összege a sor értéke */
    const parts = st.map((q, j) => ({ k: KW[q.key] || q.key, r: rd[j], v: raw[j] })).filter(q => q.r >= 1).sort((a, b) => b.v - a.v), cs = capShare(c.id);
    const kw = (parts.length ? parts.map(q => q.k + ' ' + q.r + '%').join(' · ') : 'helyet alig vesz el' + (cs >= 1 ? ' · de a szabad hely ' + cs + '%-át kis koronára szorítja' : '')) + (c.src === 'ek' ? ' · tájékoztató adat' : '');
    return '<div class="wr" style="--c:' + CHCOL[c.id] + '"><div class="wl"><i></i>' + esc(c.label) + ' <b>−' + pcs(v) + '</b></div><div class="wb"><u style="left:' + left + '%;width:' + v + '%"></u></div><div class="wk">' + kw + '</div></div>'; }).join('');
  const free = '<div class="wr" style="--c:' + FREE + '"><div class="wl"><i></i>Szabad <b>' + pcs(fr) + '</b> · ' + nf(M.area[NST]) + ' m²</div><div class="wb"><u style="left:' + (100 - fr) + '%;width:' + fr + '%"></u></div></div>';
  const sum = '<div class="wr sum"><div class="wl">= a csík</div><div class="wb stk" role="img" aria-label="A közterületi sáv megoszlása">' + stackSeg().map(q => '<i style="width:' + q.v + '%;background:' + q.col + '"></i>').join('') + '</div></div>';
  return '<div class="cap">100% = a teljes közterületi sáv, ' + nf(M.stripArea) + ' m². Sorban levonjuk, ami kizárja a fát.</div><div class="wf">' + rows + free + sum + '</div>'; }
/* egyenként: ha csak ez az egy szabály lenne, a sáv mekkora részén nem állhatna fa (M.solo) */
function soloHTML() { const so = M.solo || {}, col = id => COL[(STEPS[rule(id).stage - 1] || {}).key] || NEUT;
  const ks = Object.keys(so).filter(k => !/_L$/.test(k) && RK[k] && rule(k)).sort((a, b) => so[b] - so[a]).slice(0, 6);
  const row = (id, v, lim) => '<div class="sr' + (lim ? ' lim' : '') + '" style="--c:' + (lim ? 'var(--amber)' : col(id)) + '"><span>' + RK[id] + '</span><div class="wb"><u' + (lim ? ' class="hatch"' : '') + ' style="left:0;width:' + v + '%"></u></div><b>' + pcs(v) + '</b></div>';
  const under = ks.filter(k => rule(k).ch === 4), chU = M.chPct[3] - M.chPct[4];

  return { top: ks[0], h: '<div class="cap">Ha csak ez az egy szabály lenne — a sáv ennyi százalékán nem állhatna fa:</div><div class="wf">' + ks.map(k => row(k, so[k])).join('')
    + (so.wire_L ? row('wire', so.wire_L, true) + '<div class="cap" style="color:var(--amber);margin-top:-3px">légvezeték: itt nagy koronájú fa nem nőhet (' + hm(rule('wire').d[1]) + ' m-en belül csak kis)</div>' : '') + '</div><div class="src">' + note + (under.length ? ' A föld alatti vezetékek helye tájékoztató jellegű (e-közmű).' : '') + '</div>' }; }
/* az elférő fák pöttyökben: méret = korona; borostyán pötty = parkolóhely helyén; szaggatott keret = hírközlési kábel mellett */
function treesHTML() { const T = (D.trees || []).slice().sort((a, b) => b[2] - a[2] || (b[3] + b[4]) - (a[3] + a[4])), n = [0, 0, 0, 0];
  let pk = 0, tl = 0, sh = 0; T.forEach(t => { n[t[2]]++; pk += t[3] ? 1 : 0; tl += t[4] ? 1 : 0; sh += CROWN_M2[t[2]]; });

    + '<div class="thx">≈ ' + nf(Math.round(sh / 10) * 10) + ' m² lombkorona</div>'
    + '<div class="src">Ha pontosan a szabad helyekre kerülnek, egymástól legalább ' + M.spacing + ' m-re' + (tl ? '; a kábel mellett csak kézi ásással' : '') + '. A térképen: „Elférő fák” réteg.</div>' }; }

    P.innerHTML = `<span class="eyebrow">2. kör — adattal</span><h1>Ültess ${N} fát a <em>zöldre</em></h1>
    <div class="cnt">${Array.from({ length: N }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost sm" onclick="undo()" ${n ? '' : 'disabled'}>Visszavonás</button><button class="btn" onclick="finish()" ${n === N ? '' : 'disabled'}>Kiértékelés</button></div>
    <div class="hint">${msg} ${link}</div>
    ${S.sec && S.last && !S.last.ok ? (S.last.own ? ownHTML(S.last.od) : inspHTML(S.last.ev, NST)) : ''}`; return; }
  if (S.st === 'final') { const truth = M.pct[NST], diff = S.guess - truth, fp = Math.min(S.fp || 0, FINP.length - 1), last = fp === FINP.length - 1; TB.innerHTML = 'Adat nélkül <b>' + S.r1 + '</b> · adattal <b>' + n + '</b>';
    if (S.last && S.last.probe) { P.innerHTML = '<button class="lnk" type="button" onclick="closeProbe()">‹ Vissza a mérleghez</button>' + inspHTML(S.last.ev, NST); return; }
    /* lapozható záró lapok: mérleg → hová lett a hely → egyenként → elférő fák → kérdés → tovább */
    const top = '<div class="wiz-top"><span class="eyebrow">' + FINP[fp] + ' · ' + (fp + 1) + ' / ' + FINP.length + '</span>' + '<button class="skip" type="button" onclick="restart()">Újrakezdés</button></div>'
      + '<div class="dots" aria-hidden="true">' + FINP.map((_, i) => '<i class="' + (i < fp ? 'd' : i === fp ? 'c' : '') + '"></i>').join('') + '</div>';
    const nav = '<div class="row">' + (fp > 0 ? '<button class="btn btn-ghost sm" onclick="finStep(-1)">Vissza</button>' : '') + '<button class="btn" onclick="finStep(1)">Tovább</button></div>';
    let body = '';
    if (fp === 0) { const h1 = diff >= 15 ? `Tipped: ${S.guess}%. A valóság: <em>${pc(truth)}</em>.` : `A sáv <em>${pc(truth)}</em>-án állhat fa — jól érezted.`;
      body = `<h1>${h1}</h1><div class="score"><div class="sc b1"><span>1. kör · adat nélkül</span><b>${S.r1}/${N}</b></div><div class="sc b2"><span>2. kör · adattal</span><b>${n}/${N}</b></div></div>
      <div class="src">Koppints bárhová a sávban: megmutatjuk, mi van ott.</div>${nav}`; }
    else if (fp === 1) body = `<h1>A ${nf(M.stripArea)} m²-es sávból <em>${nf(M.area[NST])} m²</em> maradt</h1>${wfHTML()}${nav}`;
    else if (fp === 2) { const so = soloHTML(), w = RK[so.top] || '';
      body = `<h1>${nevelo(w)} ${w} egyedül a sáv <em>${pc(M.solo[so.top])}</em>-át zárná ki</h1>${so.h}${nav}`; }
    else if (fp === 3) { const tr = treesHTML(); body = `<h1><em>${tr.n} új fa</em> férne el a ${Math.round(M.len)} méteren</h1>${tr.h}${nav}`; }
    else if (fp === 4) body = `<h1>Melyik rész lepett meg a legjobban?</h1>
      <div class="poll">${CH.map(c => `<button type="button" class="${S.poll === c.id ? 'on' : ''}" onclick="poll(${c.id})"><i style="background:${CHCOL[c.id]}"></i>${esc(c.label)}</button>`).join('')}</div>
      ${S.poll ? '<div class="src">Köszönjük — ez is adat.</div>' : ''}${nav}`;
    else { const groups = [['elo', 'Itt, ezen az utcán mérve'], ['papir', 'Papíron dől el — ültetés előtt tisztázni kell'], ['godor', 'Csak a próbagödör mutatja meg'], ['faj', 'Nem a helyet, hanem a fajt és a méretet szűkíti'], ['opt', 'Rangsorol: hol ér a legtöbbet a fa'], ['nincs', 'Ezen a szakaszon nincs, vagy a játék nem vizsgálta'], ['videk', 'Csak vidéken és erdőben számít']];
      const nx = GV.nextGame('fahely'), cat = groups.map(([k, t]) => { const it = D.catalog.filter(q => q[4] === k); return it.length ? '<h4>' + t + ' · ' + it.length + '</h4><p>' + it.map(q => esc(q[1])).join(' · ') + '</p>' : ''; }).join('');
      body = `<h1>A szabad <em>${pc(truth)}</em>-ot az találja meg elsőre, aki minden réteget egy térképen lát</h1>
    <p>Behajtók, légvezeték, meglévő fák, közművek — még az ígéret előtt, nem a gödör mellett.</p>
    <details class="cat"><summary>Honnan vannak az adatok, és mit nem mutat a térkép</summary>
    <p>Az utca, a kerítések, a behajtók, az oszlopok és a fák az OpenStreetMapből származnak (${esc(dateHu(M.osmDate))} állapot). A föld alatti vezetékek az e-közmű lakossági térképe alapján, egyszerűsítve kerültek ide: tájékoztató jellegűek, hiteles adatot a közműegyeztetés ad, és a házi bekötések egy része a nyilvántartásból is hiányozhat. A távolságok jellemző értékek, nem jogi állásfoglalás; az úttest, a járda és a behajtók szélessége becsült. A közterületi sáv határa is közelítés, nem ingatlan-nyilvántartási adat: a szegélytől az első kerítésig vagy házfalig tart, ahol pedig nincs ilyen (park, tér), ott a szegélytől ${Math.round(Math.max.apply(null, G.lim.R) - M.half)}, illetve ${Math.round(Math.max.apply(null, G.lim.L) - M.half)} méterig.</p>
    <h4>${D.catalog.length} szempontból ${M.roles.elo}-et vizsgált itt a játék a térképen</h4>${cat}</details>
    <div class="src">A föld alatti vezetékek helye tájékoztató jellegű (az e-közmű lakossági térképe alapján); a távolságok jellemző értékek. A rétegeket a panel fölötti kapcsolókkal nézheted meg.</div>
    <div class="row"><button class="btn btn-ghost sm" onclick="finStep(-1)">Vissza</button><a class="btn gv-next" href="${esc(GV.urlFor(nx.file))}" onclick="return Date.now() - (S.finT || 0) > 600">Következő: ${esc(nx.n)} →</a></div>`; }
    P.innerHTML = top + body.replace('<h1>', '<h1 tabindex="-1">'); return; }
}

/* ---------- lépések ---------- */
function introNext() { S.intro++; render(); applyScene(); if (seg()) cam(true); focusMain(); }
function guess(g) { S.guess = g; S.st = 'blind'; render(); applyScene(); cam(true); preloadArt(); }
function startWizard() { S.ghosts = S.trees; S.trees = []; S.ghosts.forEach(t => { t.el.classList.add('ghost'); t.on = true; }); S.step = 0; S.tStep = Date.now(); stepBy(1); }
function stepBy(d) { const k = S.step + d; if (k < 1) return; const now = Date.now(); if (S.step >= 1) S.dwell[S.step - 1] = (S.dwell[S.step - 1] || 0) + Math.round((now - S.tStep) / 100) / 10; S.tStep = now;
  if (k > NST) return toMid();
  const prev = S.step; S.step = k; S.st = 'wiz'; markGhosts(k, d > 0 ? prev : null); render(); applyScene(); focusStep(true); P.scrollTop = 0; focusMain(); }
/* billentyűzettel játszóknak: az újrarajzolt panel fő gombja kapja a fókuszt (érintőképernyőn nem nyúlunk hozzá) */
function focusMain() { if (!FINE) return; let b = P.querySelector('.row .btn:not(.btn-ghost)'); if (S.st === 'final' && (!b || b.tagName === 'A')) b = P.querySelector('h1');   /* a záró lapon a linkre nem tesszük a fókuszt: egy nyomva tartott Enter kivinné a játékból */ if (b) { try { b.focus({ preventScroll: true }); } catch (e) {} } }
/* kamera a lépéshez — asztali gépen az egész utca látszik, nem mozdul; keskeny képernyőn: ha most esett ki egy fád, oda;
   ha a réteg kieső része már látszik, maradunk; különben odacsúszunk */
function focusStep(anim) { if (!seg()) return fitStreet(anim); const k = S.step, dead = S.ghosts.find(t => FH.stateAt(t.ev, k - 1).alive && !FH.stateAt(t.ev, k).alive), half = innerWidth / segPx() / 2;
  if (dead) return focusSeg(AX.st(dead.x, dead.y).s, anim, 600);
  if (S.segS != null && Math.abs(SHOW[k] - S.segS) < half * 0.7) return focusSeg(S.segS, anim, 400);
  focusSeg(SHOW[k], anim, 600); }
function skipWizard() { S.skipped = true; toMid(); }
function toMid() { S.step = NST; S.r1 = aliveN(NST); S.st = 'mid'; S.last = null; markGhosts(NST, null); render(); applyScene(); cam(true); P.scrollTop = 0; preloadHiba(); }
function bestFreeS() { let best = 0, bs = AX.L / 2; const half = seg() ? innerWidth / segPx() / 2 : 30; for (let s = 28; s <= AX.L - 28; s += 6) { let nn = 0; for (const p of S.freePts) if (Math.abs(AX.st(p[0], p[1]).s - s) < half) nn++; if (nn > best) { best = nn; bs = s; } } return bs; }
function startInformed() { clearProbe(); S.st = 'inf'; S.last = null; S.tries = 0; S.sec = false; render(); applyScene(); cam(true); }
function finish() { clearProbe(); S.st = 'final'; S.last = null; S.flash = 0; LC.set('final', true); LC.set('free', true); LC.set('ghost', true);
  GV.record('fahely', { ds: M.id, score: S.r1, guess: S.guess, truth: M.pct[NST],
    blind: { alive: S.r1, pts: S.ghosts.map(t => { const st = FH.stateAt(t.ev, NST); return [+t.x.toFixed(1), +t.y.toFixed(1), st.alive ? 0 : rule(st.by.id).ch, st.alive ? '' : st.by.id, st.crown]; }) },
    informed: { score: S.trees.length, tries: S.tries, pts: S.trees.map(t => [+t.x.toFixed(1), +t.y.toFixed(1), t.ev.crown, t.ev.flags.park ? 1 : 0]) },
    skipped: S.skipped ? 1 : 0, dwell: S.dwell, d3: S.d3 ? 1 : 0, dur: Math.round((Date.now() - S.t0) / 1000), vw: innerWidth });
  S.fp = 0; render(); applyScene(); fitStreet(true); P.scrollTop = 0; focusMain(); }
const FINP = ['Az utca mérlege', 'Hová lett a hely?', 'Egyenként', 'Elférő fák', 'Egy kérdés', 'Tovább'];
function finStep(d) { const k = (S.fp || 0) + d, now = Date.now(); if (k < 0 || k >= FINP.length || now - (S.finT || 0) < 250) return; S.finT = now; S.fp = k; render(); P.scrollTop = 0; focusMain(); }
function restart() { location.reload(); }
function poll(i) { if (S.poll) return; S.poll = i; GV.record('velemeny', { about: 'fahely', q: 'meglepett', a: CH[i - 1].label }); render();
  if (FINE) { const b = P.querySelector('.poll button.on'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} } }
/* billentyűk: a varázslóban Enter vagy → = Tovább, ← = Vissza; a záró lapokon → és ← lapoz */
document.addEventListener('keydown', e => { if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^Arrow/.test(e.key) && e.target && e.target.closest && e.target.closest('.maplibregl-map')) return;   /* a térképen a nyilak a térképet mozgatják */
  if (S.st === 'final' && !(S.last && S.last.probe)) { if (e.key === 'ArrowRight') { e.preventDefault(); finStep(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); finStep(-1); } return; }
  if (S.st !== 'wiz') return; const tag = (e.target && e.target.tagName) || '';
  if (e.key === 'ArrowRight' || (e.key === 'Enter' && !/^(BUTTON|A|INPUT|SUMMARY)$/.test(tag))) { e.preventDefault(); stepBy(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(-1); } });
/* ---------- indulás ---------- */
function start() { render(); fetch('data/fahely-diosd-kossuth.json?v=16').then(r => { if (!r.ok) throw new Error('adat'); return r.json(); }).then(init).catch(() => { document.body.classList.add('maperr'); SHEET.style.display = 'none'; }); }
start();
</script>
<script>window.addEventListener('pageshow',function(){document.body.style.opacity='';document.body.classList.add('in');});</script>
