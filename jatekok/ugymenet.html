<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ügymenet — GEOVERN játékok</title>
<meta name="description" content="Pipedrive-szerű ügymenet az önkormányzatban: a lakossági kérések kártyái lépcsőkön haladnak — beérkezett, adat, döntés, végrehajtás, mérve. Húzd a kártyákat balról jobbra. Hat hét, 300 millió, tizenkét ügy.">
<meta name="theme-color" content="#050f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23FF9F45' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FF9F45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js?v=4"></script>
<script src="gv.js?v=4"></script>
<style>
:root{--bg:#050f14;--panel:rgba(6,17,22,.9);--col:rgba(15,74,87,.16);--teal:#2AD1B5;--amber:#FF9F45;--red:#ff6b4a;--green:#3ddc97;--blue:#4aa8ff;
  --text:#EAF4F4;--muted:#9BB7BC;--faint:#5E7A80;--line:rgba(42,209,181,.25);--font:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  --gv-accent:var(--teal);--gv-accent-ink:#04211d;--gv-line:var(--line);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;min-height:100vh;display:flex;flex-direction:column;overscroll-behavior-x:none;background-image:radial-gradient(900px 600px at 70% 10%,rgba(15,74,87,.5),transparent 60%)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;max-width:1100px;width:100%;margin:0 auto}
.home{font:700 11px var(--mono);letter-spacing:.06em;color:var(--teal);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:100px;white-space:nowrap}
.ttl{text-align:right;font:900 16px var(--font)}.ttl small{display:block;font:500 11px var(--mono);color:var(--muted);line-height:1.1}
/* fejléc-sáv */
.bar{display:flex;gap:8px;align-items:center;padding:0 12px 8px;max-width:1100px;width:100%;margin:0 auto;flex-wrap:wrap}
.k{background:var(--col);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;min-width:84px}
.k span{display:block;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k b{display:block;font:900 16px var(--font);line-height:1.1}.k.m b{color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font:900 14px var(--font);cursor:pointer;border:none;background:var(--teal);color:#04211d;min-height:42px;touch-action:manipulation;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted);padding:0 12px 6px;max-width:1100px;width:100%;margin:0 auto}
/* tábla */
.board{flex:1;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 12px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;max-width:1100px;width:100%;margin:0 auto;scrollbar-width:thin}
.col{flex:0 0 clamp(168px,47vw,230px);max-width:230px;background:var(--col);border:1px solid rgba(255,255,255,.06);border-radius:14px;display:flex;flex-direction:column;scroll-snap-align:start;transition:border-color .15s,background .15s;min-height:0}
@media(min-width:900px){.col{flex:1 1 0;max-width:none}}
.col.over{border-color:var(--teal);background:rgba(42,209,181,.12)}
.col.bad{border-color:var(--red);background:rgba(255,107,74,.08)}
.ch{padding:10px 10px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.ch b{display:block;font:900 14px var(--font)}.ch span{font:500 11px var(--mono);color:var(--muted)}
.ch .cost{color:var(--amber)}
.cards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:120px}
/* kártya */
.card{background:#0c1a21;border:1px solid rgba(143,176,181,.22);border-radius:12px;padding:10px 10px 8px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;transition:box-shadow .15s}
.card:active{cursor:grabbing}
.card.urgent{border-color:rgba(255,107,74,.6)}
.card.ghost{opacity:.35}
.card h3{font:700 14px/1.25 var(--font);margin-bottom:6px;padding-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;font:500 11px var(--mono);color:var(--muted)}
.chips b{color:var(--text);font-weight:500}
.chips .l{color:var(--amber)}.chips .dl{color:var(--red)}
.imp{display:inline-block;font:700 11px var(--mono);padding:2px 7px;border-radius:100px;background:rgba(61,220,151,.15);color:var(--green)}
.imp.lo{background:rgba(255,107,74,.15);color:var(--red)}
.imp.q{background:rgba(143,176,181,.15);color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}
.vak{position:absolute;right:8px;top:8px;font:700 9px var(--mono);letter-spacing:.1em;color:var(--amber);border:1px solid rgba(255,159,69,.5);padding:2px 6px;border-radius:100px}
.card.done{opacity:.55;cursor:default}
.drag{position:fixed;z-index:100;pointer-events:none;width:200px;transform:rotate(2deg);box-shadow:0 20px 50px rgba(0,0,0,.6)}
/* elutasítás célzóna */
.lost{margin:0 12px calc(10px + var(--sab));max-width:1100px;width:calc(100% - 24px);align-self:center;border:1.5px dashed rgba(255,107,74,.5);border-radius:12px;padding:10px;text-align:center;font:700 12px var(--mono);letter-spacing:.1em;color:var(--red);transition:.15s}
.lost.over{background:rgba(255,107,74,.18);border-style:solid}
/* menü koppintásra */
.menu{position:fixed;z-index:90;background:#0c1a21;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px;min-width:200px}
.menu button{text-align:left;font:700 13px var(--font);padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--text);cursor:pointer}
.menu button:hover{background:rgba(42,209,181,.12)}.menu button.r{color:var(--red)}
/* intro / modal / vég */
.ov{position:fixed;inset:0;background:rgba(3,14,18,.8);z-index:80;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px)}
.ev{background:#0c1a21;border:1px solid var(--line);border-radius:18px;padding:18px 16px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:84vh;overflow:auto}
.ev h1{font:900 clamp(24px,6.5vw,30px)/1.1 var(--font);margin-bottom:8px}.ev h2{font:900 18px/1.2 var(--font);margin-bottom:6px}
.ev p{color:var(--muted);font-size:14.5px}.ev p+p{margin-top:6px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.18em;color:var(--teal);text-transform:uppercase;display:block;margin-bottom:6px}
.ev ul{list-style:none;margin-top:10px;display:grid;gap:6px}.ev li{background:var(--col);border-radius:10px;padding:8px 10px;font-size:14px}
.ev li.bad{border-left:3px solid var(--red)}.ev li.good{border-left:3px solid var(--green)}.ev li.info{border-left:3px solid var(--blue)}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.steps div{background:var(--col);border-radius:8px;padding:6px 2px;text-align:center;font:700 10px var(--mono);color:var(--muted);text-transform:uppercase}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sc div{background:var(--col);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px}
.sc span{display:block;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.sc b{display:block;font:900 22px var(--font)}.sc small{color:var(--muted);font-size:12px}
.big{font:900 54px/1 var(--font);color:var(--teal)}.big small{font:700 13px var(--mono);color:var(--muted)}
.msg{border-left:3px solid var(--amber);background:rgba(255,159,69,.08);padding:9px 12px;border-radius:0 10px 10px 0;margin-top:10px;font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:95;background:#0c1a21;border:1px solid var(--line);border-radius:100px;padding:9px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><a class="home" id="homelink" href="../jatekok.html">← JÁTÉKOK</a><div class="ttl" id="ttl"><span data-town>Ügymenet</span><small>6 hét · 300 M Ft</small></div></header>
<div class="bar" id="bar"></div>
<div class="hint" id="hint">Húzd a kártyákat balról jobbra a következő lépcsőre. Koppintásra menü nyílik.</div>
<div class="board" id="board"></div>
<div class="lost" id="lost">✕ ELUTASÍT — húzd ide</div>
<div class="toast" id="toast"></div>
<div id="ov"></div>
<script>
/* =====================================================================
   ÜGYMENET — Pipedrive-szerű tábla: oszlopok = lépcsők, a kártyák húzhatók balról jobbra
   Beérkezett → Adat (1 M) → Döntés → Végrehajtás (költség) → Mérve (1 M, nyert) · Elutasít (lent)
   Hangerő látszik, a hatás csak az Adat lépcső után. Vakon (Adat nélkül) is dönthetsz — csak később derül ki, mit ért.
   ===================================================================== */
document.getElementById('homelink').href=GV.hubUrl();
const townTxt=GV.TOWN.name?GV.esc(GV.TOWN.name):'a település';
const ST=['Beérkezett','Adat','Döntés','Végrehajtás','Mérve'];
const WEEKS=6,BUDGET=300;
const CASES=[
 {t:'Zebra az iskola kapuja elé',loud:5,cost:6,imp:2,dl:2,d:'A balesetek a 300 m-es kereszteződésben vannak, nem a kapunál.'},
 {t:'Csillapítás a lakótelepi kereszteződésben',loud:1,cost:8,imp:9,dl:4,d:'Itt történik a gyerekbalesetek 70%-a.'},
 {t:'Mobil gát a Fő utcára',loud:4,cost:60,imp:3,dl:2,d:'A károk a lejtőn sorakoznak — a gát a tünetet kezeli.'},
 {t:'Árkok, átereszek tisztítása',loud:1,cost:9,imp:8,dl:4,d:'Az elöntés 80%-a két eltömődött áteresznél keletkezik.'},
 {t:'Díszfák a főtérre',loud:4,cost:12,imp:2,dl:2,d:'A főtéren már van lombkorona; a hőgóc a lakótelepen van.'},
 {t:'Hűsítő pont a rendelő körül',loud:2,cost:14,imp:9,dl:4,d:'Hőtérkép, idősek és gyalogos forgalom itt metszi egymást.'},
 {t:'Földkábel a főutcán',loud:3,cost:90,imp:2,dl:3,d:'A kimaradások 85%-a két külső szakaszon van.'},
 {t:'Két külső gócszakasz megerősítése',loud:1,cost:25,imp:8,dl:4,d:'A hibalista szerint itt szakad a hálózat.'},
 {t:'Saját városi app hőségre',loud:3,cost:45,imp:1,dl:3,d:'A lakók 4%-a töltené le. Aki rosszul van, nem appot keres.'},
 {t:'SMS-riasztás + önkéntesek',loud:1,cost:3,imp:7,dl:4,d:'A háziorvosi lista a 75+ lakók 80%-át eléri.'},
 {t:'Nagy záportározó',loud:4,cost:150,imp:4,dl:3,d:'Egy kockázatot kezel, három évig épül.'},
 {t:'Esőkertek a mélypontokon',loud:1,cost:36,imp:9,dl:4,d:'Tíz mélypont, ott gyűlik a víz. Fél év, hűsít is.'}];
let G=null;
const $=id=>document.getElementById(id);
function start(){G={st:'play',week:1,money:BUDGET,sat:50,cases:[],log:[],pending:null};arrive();render();}
function arrive(){const n=G.cases.length;const b=CASES.slice(n,n+2).map((c,i)=>Object.assign({id:n+i,stage:0,known:false,blind:false,lost:false,won:false,measured:false,dlLeft:c.dl},c));G.cases.push(...b);if(b.length)toast(b.length+' új ügy érkezett a Beérkezett oszlopba.');}
let toastT=null;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600);}
/* ---- lépés-szabályok ---- */
function canMove(c,to){ /* visszaad: {ok, cost, why} */
  if(c.lost||c.won)return{ok:false,why:'Lezárt ügy.'};
  if(to==='lost')return{ok:true,cost:0};
  if(to<=c.stage)return{ok:false,why:'Visszafelé nem megy — a pipeline előre halad.'};
  if(to===1)return G.money>=1?{ok:true,cost:1}:{ok:false,why:'Nincs 1 M az adatra.'};
  if(to===2)return c.stage<=1?{ok:true,cost:0}:{ok:false};
  if(to===3)return c.stage===2?(G.money>=c.cost?{ok:true,cost:c.cost}:{ok:false,why:'Nincs rá keret: '+c.cost+' M kell.'}):{ok:false,why:'Előbb döntés kell.'};
  if(to===4)return c.stage===3?(G.money>=1?{ok:true,cost:1}:{ok:false,why:'Nincs 1 M a mérésre.'}):{ok:false,why:'Előbb a végrehajtás.'};
  return{ok:false};}
function move(id,to){const c=G.cases.find(x=>x.id===id);const r=canMove(c,to);if(!r.ok){if(r.why)toast(r.why);render();return false;}
  G.money-=r.cost;
  if(to==='lost'){c.lost=true;c.rejBlind=!c.known;G.log.push({id,what:'reject',week:G.week,blind:!c.known});if(!c.known&&c.loud>=3){G.sat-=3;toast('Elutasítva adat nélkül — a lakók felháborodtak (−3).');}else toast(c.known?'Elutasítva, adattal indokolva.':'Elutasítva.');}
  else{if(to===1){c.known=true;G.log.push({id,what:'data',week:G.week});toast('Adat: hatás '+c.imp+'/10.');}
    if(to===2){c.blind=!c.known;G.log.push({id,what:'decide',week:G.week,blind:c.blind});if(c.blind)toast('Vakon jóváhagyva — a hatás majd a végrehajtás után derül ki.');}
    if(to===3){G.log.push({id,what:'exec',week:G.week});if(!c.known){c.known=true;toast('Most derül ki: hatás '+c.imp+'/10 — '+c.cost+' M-ért.');}}
    if(to===4){c.won=true;c.measured=true;G.log.push({id,what:'measure',week:G.week});toast('Mérve, lezárva.');}
    c.stage=to;}
  render();return true;}
function nextWeek(){const ev=[];
  G.cases.forEach(c=>{if(c.lost||c.won)return;if(c.stage<=2){c.dlLeft--;if(c.dlLeft<0){c.lost=true;c.expired=true;G.sat-=5;ev.push({cls:'bad',t:'„'+c.t+'” — lejárt a lakók türelme, az ügy elhalt (−5).'});}}});
  const n=G.cases.filter(c=>c.stage===3&&!c.won).length;if(n)ev.push({cls:'info',t:n+' ügy végrehajtás alatt — mérés nélkül nem zárul le.'});
  if(G.week>=WEEKS){finish();return;}
  G.week++;arrive();G.pending={title:G.week+'. hét',items:ev};render();}
/* ---- render ---- */
function cardHtml(c){const dead=c.lost||c.won;const urgent=!dead&&c.stage<=2&&c.dlLeft<=1;
  return `<div class="card ${urgent?'urgent':''} ${dead?'done':''}" data-id="${c.id}">${c.blind&&!dead?'<span class="vak">VAK</span>':''}<h3>${GV.esc(c.t)}</h3>
   <div class="chips"><span class="l">${'🔊'.repeat(c.loud)}</span><span><b>${c.cost} M</b></span>${!dead&&c.stage<=2?`<span class="${c.dlLeft<=1?'dl':''}">⏳ ${Math.max(0,c.dlLeft)} hét</span>`:''}
   ${c.known?`<span class="imp ${c.imp<=3?'lo':''}">hatás ${c.imp}/10</span>`:'<span class="imp q">hatás ?</span>'}</div>
   ${c.known?`<div class="note">${c.d}</div>`:''}</div>`;}
function render(){
  if(!G||G.st==='intro'){$('ttl').innerHTML='<span>'+townTxt+'</span><small>6 hét · 300 M Ft</small>';$('bar').innerHTML='';$('board').innerHTML='';$('hint').textContent='';$('lost').style.display='none';
    $('ov').innerHTML=`<div class="ov"><div class="ev"><span class="eyebrow">Folyamatjáték · 3–4 perc</span><h1>Ügymenet</h1>
     <p>Minden lakossági kérés egy kártya. Húzd balról jobbra a lépcsőkön — mint egy CRM-ben:</p>
     <div class="steps">${ST.map(s=>`<div>${s}</div>`).join('')}</div>
     <p>Az <b style="color:var(--text)">Adat</b> 1 millió, és megmutatja az ügy valódi hatását. Dönthetsz nélküle is — a hangos ügy nem mindig a fontos. A lakók türelme a határidő.</p>
     <p>Hat hét, 300 millió, tizenkét ügy.</p><div class="row"><button class="btn" onclick="start()">Indul a hat hét</button></div></div></div>`;return;}
  if(G.st==='final'){renderFinal();return;}
  $('lost').style.display='';$('ttl').innerHTML=`<span>${G.week}. hét / ${WEEKS}</span><small>${townTxt}</small>`;
  $('bar').innerHTML=`<div class="k m"><span>Keret</span><b>${G.money} M</b></div><div class="k"><span>Elégedettség</span><b>${G.sat}</b></div><div class="k"><span>Nyitott</span><b>${G.cases.filter(c=>!c.lost&&!c.won).length}</b></div><div class="spacer"></div><button class="btn" onclick="nextWeek()">${G.week>=WEEKS?'Lezárás ▶':'Következő hét ▶'}</button>`;
  $('hint').textContent=G.week===1&&G.log.length<2?'Húzd a kártyákat balról jobbra a következő lépcsőre. Koppintásra menü nyílik.':'';
  $('board').innerHTML=ST.map((s,i)=>{const cs=G.cases.filter(c=>!c.lost&&c.stage===i);const sum=cs.reduce((a,c)=>a+c.cost,0);
    return `<div class="col" data-stage="${i}"><div class="ch"><b>${s}</b><span>${cs.length} ügy · <i class="cost">${sum} M</i></span></div><div class="cards">${cs.map(cardHtml).join('')}</div></div>`;}).join('');
  $('ov').innerHTML=G.pending?`<div class="ov"><div class="ev"><span class="eyebrow">Heti jelentés</span><h2>${G.pending.title}</h2><p>${G.money} M keret · ${G.cases.filter(c=>!c.lost&&!c.won).length} nyitott ügy · elégedettség ${G.sat}.</p>
    ${G.pending.items.length?`<ul>${G.pending.items.map(i=>`<li class="${i.cls}">${i.t}</li>`).join('')}</ul>`:''}<div class="row"><button class="btn" onclick="G.pending=null;render()">Rendben</button></div></div></div>`:'';
  bindDrag();}
/* ---- húzás (pointer events) + koppintás-menü ---- */
let drag=null;
function bindDrag(){document.querySelectorAll('.card').forEach(el=>{if(el.classList.contains('done'))return;el.addEventListener('pointerdown',onDown);});}
function onDown(e){const el=e.currentTarget;const id=+el.dataset.id;const r=el.getBoundingClientRect();
  drag={id,el,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false,ghost:null};
  el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',onMove);el.addEventListener('pointerup',onUp);el.addEventListener('pointercancel',onUp);}
function onMove(e){if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){if(Math.hypot(dx,dy)<8)return;drag.moved=true;const g=drag.el.cloneNode(true);g.classList.add('drag');g.style.width=drag.el.offsetWidth+'px';document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('ghost');}
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const t=targetAt(e.clientX,e.clientY);document.querySelectorAll('.col.over,.col.bad').forEach(c=>c.classList.remove('over','bad'));$('lost').classList.toggle('over',t==='lost');
  if(typeof t==='number'){const col=document.querySelector(`.col[data-stage="${t}"]`);const c=G.cases.find(x=>x.id===drag.id);col.classList.add(canMove(c,t).ok?'over':'bad');}
  drag.x=e.clientX;if(!drag.scroll)drag.scroll=setInterval(()=>{if(!drag)return;const b=$('board');const br=b.getBoundingClientRect();if(drag.x>br.right-44)b.scrollLeft+=6;else if(drag.x<br.left+44)b.scrollLeft-=6;},16);}
function targetAt(x,y){const lr=$('lost').getBoundingClientRect();if(y>=lr.top-6&&y<=lr.bottom+6&&x>=lr.left&&x<=lr.right)return'lost';
  for(const col of document.querySelectorAll('.col')){const r=col.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return+col.dataset.stage;}return null;}
function onUp(e){if(!drag)return;const d=drag;drag=null;clearInterval(d.scroll);d.el.removeEventListener('pointermove',onMove);d.el.removeEventListener('pointerup',onUp);d.el.removeEventListener('pointercancel',onUp);
  if(d.ghost)d.ghost.remove();d.el.classList.remove('ghost');document.querySelectorAll('.col.over,.col.bad').forEach(c=>c.classList.remove('over','bad'));$('lost').classList.remove('over');
  if(!d.moved){openMenu(d.id,e.clientX,e.clientY);return;}
  const t=targetAt(e.clientX,e.clientY);const c=G.cases.find(x=>x.id===d.id);if(t===null||t===c.stage)return;move(d.id,t);}
function openMenu(id,x,y){closeMenu();const c=G.cases.find(q=>q.id===id);if(!c||c.lost||c.won)return;const m=document.createElement('div');m.className='menu';m.id='menu';
  const opts=[];if(c.stage===0)opts.push([1,'🔍 Adat kérése · 1 M'],[2,'Jóváhagyás adat nélkül']);if(c.stage===1)opts.push([2,'✅ Jóváhagyás']);if(c.stage===2)opts.push([3,'🏗️ Végrehajtás · '+c.cost+' M']);if(c.stage===3)opts.push([4,'📏 Mérés, lezárás · 1 M']);
  m.innerHTML=opts.map(o=>`<button onclick="closeMenu();move(${id},${o[0]})">${o[1]}</button>`).join('')+`<button class="r" onclick="closeMenu();move(${id},'lost')">✕ Elutasít${c.known?' (indokolt)':''}</button>`;
  document.body.appendChild(m);const w=Math.min(220,innerWidth-16);m.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-8,y+12)+'px';}
function closeMenu(){const m=$('menu');if(m)m.remove();}
document.addEventListener('pointerdown',e=>{const m=$('menu');if(m&&!m.contains(e.target))closeMenu();});
/* ---- lezárás ---- */
function finish(){G.st='final';clearTimeout(toastT);$('toast').classList.remove('on');
  const done=G.cases.filter(c=>c.stage>=3);const impact=done.reduce((a,c)=>a+c.imp*(c.measured?1.2:1),0);const spent=BUDGET-G.money;
  const sorted=CASES.slice().sort((a,b)=>b.imp/b.cost-a.imp/a.cost);let b=BUDGET,best=0;sorted.forEach(c=>{if(c.cost+3<=b){b-=c.cost+3;best+=c.imp*1.2;}});
  const sImp=Math.round(Math.min(1,impact/best)*40);const dec=G.log.filter(l=>l.what==='decide'||l.what==='reject');const inf=dec.length?Math.round(dec.filter(l=>!l.blind).length/dec.length*100):0;const sInf=Math.round(inf/100*30);
  const meas=done.length?Math.round(done.filter(c=>c.measured).length/done.length*100):0;const sMeas=Math.round(meas/100*15);const sSat=Math.round(Math.max(0,Math.min(1,(G.sat-20)/50))*15);const total=sImp+sInf+sMeas+sSat;
  const loudWaste=done.filter(c=>c.loud>=3&&c.imp<=3).reduce((a,c)=>a+c.cost,0);
  G.result={total,sImp,sInf,sMeas,sSat,impact:Math.round(impact),best:Math.round(best),inf,meas,spent,loudWaste,expired:G.cases.filter(c=>c.expired).length};
  GV.record('ugymenet',{score:total,parts:{impact:sImp,informed:sInf,measured:sMeas,sat:sSat},informedShare:inf,measuredShare:meas,spent,impact:Math.round(impact),loudWaste,cases:G.cases.map(c=>[c.id,c.stage,c.known,c.blind,c.lost,c.won,c.measured])});
  render();}
function renderFinal(){const R=G.result;$('ttl').innerHTML=`<span>Lezárás</span><small>${townTxt}</small>`;$('bar').innerHTML='';$('board').innerHTML='';$('hint').textContent='';$('lost').style.display='none';
  $('ov').innerHTML=`<div class="ov"><div class="ev"><span class="eyebrow">A hat hét lenyomata</span><div class="big">${R.total} <small>/ 100</small></div>
   <h2 style="margin-top:6px">${R.loudWaste>0&&R.sInf<20?'A hangerő vitte a pénzt. Így jár a legtöbb hivatal.':R.total>=70?'Adat-kapu a döntés előtt. Így megy a pipeline.':R.sInf<20?'Sok vak döntés — szerencséd volt, nem rendszered.':'Jó irány: adat a döntés előtt. A következő lépés a mérés.'}</h2>
   <div class="sc"><div><span>Hatás a pénzért</span><b>${R.sImp} / 40</b><small>${R.impact} a lehetséges ${R.best}-ból</small></div><div><span>Adattal döntött</span><b>${R.sInf} / 30</b><small>a döntések ${R.inf}%-a</small></div>
   <div><span>Mérve lezárt</span><b>${R.sMeas} / 15</b><small>${R.meas}% a végrehajtottakból</small></div><div><span>Elégedettség</span><b>${R.sSat} / 15</b><small>${G.sat} pont, ${R.expired} elhalt ügy</small></div></div>
   ${R.loudWaste?`<div class="msg">${R.loudWaste} M ment hangos, de kis hatású ügyekre. Az Adat lépcső 1 millió lett volna ügyenként.</div>`:'<div class="msg">Egyetlen hangos, kis hatású ügyre sem költöttél. Ez a különbség a pipeline és a panaszláda között.</div>'}
   <div class="row"><button class="btn btn-ghost" onclick="G=null;render()">Újra</button></div>
   ${GV.endPanel({game:'ugymenet',share:'Ügymenet: '+R.total+'/100 — a döntéseim '+R.inf+'%-a adattal.'})}</div></div>`;}
render();
</script>
